<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Grid — QuarkMind Concept</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e1e; color: #ccc; font-family: monospace; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 16px; left: 16px;
    background: rgba(10,10,30,0.85);
    border: 1px solid #2a2a5e;
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 12px;
    line-height: 1.8;
    max-width: 220px;
  }
  #ui h3 { color: #88bbff; margin-bottom: 8px; font-size: 13px; }
  #ui .key { color: #ffcc44; }
  #hud {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(10,10,30,0.75);
    border: 1px solid #2a2a5e;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 11px;
    color: #88bbff;
  }
  #angle-btns {
    position: absolute; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .angle-btn {
    background: rgba(10,10,30,0.85);
    border: 1px solid #2a2a5e;
    border-radius: 6px;
    color: #aaaacc;
    font-family: monospace;
    font-size: 11px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .angle-btn:hover { border-color: #88bbff; color: #88bbff; }
  .angle-btn.active { border-color: #88bbff; color: #88bbff; background: rgba(40,60,120,0.5); }
</style>
</head>
<body>
<div id="ui">
  <h3>3D Grid — Concept</h3>
  <div><span class="key">Drag</span> — rotate camera</div>
  <div><span class="key">Scroll</span> — zoom</div>
  <div><span class="key">Right-drag</span> — pan</div>
  <br>
  <div style="color:#666; font-size:11px;">Units: blue=friendly, red=enemy<br>Terrain: walls raised, ramps graded</div>
</div>
<div id="angle-btns">
  <button class="angle-btn" onclick="setAngle('top')">Top-down</button>
  <button class="angle-btn active" onclick="setAngle('iso')">Isometric</button>
  <button class="angle-btn" onclick="setAngle('low')">Low angle</button>
</div>
<div id="hud">Minerals: 450 &nbsp;|&nbsp; Gas: 100 &nbsp;|&nbsp; Supply: 14/22 &nbsp;|&nbsp; Frame: 312</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene setup ──────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.022);

const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Lighting ─────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x223355, 0.8);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xaabbff, 1.2);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 200;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x334466, 0.4);
fill.position.set(-10, 20, -10);
scene.add(fill);

// ── Grid geometry ─────────────────────────────────────────────────────────────
const GRID = 20;
const TILE = 1.4;
const HALF = (GRID * TILE) / 2;

// Tile types: 0=ground, 1=wall, 2=ramp
const grid = [];
for (let z = 0; z < GRID; z++) {
  grid[z] = [];
  for (let x = 0; x < GRID; x++) {
    // border walls
    if (x === 0 || x === GRID-1 || z === 0 || z === GRID-1) { grid[z][x] = 1; continue; }
    // internal wall cluster (top-right)
    if (x >= 13 && x <= 15 && z >= 13 && z <= 17) { grid[z][x] = 1; continue; }
    if (x >= 16 && x <= 17 && z >= 14 && z <= 16) { grid[z][x] = 1; continue; }
    // ramp
    if (x === 12 && z === 13) { grid[z][x] = 2; continue; }
    grid[z][x] = 0;
  }
}

const MAT_GROUND = new THREE.MeshLambertMaterial({ color: 0x1a2233 });
const MAT_WALL   = new THREE.MeshLambertMaterial({ color: 0x334455 });
const MAT_RAMP   = new THREE.MeshLambertMaterial({ color: 0x2a3a44 });
const MAT_GRID   = new THREE.MeshLambertMaterial({ color: 0x0e1525, transparent: true, opacity: 0.95 });

for (let z = 0; z < GRID; z++) {
  for (let x = 0; x < GRID; x++) {
    const t = grid[z][x];
    const cx = x * TILE - HALF + TILE/2;
    const cz = z * TILE - HALF + TILE/2;

    if (t === 1) {
      const geo = new THREE.BoxGeometry(TILE*0.98, TILE*1.2, TILE*0.98);
      const m = new THREE.Mesh(geo, MAT_WALL);
      m.position.set(cx, TILE*0.6, cz);
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
    } else if (t === 2) {
      const geo = new THREE.BoxGeometry(TILE*0.98, TILE*0.3, TILE*0.98);
      const m = new THREE.Mesh(geo, MAT_RAMP);
      m.position.set(cx, TILE*0.15, cz);
      m.receiveShadow = true;
      scene.add(m);
    } else {
      const geo = new THREE.BoxGeometry(TILE*0.98, 0.1, TILE*0.98);
      const m = new THREE.Mesh(geo, MAT_GRID);
      m.position.set(cx, 0, cz);
      m.receiveShadow = true;
      scene.add(m);
    }

    // grid lines
    const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(TILE, 0.01, TILE));
    const lineMat = new THREE.LineBasicMaterial({ color: 0x1e2a3a, transparent: true, opacity: 0.6 });
    const line = new THREE.LineSegments(edges, lineMat);
    line.position.set(cx, 0.06, cz);
    scene.add(line);
  }
}

// ── Mineral patches ───────────────────────────────────────────────────────────
const mineralMat = new THREE.MeshLambertMaterial({ color: 0x44aaff, emissive: 0x112244 });
[[-4,2],[-3,2],[-2,2],[-4,3],[-3,3]].forEach(([dx,dz]) => {
  const geo = new THREE.BoxGeometry(0.5, 0.4, 0.5);
  const m = new THREE.Mesh(geo, mineralMat);
  const cx = dx * TILE - HALF + TILE/2;
  const cz = dz * TILE - HALF + TILE/2;
  m.position.set(cx, 0.25, cz);
  m.castShadow = true;
  scene.add(m);
  // glow ring
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.28, 0.38, 16),
    new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.set(cx, 0.06, cz);
  scene.add(ring);
});

// ── Helper: cartoon unit (sphere body + eyes) ─────────────────────────────────
function makeUnit(color, emissive, x, z, scale=1) {
  const g = new THREE.Group();
  // body
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.38 * scale, 16, 12),
    new THREE.MeshLambertMaterial({ color, emissive })
  );
  body.position.y = 0.42 * scale;
  body.castShadow = true;
  g.add(body);
  // eyes
  const eyeMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const pupilMat = new THREE.MeshLambertMaterial({ color: 0x111122 });
  [-0.14, 0.14].forEach(ex => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1 * scale, 8, 8), eyeMat);
    eye.position.set(ex * scale, 0.52 * scale, 0.32 * scale);
    g.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.055 * scale, 8, 8), pupilMat);
    pupil.position.set(ex * scale, 0.52 * scale, 0.37 * scale);
    g.add(pupil);
  });
  // shadow disc
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(0.32 * scale, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
  );
  disc.rotation.x = -Math.PI/2;
  disc.position.y = 0.06;
  g.add(disc);

  const cx = x * TILE - HALF + TILE/2;
  const cz = z * TILE - HALF + TILE/2;
  g.position.set(cx, 0, cz);
  scene.add(g);
  return g;
}

// ── Helper: building ──────────────────────────────────────────────────────────
function makeBuilding(color, emissive, x, z, w=1.8, h=1.0, d=1.8) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w*TILE*0.7, h, d*TILE*0.7),
    new THREE.MeshLambertMaterial({ color, emissive })
  );
  body.position.y = h/2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const cx = x * TILE - HALF + TILE/2;
  const cz = z * TILE - HALF + TILE/2;
  g.position.set(cx, 0, cz);
  scene.add(g);
  return g;
}

// Friendly units (blue Probes and Zealots)
const probes = [
  makeUnit(0x4488dd, 0x112244, 5, 5),
  makeUnit(0x4488dd, 0x112244, 6, 5),
  makeUnit(0x4488dd, 0x112244, 5, 6),
];
const zealot = makeUnit(0x7755cc, 0x221144, 8, 7, 1.2);

// Enemy units (red)
const enemies = [
  makeUnit(0xcc3322, 0x330000, 14, 14, 1.1),
  makeUnit(0xcc3322, 0x330000, 15, 13, 1.0),
  makeUnit(0xbb2211, 0x330000, 13, 15, 0.9),
];

// Buildings
makeBuilding(0x2255aa, 0x112244, 4, 4, 2.5, 1.4, 2.5);  // Nexus
makeBuilding(0x553399, 0x221144, 7, 4, 0.8, 1.6, 0.8);  // Pylon
makeBuilding(0x336688, 0x112233, 6, 8, 1.8, 1.1, 1.8);  // Gateway

// ── Attack line ───────────────────────────────────────────────────────────────
let attackLineAge = 0;
function makeAttackLine(from, to) {
  const points = [from.clone(), to.clone()];
  points[0].y += 0.42; points[1].y += 0.42;
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.8 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  return { line, mat };
}
const atk = makeAttackLine(zealot.position, enemies[0].position);
attackLineAge = 0;

// ── Camera orbit ──────────────────────────────────────────────────────────────
let camTheta = Math.PI / 4;
let camPhi   = Math.PI / 3.5;  // isometric start
let camDist  = 28;
let camTarget = new THREE.Vector3(0, 0, 0);

function updateCamera() {
  camera.position.x = camTarget.x + camDist * Math.sin(camPhi) * Math.sin(camTheta);
  camera.position.y = camTarget.y + camDist * Math.cos(camPhi);
  camera.position.z = camTarget.z + camDist * Math.sin(camPhi) * Math.cos(camTheta);
  camera.lookAt(camTarget);
}
updateCamera();

// Smooth angle presets
let targetPhi = camPhi, targetTheta = camTheta, targetDist = camDist;

function setAngle(preset) {
  document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (preset === 'top')  { targetPhi = 0.15; targetDist = 32; }
  if (preset === 'iso')  { targetPhi = Math.PI/3.5; targetDist = 28; }
  if (preset === 'low')  { targetPhi = Math.PI/2.3; targetDist = 22; }
}

// ── Mouse orbit ───────────────────────────────────────────────────────────────
let dragging = false, lastX = 0, lastY = 0, rightDrag = false;
renderer.domElement.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  rightDrag = e.button === 2;
  e.preventDefault();
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (rightDrag) {
    const right = new THREE.Vector3();
    camera.getWorldDirection(right);
    right.cross(camera.up).normalize();
    camTarget.addScaledVector(right, -dx * 0.04);
    camTarget.y += dy * 0.04;
    targetPhi = camPhi; targetTheta = camTheta;
  } else {
    targetTheta -= dx * 0.012;
    targetPhi = Math.max(0.1, Math.min(Math.PI/2.1, targetPhi - dy * 0.012));
  }
});
window.addEventListener('mouseup', () => { dragging = false; });
renderer.domElement.addEventListener('wheel', e => {
  targetDist = Math.max(8, Math.min(60, targetDist + e.deltaY * 0.04));
  e.preventDefault();
}, { passive: false });

// ── Animation loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;

  // Smooth camera
  camPhi   += (targetPhi   - camPhi)   * 0.1;
  camTheta += (targetTheta - camTheta) * 0.1;
  camDist  += (targetDist  - camDist)  * 0.1;
  updateCamera();

  // Bob probes
  probes.forEach((p, i) => { p.position.y = Math.sin(t * 2 + i * 1.2) * 0.06; });
  zealot.position.y = Math.sin(t * 2.5) * 0.07;
  enemies.forEach((e, i) => { e.position.y = Math.sin(t * 1.8 + i * 0.8) * 0.05; });

  // Probe patrol
  probes[0].position.x += Math.sin(t * 0.6) * 0.008 * TILE;
  probes[0].position.z += Math.cos(t * 0.4) * 0.006 * TILE;

  // Attack line fade
  attackLineAge += dt;
  if (attackLineAge < 0.3) {
    atk.mat.opacity = 0.8 * (1 - attackLineAge / 0.3);
  } else {
    atk.mat.opacity = 0;
    if (attackLineAge > 1.2) attackLineAge = 0;
    if (attackLineAge < 0.01) atk.mat.opacity = 0.8;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
