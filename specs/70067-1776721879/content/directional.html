<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Directional 2D Sprites — QuarkMind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e1e; color: #ccc; font-family: monospace; overflow: hidden; }
  #ui {
    position: absolute; top: 16px; left: 16px;
    background: rgba(10,10,30,0.88); border: 1px solid #2a2a5e;
    border-radius: 8px; padding: 14px 18px; font-size: 12px; line-height: 1.8; max-width: 220px;
  }
  #ui h3 { color: #88bbff; margin-bottom: 6px; font-size: 13px; }
  .key { color: #ffcc44; }
  #controls {
    position: absolute; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .btn-group { display: flex; }
  .btn {
    background: rgba(10,10,30,0.88); border: 1px solid #2a2a5e;
    color: #aaaacc; font-family: monospace; font-size: 12px;
    padding: 8px 16px; cursor: pointer; transition: all 0.15s;
  }
  .btn:first-child { border-radius: 6px 0 0 6px; }
  .btn:last-child  { border-radius: 0 6px 6px 0; }
  .btn.active { background: rgba(40,80,160,0.6); border-color: #88bbff; color: #88bbff; }
  .aBtn {
    background: rgba(10,10,30,0.88); border: 1px solid #2a2a5e; border-radius: 6px;
    color: #aaaacc; font-family: monospace; font-size: 11px;
    padding: 7px 14px; cursor: pointer; transition: all 0.15s; width: 130px; text-align: center;
  }
  .aBtn:hover { border-color: #88bbff; color: #88bbff; }
  .aBtn.active { border-color: #88bbff; color: #88bbff; background: rgba(40,60,120,0.5); }
  #mode-label { font-size: 13px; color: #ffcc44; letter-spacing: 1px; text-align: center; }
  #hud {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(10,10,30,0.75); border: 1px solid #2a2a5e;
    border-radius: 6px; padding: 8px 14px; font-size: 11px; color: #88bbff;
  }
</style>
</head>
<body>
<div id="ui">
  <h3>Directional Sprites</h3>
  <div><span class="key">Drag</span> — orbit camera</div>
  <div><span class="key">Scroll</span> — zoom</div>
  <br>
  <div style="color:#888;font-size:11px;">Units face different directions.<br>Sprites update as you orbit.</div>
</div>
<div id="controls">
  <div id="mode-label">2D SPRITES</div>
  <div class="btn-group">
    <button class="btn" id="btn3d" onclick="setMode('3d')">3D Models</button>
    <button class="btn active" id="btn2d" onclick="setMode('2d')">2D Sprites</button>
  </div>
  <button class="aBtn active" id="aIso" onclick="setAngle('iso',this)">Isometric</button>
  <button class="aBtn" id="aLow" onclick="setAngle('low',this)">Low angle</button>
  <button class="aBtn" id="aTop" onclick="setAngle('top',this)">Top-down</button>
</div>
<div id="hud">Minerals: 450 &nbsp;|&nbsp; Gas: 100 &nbsp;|&nbsp; Supply: 16/22 &nbsp;|&nbsp; Frame: 312</div>

<script src="three.min.js"></script>
<script>
// ── Scene ──────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.018);

const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ── Lighting ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x223355, 0.9));
const sun = new THREE.DirectionalLight(0xaabbff, 1.3);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x334466, 0.4);
fill.position.set(-10, 20, -10);
scene.add(fill);

// ── Grid ───────────────────────────────────────────────────────────────────────
const GRID=20, TILE=1.4, HALF=(GRID*TILE)/2;
const mGround = new THREE.MeshLambertMaterial({color:0x1a2233});
const mWall   = new THREE.MeshLambertMaterial({color:0x2e4055});
const mRamp   = new THREE.MeshLambertMaterial({color:0x2a3a44});

for (let z=0;z<GRID;z++) for (let x=0;x<GRID;x++) {
  const cx=x*TILE-HALF+TILE/2, cz=z*TILE-HALF+TILE/2;
  const isWall = x===0||x===GRID-1||z===0||z===GRID-1 || (x>=13&&x<=15&&z>=13&&z<=17);
  if (isWall) {
    const m=new THREE.Mesh(new THREE.BoxGeometry(TILE*.98,TILE*1.2,TILE*.98),mWall);
    m.position.set(cx,TILE*.6,cz); m.castShadow=m.receiveShadow=true; scene.add(m);
  } else {
    const m=new THREE.Mesh(new THREE.BoxGeometry(TILE*.98,.1,TILE*.98),mGround);
    m.position.set(cx,.05,cz); m.receiveShadow=true; scene.add(m);
  }
  const el=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(TILE,.01,TILE)),
    new THREE.LineBasicMaterial({color:0x1e2a3a,transparent:true,opacity:0.45})
  );
  el.position.set(cx,.07,cz); scene.add(el);
}

// Minerals
const minMat=new THREE.MeshLambertMaterial({color:0x44aaff,emissive:0x112244});
[[-4,2],[-3,2],[-2,2],[-4,3],[-3,3]].forEach(([dx,dz])=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(.5,.4,.5),minMat);
  m.position.set(dx*TILE-HALF+TILE/2,.25,dz*TILE-HALF+TILE/2);
  scene.add(m);
});

// Buildings
function makeBuilding(color,emissive,x,z,w,h,d) {
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(w*TILE*.7,h,d*TILE*.7),new THREE.MeshLambertMaterial({color,emissive}));
  b.position.y=h/2; b.castShadow=b.receiveShadow=true; g.add(b);
  g.position.set(x*TILE-HALF+TILE/2,0,z*TILE-HALF+TILE/2);
  scene.add(g);
}
makeBuilding(0x2255aa,0x112244,4,4,2.5,1.4,2.5);
makeBuilding(0x553399,0x221144,7,4,.8,1.7,.8);
makeBuilding(0x336688,0x112233,6,8,1.8,1.1,1.8);

// ── Canvas sprite drawing ──────────────────────────────────────────────────────
// dir: 0=front, 1=right, 2=back, 3=left
function makeCanvas(size, drawFn) {
  const c=document.createElement('canvas'); c.width=c.height=size;
  drawFn(c.getContext('2d'),size); return c;
}

function drawProbe(ctx, S, dir) {
  const cx=S/2, cy=S/2+4;
  // glow
  const grd=ctx.createRadialGradient(cx,cy,S*.05,cx,cy,S*.46);
  grd.addColorStop(0,'rgba(80,160,255,0.3)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(cx,cy,S*.46,S*.46,0,0,Math.PI*2); ctx.fill();

  if (dir===2) {
    // BACK: round blue body, no eyes, back highlight
    const b=ctx.createRadialGradient(cx+S*.08,cy-S*.08,S*.02,cx,cy,S*.3);
    b.addColorStop(0,'#6699cc'); b.addColorStop(.7,'#2255aa'); b.addColorStop(1,'#112244');
    ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(cx,cy,S*.3,S*.28,0,0,Math.PI*2); ctx.fill();
    // back antenna
    ctx.strokeStyle='#4477aa'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx,cy-S*.28); ctx.lineTo(cx,cy-S*.42); ctx.stroke();
    ctx.fillStyle='#88bbff'; ctx.beginPath(); ctx.ellipse(cx,cy-S*.44,S*.04,S*.04,0,0,Math.PI*2); ctx.fill();
    // feet
    ctx.fillStyle='#2255aa';
    ctx.beginPath(); ctx.ellipse(cx-S*.1,cy+S*.26,S*.08,S*.05,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+S*.1,cy+S*.26,S*.08,S*.05,0,0,Math.PI*2); ctx.fill();
    return;
  }

  if (dir===1||dir===3) {
    // SIDE: horizontal oval profile, face clearly at flip end
    const flip = dir===3 ? -1 : 1;
    // Body — wider oval so profile reads clearly
    const b=ctx.createRadialGradient(cx+flip*S*.06,cy-S*.08,S*.02,cx,cy,S*.28);
    b.addColorStop(0,'#88ccff'); b.addColorStop(.6,'#4488dd'); b.addColorStop(1,'#224499');
    ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(cx,cy,S*.28,S*.24,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.ellipse(cx+flip*S*.08,cy-S*.1,S*.1,S*.07,-.3,0,Math.PI*2); ctx.fill();
    // Eye — large offset to front end of profile
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+flip*S*.16,cy-S*.04,S*.08,S*.08,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#112244'; ctx.beginPath(); ctx.ellipse(cx+flip*S*.18,cy-S*.03,S*.046,S*.046,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+flip*S*.15,cy-S*.07,S*.02,S*.02,0,0,Math.PI*2); ctx.fill();
    // Arm + energy ball from front
    ctx.strokeStyle='#6699bb'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx+flip*S*.24,cy-S*.02); ctx.lineTo(cx+flip*S*.37,cy-S*.14); ctx.stroke();
    const eg=ctx.createRadialGradient(cx+flip*S*.4,cy-S*.17,0,cx+flip*S*.4,cy-S*.17,S*.09);
    eg.addColorStop(0,'#ffff88'); eg.addColorStop(.5,'#ffcc00'); eg.addColorStop(1,'rgba(255,180,0,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.ellipse(cx+flip*S*.4,cy-S*.17,S*.09,S*.09,0,0,Math.PI*2); ctx.fill();
    // Foot
    ctx.fillStyle='#336699';
    ctx.beginPath(); ctx.ellipse(cx,cy+S*.26,S*.1,S*.055,0,0,Math.PI*2); ctx.fill();
    return;
  }

  // FRONT (dir===0)
  const b=ctx.createRadialGradient(cx-S*.08,cy-S*.1,S*.04,cx,cy,S*.3);
  b.addColorStop(0,'#88ccff'); b.addColorStop(.6,'#4488dd'); b.addColorStop(1,'#224499');
  ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(cx,cy,S*.3,S*.28,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.ellipse(cx-S*.06,cy-S*.1,S*.12,S*.08,-.4,0,Math.PI*2); ctx.fill();
  [[-.1,-.06],[.1,-.06]].forEach(([ex,ey])=>{
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+ex*S,cy+ey*S,S*.07,S*.07,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#112244'; ctx.beginPath(); ctx.ellipse(cx+ex*S+1,cy+ey*S+1,S*.04,S*.04,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+ex*S-1,cy+ey*S-2,S*.018,S*.018,0,0,Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle='#6699bb'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx+S*.22,cy-S*.04); ctx.lineTo(cx+S*.35,cy-S*.16); ctx.stroke();
  const eg=ctx.createRadialGradient(cx+S*.38,cy-S*.19,0,cx+S*.38,cy-S*.19,S*.09);
  eg.addColorStop(0,'#ffff88'); eg.addColorStop(.5,'#ffcc00'); eg.addColorStop(1,'rgba(255,180,0,0)');
  ctx.fillStyle=eg; ctx.beginPath(); ctx.ellipse(cx+S*.38,cy-S*.19,S*.09,S*.09,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#336699';
  ctx.beginPath(); ctx.ellipse(cx-S*.1,cy+S*.26,S*.08,S*.05,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+S*.1,cy+S*.26,S*.08,S*.05,0,0,Math.PI*2); ctx.fill();
}

function drawZealot(ctx, S, dir) {
  const cx=S/2, cy=S/2+2;
  const grd=ctx.createRadialGradient(cx,cy,S*.1,cx,cy,S*.48);
  grd.addColorStop(0,'rgba(140,80,255,0.25)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(cx,cy,S*.48,S*.48,0,0,Math.PI*2); ctx.fill();

  if (dir===2) {
    // BACK
    const b=ctx.createRadialGradient(cx+S*.08,cy-S*.08,S*.02,cx,cy,S*.3);
    b.addColorStop(0,'#aa88dd'); b.addColorStop(.7,'#5533aa'); b.addColorStop(1,'#331177');
    ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(cx,cy,S*.3,S*.28,0,0,Math.PI*2); ctx.fill();
    // back crest
    ctx.fillStyle='#8855cc';
    ctx.beginPath(); ctx.moveTo(cx-S*.08,cy-S*.28); ctx.lineTo(cx,cy-S*.44); ctx.lineTo(cx+S*.08,cy-S*.28); ctx.fill();
    // small blades from behind
    const bg=ctx.createLinearGradient(cx-S*.36,cy,cx-S*.28,cy);
    bg.addColorStop(0,'rgba(0,180,255,0)'); bg.addColorStop(1,'#44ccff');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(cx-S*.33,cy,S*.06,S*.18,0,0,Math.PI*2); ctx.fill();
    const bg2=ctx.createLinearGradient(cx+S*.28,cy,cx+S*.36,cy);
    bg2.addColorStop(0,'#44ccff'); bg2.addColorStop(1,'rgba(0,180,255,0)');
    ctx.fillStyle=bg2; ctx.beginPath(); ctx.ellipse(cx+S*.33,cy,S*.06,S*.18,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5533aa';
    ctx.beginPath(); ctx.ellipse(cx-S*.1,cy+S*.26,S*.09,S*.055,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+S*.1,cy+S*.26,S*.09,S*.055,0,0,Math.PI*2); ctx.fill();
    return;
  }

  if (dir===1||dir===3) {
    // SIDE: blade at front, eye clearly at front end
    const flip = dir===3 ? -1 : 1;
    // Blade at front
    const bg=ctx.createLinearGradient(cx+flip*S*.22,cy,cx+flip*S*.42,cy);
    bg.addColorStop(0,'#44ccff'); bg.addColorStop(1,'rgba(0,180,255,0)');
    if(flip<0){bg.addColorStop(0,'rgba(0,180,255,0)');bg.addColorStop(1,'#44ccff');}
    ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(cx+flip*S*.36,cy,S*.07,S*.2,0,0,Math.PI*2); ctx.fill();
    // Body — horizontal oval
    const b=ctx.createRadialGradient(cx+flip*S*.06,cy-S*.08,S*.02,cx,cy,S*.26);
    b.addColorStop(0,'#ccaaff'); b.addColorStop(.5,'#7755cc'); b.addColorStop(1,'#441199');
    ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(cx,cy,S*.26,S*.24,0,0,Math.PI*2); ctx.fill();
    // Eye — large offset to front
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+flip*S*.15,cy-S*.07,S*.08,S*.08,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#221144'; ctx.beginPath(); ctx.ellipse(cx+flip*S*.17,cy-S*.06,S*.046,S*.046,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+flip*S*.14,cy-S*.1,S*.02,S*.02,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5533aa';
    ctx.beginPath(); ctx.ellipse(cx,cy+S*.26,S*.1,S*.055,0,0,Math.PI*2); ctx.fill();
    return;
  }

  // FRONT
  function blade(bx) {
    const bg=ctx.createLinearGradient(bx-8,cy-S*.2,bx+8,cy+S*.2);
    bg.addColorStop(0,'#88ffff'); bg.addColorStop(.5,'#44ccff'); bg.addColorStop(1,'rgba(0,180,255,0.2)');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(bx,cy,S*.07,S*.2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(100,240,255,0.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(bx,cy,S*.1,S*.23,0,0,Math.PI*2); ctx.stroke();
  }
  blade(cx-S*.36); blade(cx+S*.36);
  const b=ctx.createRadialGradient(cx-S*.08,cy-S*.1,S*.04,cx,cy,S*.3);
  b.addColorStop(0,'#ccaaff'); b.addColorStop(.5,'#7755cc'); b.addColorStop(1,'#441199');
  ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(cx,cy,S*.3,S*.28,0,0,Math.PI*2); ctx.fill();
  const ch=ctx.createLinearGradient(cx,cy-S*.1,cx,cy+S*.1);
  ch.addColorStop(0,'#aa88ee'); ch.addColorStop(1,'#664499');
  ctx.fillStyle=ch; ctx.beginPath(); ctx.ellipse(cx,cy+S*.02,S*.16,S*.14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.ellipse(cx-S*.07,cy-S*.1,S*.12,S*.08,-.4,0,Math.PI*2); ctx.fill();
  [[-.11,-.07],[.11,-.07]].forEach(([ex,ey])=>{
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+ex*S,cy+ey*S,S*.075,S*.075,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#221144'; ctx.beginPath(); ctx.ellipse(cx+ex*S+1,cy+ey*S+1,S*.042,S*.042,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(cx+ex*S-1,cy+ey*S-2,S*.018,S*.018,0,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='#5533aa';
  ctx.beginPath(); ctx.ellipse(cx-S*.1,cy+S*.26,S*.09,S*.055,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+S*.1,cy+S*.26,S*.09,S*.055,0,0,Math.PI*2); ctx.fill();
}

function drawEnemy(ctx, S, dir) {
  const cx=S/2, cy=S/2+2;
  const grd=ctx.createRadialGradient(cx,cy,S*.05,cx,cy,S*.44);
  grd.addColorStop(0,'rgba(255,60,30,0.28)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(cx,cy,S*.44,S*.44,0,0,Math.PI*2); ctx.fill();

  // Spikes always visible
  const spikeColor = dir===2 ? '#cc2211' : '#dd2211';
  ctx.fillStyle=spikeColor;
  const numSpikes = dir===1||dir===3 ? 3 : 5;
  const spikeStart = dir===1 ? -Math.PI*.3 : dir===3 ? Math.PI*.7 : -Math.PI*.6;
  for(let i=0;i<numSpikes;i++){
    const a=spikeStart+i*((dir===1||dir===3)?Math.PI*.3:Math.PI*.3);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*S*.28,cy+Math.sin(a)*S*.28);
    ctx.lineTo(cx+Math.cos(a-.1)*S*.22,cy+Math.sin(a-.1)*S*.22);
    ctx.lineTo(cx+Math.cos(a+.1)*S*.22,cy+Math.sin(a+.1)*S*.22);
    ctx.fill();
  }

  const b=ctx.createRadialGradient(dir===2?cx+S*.08:cx-S*.08,cy-S*.08,S*.04,cx,cy,S*.3);
  b.addColorStop(0,dir===2?'#dd5533':'#ff9966'); b.addColorStop(.5,'#cc3322'); b.addColorStop(1,'#881111');
  ctx.fillStyle=b;
  ctx.beginPath();
  if(dir===1||dir===3) ctx.ellipse(cx,cy+S*.02,S*.22,S*.26,0,0,Math.PI*2);
  else ctx.ellipse(cx,cy+S*.02,S*.3,S*.26,0,0,Math.PI*2);
  ctx.fill();

  if(dir!==2) {
    const eyeCount = dir===1||dir===3 ? 1 : 2;
    const eyes = dir===1 ? [[.08,-.05]] : dir===3 ? [[-.08,-.05]] : [[-.1,-.05],[.1,-.05]];
    eyes.forEach(([ex,ey],i)=>{
      ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.ellipse(cx+ex*S,cy+ey*S,S*.075,S*.065,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#220000'; ctx.beginPath(); ctx.ellipse(cx+ex*S,cy+ey*S+1,S*.04,S*.05,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#881111'; ctx.lineWidth=2.5;
      ctx.beginPath();
      if(dir===3) { ctx.moveTo(cx+ex*S-S*.07,cy+ey*S-S*.07); ctx.lineTo(cx+ex*S+S*.04,cy+ey*S-S*.03); }
      else if(dir===1) { ctx.moveTo(cx+ex*S-S*.04,cy+ey*S-S*.03); ctx.lineTo(cx+ex*S+S*.07,cy+ey*S-S*.07); }
      else if(i===0) { ctx.moveTo(cx+ex*S-S*.07,cy+ey*S-S*.07); ctx.lineTo(cx+ex*S+S*.04,cy+ey*S-S*.04); }
      else           { ctx.moveTo(cx+ex*S-S*.04,cy+ey*S-S*.04); ctx.lineTo(cx+ex*S+S*.07,cy+ey*S-S*.07); }
      ctx.stroke();
    });
  }
}

// Pre-generate all 4 directional textures per unit type
function makeDirTextures(drawFn, size=128) {
  return [0,1,2,3].map(dir => {
    const c = makeCanvas(size, (ctx,S) => drawFn(ctx,S,dir));
    const tex = new THREE.CanvasTexture(c);
    tex.premultiplyAlpha = true;
    return new THREE.SpriteMaterial({
      map: tex, transparent: true,
      depthWrite: true,   // write depth so fog can't render through sprites
      alphaTest: 0.1      // skip depth write for fully transparent border pixels
    });
  });
}

const probeMats  = makeDirTextures(drawProbe);
const zealotMats = makeDirTextures(drawZealot);
const enemyMats  = makeDirTextures(drawEnemy);

// ── 3D unit (sphere + eyes) ────────────────────────────────────────────────────
function make3dUnit(color, emissive, sc=1) {
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(.38*sc,20,14),new THREE.MeshLambertMaterial({color,emissive}));
  body.position.y=.42*sc; body.castShadow=true; g.add(body);
  const eyeM=new THREE.MeshLambertMaterial({color:0xffffff});
  const pupM=new THREE.MeshLambertMaterial({color:0x111122});
  [-.14,.14].forEach(ex=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.1*sc,10,8),eyeM);
    eye.position.set(ex*sc,.52*sc,.32*sc); g.add(eye);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(.055*sc,8,8),pupM);
    pup.position.set(ex*sc,.52*sc,.37*sc); g.add(pup);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(.025*sc,6,6),new THREE.MeshBasicMaterial({color:0xffffff}));
    sh.position.set((ex-.04)*sc,.55*sc,.39*sc); g.add(sh);
  });
  // spikes for enemy
  if(color===0xcc3322) {
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2;
      const sp=new THREE.Mesh(new THREE.ConeGeometry(.06,.22,6),new THREE.MeshLambertMaterial({color:0xdd1100}));
      sp.position.set(Math.cos(a)*.32,.58,Math.sin(a)*.32);
      sp.rotation.z=Math.cos(a)*.8; sp.rotation.x=Math.sin(a)*.8;
      g.add(sp);
    }
    // enemy eyes yellow
    g.children.filter(c=>c.material&&c.material.color&&c.material.color.getHex()===0xffffff).forEach(e=>e.material=new THREE.MeshLambertMaterial({color:0xffcc00}));
  }
  const disc=new THREE.Mesh(new THREE.CircleGeometry(.32*sc,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.2,side:THREE.DoubleSide}));
  disc.rotation.x=-Math.PI/2; disc.position.y=.06; g.add(disc);
  return g;
}

// ── Directional sprite helper ──────────────────────────────────────────────────
// Returns the 4-direction index (0=front,1=right,2=back,3=left)
// based on camera position relative to unit's world facing angle.
function getDir4(unitFacingAngle, unitPos, camPos) {
  const dx = camPos.x - unitPos.x;
  const dz = camPos.z - unitPos.z;
  // Negate dx so that right-of-facing maps to dir=1 consistently with screen space
  const camAngle = Math.atan2(-dx, dz);
  let rel = camAngle - unitFacingAngle;
  while (rel < 0) rel += Math.PI*2;
  while (rel >= Math.PI*2) rel -= Math.PI*2;
  return Math.round(rel / (Math.PI/2)) % 4;
}

// ── Unit definitions ───────────────────────────────────────────────────────────
// facingAngle: 0=north(+z), π/2=east(+x), π=south(-z), 3π/2=west(-x)
const unitDefs = [
  {x:5,z:5, mats:probeMats,  color:0x4488dd,emissive:0x112244, sc:1.0, facing:0},          // North
  {x:6,z:5, mats:probeMats,  color:0x4488dd,emissive:0x112244, sc:1.0, facing:Math.PI/2},   // East
  {x:5,z:6, mats:probeMats,  color:0x4488dd,emissive:0x112244, sc:1.0, facing:Math.PI},     // South
  {x:8,z:7, mats:zealotMats, color:0x7755cc,emissive:0x221144, sc:1.2, facing:Math.PI*3/2}, // West
];
const enemyDefs = [
  {x:10,z:10, mats:enemyMats, color:0xcc3322,emissive:0x330000, sc:1.1, facing:Math.PI},
  {x:11,z:10, mats:enemyMats, color:0xcc3322,emissive:0x330000, sc:1.0, facing:Math.PI/2},
  {x:10,z:11, mats:enemyMats, color:0xcc3322,emissive:0x330000, sc:0.9, facing:0},
];
const allDefs = [...unitDefs, ...enemyDefs];

const group3d = new THREE.Group(); scene.add(group3d);
const group2d = new THREE.Group(); scene.add(group2d);
group3d.visible = false;

// Build facing arrows (small direction indicators on ground)
const arrowMat = new THREE.MeshBasicMaterial({color:0x446688,transparent:true,opacity:0.5});
allDefs.forEach(def => {
  const cx=def.x*TILE-HALF+TILE/2, cz=def.z*TILE-HALF+TILE/2;
  const arrow=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,6),arrowMat);
  arrow.rotation.x=Math.PI/2;
  arrow.rotation.z=-def.facing;
  arrow.position.set(cx,.12,cz);
  scene.add(arrow);
});

const units = allDefs.map(def => {
  const cx=def.x*TILE-HALF+TILE/2, cz=def.z*TILE-HALF+TILE/2;
  const pos = new THREE.Vector3(cx,0,cz);

  // 3D unit
  const g = make3dUnit(def.color,def.emissive,def.sc);
  g.position.copy(pos);
  // Face the right direction in 3D
  g.rotation.y = def.facing;
  group3d.add(g);

  // 2D sprite (single, texture swapped each frame)
  const sp = new THREE.Sprite(def.mats[0]);
  sp.position.set(cx,.65*def.sc,cz);
  sp.scale.set(def.sc*1.6,def.sc*1.6,1);
  group2d.add(sp);

  return { pos, facing:def.facing, mats:def.mats, sp, g, phase:Math.random()*Math.PI*2, sc:def.sc };
});

// ── Fog of war ─────────────────────────────────────────────────────────────────
// One plane per tile, updated each frame based on simulated visibility.
// UNSEEN = alpha 1.0 solid black, MEMORY = alpha 0.45, VISIBLE = hidden.
const fogPlanes = [];
const fogMat = new THREE.MeshBasicMaterial({
  color: 0x000000, transparent: true, side: THREE.DoubleSide, depthWrite: false
});
for (let z=0;z<GRID;z++) for (let x=0;x<GRID;x++) {
  const cx=x*TILE-HALF+TILE/2, cz=z*TILE-HALF+TILE/2;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(TILE*.98, TILE*.98),
    fogMat.clone()
  );
  m.rotation.x = -Math.PI/2;
  m.position.set(cx, 0.18, cz);
  m.renderOrder = 5;
  scene.add(m);
  fogPlanes.push({ mesh: m, gx: x, gz: z });
}

// Simulated visibility: compute from friendly unit positions each frame.
// VISIBLE within sight radius, MEMORY in an outer ring, UNSEEN elsewhere.
const SIGHT_R   = 5;   // tiles visible radius
const MEMORY_R  = 8;   // tiles memory radius
const memoryGrid = Array.from({length:GRID}, () => new Array(GRID).fill(false));

function updateFog() {
  // Which tiles are currently visible (within sight of any friendly unit)
  const visible = Array.from({length:GRID}, () => new Array(GRID).fill(false));
  units.slice(0, unitDefs.length).forEach(u => {
    const ux = Math.round((u.pos.x + HALF) / TILE - 0.5);
    const uz = Math.round((u.pos.z + HALF) / TILE - 0.5);
    for (let z=0;z<GRID;z++) for (let x=0;x<GRID;x++) {
      const dist = Math.sqrt((x-ux)**2 + (z-uz)**2);
      if (dist <= SIGHT_R) visible[z][x] = true;
    }
  });
  // Accumulate memory
  for (let z=0;z<GRID;z++) for (let x=0;x<GRID;x++) {
    if (visible[z][x]) memoryGrid[z][x] = true;
  }
  // Apply to fog planes
  fogPlanes.forEach(({mesh, gx, gz}) => {
    if (visible[gz][gx])        { mesh.visible = false; }           // VISIBLE
    else if (memoryGrid[gz][gx]) { mesh.visible = true; mesh.material.opacity = 0.45; } // MEMORY
    else                         { mesh.visible = true; mesh.material.opacity = 1.0;  } // UNSEEN
  });
}

// ── Camera ─────────────────────────────────────────────────────────────────────
let camTheta=Math.PI*.25, camPhi=Math.PI/3.5, camDist=24;
const camTarget=new THREE.Vector3(1,0,1);
let tPhi=camPhi, tTheta=camTheta, tDist=camDist;

function updateCam() {
  camera.position.set(
    camTarget.x+camDist*Math.sin(camPhi)*Math.sin(camTheta),
    camTarget.y+camDist*Math.cos(camPhi),
    camTarget.z+camDist*Math.sin(camPhi)*Math.cos(camTheta)
  );
  camera.lookAt(camTarget);
}
updateCam();

function setAngle(p,btn) {
  document.querySelectorAll('.aBtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(p==='top') { tPhi=.12; tDist=30; }
  if(p==='iso') { tPhi=Math.PI/3.5; tDist=24; }
  if(p==='low') { tPhi=Math.PI/2.3; tDist=20; }
}

function setMode(m) {
  document.getElementById('btn3d').classList.toggle('active',m==='3d');
  document.getElementById('btn2d').classList.toggle('active',m==='2d');
  document.getElementById('mode-label').textContent = m==='3d' ? '3D MODELS' : '2D SPRITES';
  group3d.visible = m==='3d';
  group2d.visible = m==='2d';
}

// ── Mouse ──────────────────────────────────────────────────────────────────────
let drag=false, lastX=0, lastY=0;
renderer.domElement.addEventListener('mousedown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;e.preventDefault();});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  tTheta-=(e.clientX-lastX)*.012; tPhi=Math.max(.08,Math.min(Math.PI/2.05,tPhi-(e.clientY-lastY)*.012));
  lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener('mouseup',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{tDist=Math.max(6,Math.min(55,tDist+e.deltaY*.04));e.preventDefault();},{passive:false});

// ── Animate ────────────────────────────────────────────────────────────────────
const clock=new THREE.Clock(); let t=0;
function animate() {
  requestAnimationFrame(animate);
  const dt=clock.getDelta(); t+=dt;
  camPhi+=(tPhi-camPhi)*.1; camTheta+=(tTheta-camTheta)*.1; camDist+=(tDist-camDist)*.1;
  updateCam();

  updateFog();

  units.forEach((u,i) => {
    // Bob
    const bob = Math.sin(t*2+u.phase)*.06;
    u.g.position.y = bob;
    u.sp.position.y = .65*u.sc + bob;

    // Pick directional sprite based on camera angle vs unit facing
    const dir = getDir4(u.facing, u.pos, camera.position);
    u.sp.material = u.mats[dir];
  });

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
