<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">The Wrapper Trap: Protobuf Version Mismatch</text>

  <!-- BEFORE: broken path -->
  <text x="180" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Before — ocraft deserialization path</text>

  <!-- SC2 box -->
  <rect x="20" y="85" width="100" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="112" text-anchor="middle" font-size="12" fill="#334155">SC2 Client</text>

  <!-- Raw protobuf -->
  <rect x="150" y="85" width="120" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="210" y="105" text-anchor="middle" font-size="11" fill="#0c4a6e">Raw Protobuf</text>
  <text x="210" y="119" text-anchor="middle" font-size="10" fill="#0369a1">protobuf-java 4.x</text>

  <!-- ocraft wrapper -->
  <rect x="300" y="80" width="130" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="365" y="100" text-anchor="middle" font-size="11" fill="#991b1b">ocraft Wrapper</text>
  <text x="365" y="114" text-anchor="middle" font-size="10" fill="#b91c1c">compiled with 3.x</text>
  <text x="365" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">💥 CRASH</text>

  <!-- ObservationTranslator -->
  <rect x="460" y="85" width="130" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="525" y="105" text-anchor="middle" font-size="11" fill="#64748b">Observation</text>
  <text x="525" y="119" text-anchor="middle" font-size="10" fill="#94a3b8">Translator</text>

  <!-- GameState -->
  <rect x="620" y="85" width="85" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="662" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">GameState</text>

  <!-- Arrows (before) -->
  <line x1="120" y1="107" x2="147" y2="107" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="107" x2="297" y2="107" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="430" y1="107" x2="457" y2="107" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="590" y1="107" x2="617" y2="107" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- AFTER: direct path -->
  <text x="180" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">After — raw protobuf path</text>

  <!-- SC2 box -->
  <rect x="20" y="207" width="100" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="234" text-anchor="middle" font-size="12" fill="#334155">SC2 Client</text>

  <!-- Raw protobuf -->
  <rect x="150" y="207" width="120" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="210" y="227" text-anchor="middle" font-size="11" fill="#0c4a6e">Raw Protobuf</text>
  <text x="210" y="241" text-anchor="middle" font-size="10" fill="#0369a1">protobuf-java 4.x</text>

  <!-- Direct translator -->
  <rect x="330" y="207" width="160" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="227" text-anchor="middle" font-size="11" fill="#166534">Raw Protobuf</text>
  <text x="410" y="241" text-anchor="middle" font-size="10" fill="#15803d">Translator (new)</text>

  <!-- GameState -->
  <rect x="550" y="207" width="85" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="592" y="234" text-anchor="middle" font-size="12" fill="#166534">GameState</text>

  <!-- Arrows (after) -->
  <line x1="120" y1="229" x2="147" y2="229" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="229" x2="327" y2="229" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="490" y1="229" x2="547" y2="229" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ocraft bypassed -->
  <rect x="150" y="270" width="130" height="36" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="215" y="292" text-anchor="middle" font-size="10" fill="#a1a1aa">ocraft (bypassed)</text>

  <!-- Key insight box -->
  <rect x="30" y="330" width="660" height="55" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">The wrapper compiled against protobuf 3.x — the runtime ships protobuf 4.x.</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#a16207">Integer fields boxed differently at runtime → ClassCastException in UnitSnapshot deserialization.</text>
</svg>
