<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">The Split Income Architecture</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#64748b">Two income paths using inconsistent worker sources</text>

  <!-- Ground Truth box -->
  <rect x="240" y="68" width="220" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Ground Truth (Replay)</text>
  <text x="350" y="106" text-anchor="middle" font-size="10" fill="#1e40af">12 workers · 2 gas buildings · 1 base</text>

  <!-- Mineral path -->
  <rect x="50" y="170" width="200" height="44" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="150" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">setMiningProbesPerBase</text>
  <text x="150" y="204" text-anchor="middle" font-size="10" fill="#166534">countWorkersPerBase → [12]</text>

  <line x1="300" y1="118" x2="150" y2="170" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="195" y="142" font-size="9" fill="#16a34a" transform="rotate(-20,195,142)">GT workers</text>

  <rect x="50" y="245" width="200" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#166534">mineralIncomePerTick(12)</text>

  <line x1="150" y1="214" x2="150" y2="245" stroke="#475569" marker-end="url(#arr2)"/>

  <!-- Gas path -->
  <rect x="450" y="170" width="200" height="44" rx="5" fill="#fecaca" stroke="#dc2626"/>
  <text x="550" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">WorkerAssignment pool</text>
  <text x="550" y="204" text-anchor="middle" font-size="10" fill="#991b1b">gasWorkersForBuilding → 0</text>

  <line x1="400" y1="118" x2="550" y2="170" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>
  <text x="505" y="142" font-size="9" fill="#dc2626" transform="rotate(20,505,142)">Internal pool (starved)</text>

  <rect x="450" y="245" width="200" height="40" rx="5" fill="#fecaca" stroke="#dc2626"/>
  <text x="550" y="270" text-anchor="middle" font-size="11" fill="#991b1b">gasIncomePerTick(0)</text>

  <line x1="550" y1="214" x2="550" y2="245" stroke="#475569" marker-end="url(#arr2)"/>

  <!-- Result boxes -->
  <rect x="50" y="315" width="200" height="36" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="150" y="338" text-anchor="middle" font-size="10" fill="#854d0e">Mineral income: overcounted by 25%</text>

  <rect x="450" y="315" width="200" height="36" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="550" y="338" text-anchor="middle" font-size="10" fill="#991b1b">Gas income: zero (98% error)</text>

  <line x1="150" y1="285" x2="150" y2="315" stroke="#475569" marker-end="url(#arr2)"/>
  <line x1="550" y1="285" x2="550" y2="315" stroke="#475569" marker-end="url(#arr2)"/>

  <!-- Annotation -->
  <rect x="160" y="375" width="380" height="36" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,2"/>
  <text x="350" y="397" text-anchor="middle" font-size="11" fill="#475569">Same 12 workers counted twice — minerals gets all 12, gas gets 0</text>
</svg>
