<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">Inter-Geyser Distance Distribution (451 pairs, 118 replays)</text>

  <!-- Axes -->
  <line x1="80" y1="230" x2="560" y2="230" stroke="#57606a" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="230" stroke="#57606a" stroke-width="1.5"/>

  <!-- Y axis label -->
  <text x="30" y="145" text-anchor="middle" font-size="11" fill="#57606a" transform="rotate(-90,30,145)">Pair count</text>

  <!-- X axis label -->
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#57606a">Distance (game units)</text>

  <!-- Y grid lines and labels -->
  <line x1="78" y1="230" x2="560" y2="230" stroke="#eaeef2" stroke-width="0.5"/>
  <text x="72" y="234" text-anchor="end" font-size="10" fill="#8b949e">0</text>

  <line x1="78" y1="185" x2="560" y2="185" stroke="#eaeef2" stroke-width="0.5"/>
  <text x="72" y="189" text-anchor="end" font-size="10" fill="#8b949e">50</text>

  <line x1="78" y1="140" x2="560" y2="140" stroke="#eaeef2" stroke-width="0.5"/>
  <text x="72" y="144" text-anchor="end" font-size="10" fill="#8b949e">100</text>

  <line x1="78" y1="95" x2="560" y2="95" stroke="#eaeef2" stroke-width="0.5"/>
  <text x="72" y="99" text-anchor="end" font-size="10" fill="#8b949e">150</text>

  <line x1="78" y1="50" x2="560" y2="50" stroke="#eaeef2" stroke-width="0.5"/>
  <text x="72" y="54" text-anchor="end" font-size="10" fill="#8b949e">200</text>

  <!-- Bars -->
  <!-- 0u: ~4 pairs -->
  <rect x="90" y="226" width="40" height="4" rx="1" fill="#cf222e"/>
  <text x="110" y="221" text-anchor="middle" font-size="9" fill="#cf222e" font-weight="600">4</text>

  <!-- 4u: ~36 pairs -->
  <rect x="140" y="197" width="40" height="33" rx="1" fill="#cf222e"/>
  <text x="160" y="193" text-anchor="middle" font-size="9" fill="#cf222e" font-weight="600">36</text>

  <!-- 5-8u: ~13 pairs -->
  <rect x="190" y="218" width="40" height="12" rx="1" fill="#54aeff"/>
  <text x="210" y="214" text-anchor="middle" font-size="9" fill="#0550ae">13</text>

  <!-- 8-12u: ~30 pairs -->
  <rect x="240" y="203" width="40" height="27" rx="1" fill="#54aeff"/>

  <!-- 12-16u: ~180 pairs (the peak — same-base pair distances) -->
  <rect x="290" y="68" width="40" height="162" rx="1" fill="#54aeff"/>
  <text x="310" y="63" text-anchor="middle" font-size="9" fill="#0550ae">~180</text>

  <!-- 16-30u: ~40 pairs -->
  <rect x="340" y="194" width="40" height="36" rx="1" fill="#8b949e"/>

  <!-- 30-60u: ~60 pairs -->
  <rect x="390" y="176" width="40" height="54" rx="1" fill="#8b949e"/>

  <!-- 60-100u: ~50 pairs -->
  <rect x="440" y="185" width="40" height="45" rx="1" fill="#8b949e"/>

  <!-- 100+: ~52 pairs -->
  <rect x="490" y="183" width="40" height="47" rx="1" fill="#8b949e"/>

  <!-- X axis tick labels -->
  <text x="110" y="245" text-anchor="middle" font-size="9" fill="#8b949e">0</text>
  <text x="160" y="245" text-anchor="middle" font-size="9" fill="#cf222e" font-weight="600">4</text>
  <text x="210" y="245" text-anchor="middle" font-size="9" fill="#8b949e">5–8</text>
  <text x="260" y="245" text-anchor="middle" font-size="9" fill="#8b949e">8–12</text>
  <text x="310" y="245" text-anchor="middle" font-size="9" fill="#8b949e">12–16</text>
  <text x="360" y="245" text-anchor="middle" font-size="9" fill="#8b949e">16–30</text>
  <text x="410" y="245" text-anchor="middle" font-size="9" fill="#8b949e">30–60</text>
  <text x="460" y="245" text-anchor="middle" font-size="9" fill="#8b949e">60–100</text>
  <text x="510" y="245" text-anchor="middle" font-size="9" fill="#8b949e">100+</text>

  <!-- Danger zone annotation -->
  <rect x="85" y="43" width="110" height="186" rx="3" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="140" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#cf222e">← rejected by old check (d &lt; 5.0)</text>
</svg>
