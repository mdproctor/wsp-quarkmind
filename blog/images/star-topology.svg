<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow-star" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Naïve Bayes Star — Hand-Specified</text>

  <!-- Root node -->
  <rect x="175" y="44" width="170" height="36" rx="6" fill="#4a90d9" stroke="#3a7bc8" stroke-width="1.5"/>
  <text x="260" y="67" text-anchor="middle" fill="white" font-weight="600">enemy_strategy</text>

  <!-- Observation nodes -->
  <rect x="10" y="120" width="110" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="65" y="140" text-anchor="middle" fill="#2d5a2d" font-size="11">gas_timing</text>

  <rect x="135" y="120" width="110" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="190" y="140" text-anchor="middle" fill="#2d5a2d" font-size="11">first_building</text>

  <rect x="260" y="120" width="110" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="315" y="140" text-anchor="middle" fill="#2d5a2d" font-size="11">tech_path</text>

  <rect x="385" y="120" width="125" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="447" y="140" text-anchor="middle" fill="#2d5a2d" font-size="11">expansion_timing</text>

  <rect x="40" y="180" width="130" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="105" y="200" text-anchor="middle" fill="#2d5a2d" font-size="11">army_composition</text>

  <rect x="195" y="180" width="130" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="260" y="200" text-anchor="middle" fill="#2d5a2d" font-size="11">worker_saturation</text>

  <rect x="350" y="180" width="140" height="30" rx="5" fill="#e8f4e8" stroke="#7cb87c" stroke-width="1"/>
  <text x="420" y="200" text-anchor="middle" fill="#2d5a2d" font-size="11">aggression_timing</text>

  <!-- Edges from root -->
  <line x1="220" y1="80" x2="65" y2="120" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>
  <line x1="245" y1="80" x2="190" y2="120" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>
  <line x1="275" y1="80" x2="315" y2="120" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>
  <line x1="300" y1="80" x2="447" y2="120" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>
  <line x1="230" y1="80" x2="105" y2="180" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>
  <line x1="260" y1="80" x2="260" y2="180" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>
  <line x1="290" y1="80" x2="420" y2="180" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-star)"/>

  <!-- Assumption callout -->
  <rect x="80" y="240" width="360" height="80" rx="8" fill="#fff3e0" stroke="#f5a623" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="260" y="262" text-anchor="middle" fill="#8a6d3b" font-size="12" font-weight="600">Conditional Independence Assumption</text>
  <text x="260" y="280" text-anchor="middle" fill="#8a6d3b" font-size="11">All observations independent given enemy_strategy.</text>
  <text x="260" y="296" text-anchor="middle" fill="#8a6d3b" font-size="11">gas_timing ⊥ tech_path | enemy_strategy</text>
  <text x="260" y="312" text-anchor="middle" fill="#c0392b" font-size="11" font-style="italic">But is this actually true?</text>
</svg>
