<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="680" height="380" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Gas Approach Docking Sweep — Combined 3w + 6w Vespene Error</text>

  <!-- Chart area -->
  <rect x="80" y="45" width="560" height="270" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4"/>

  <!-- Y-axis labels (combined error %) -->
  <text x="72" y="58" text-anchor="end" font-size="10" fill="#64748b">35%</text>
  <text x="72" y="112" text-anchor="end" font-size="10" fill="#64748b">25%</text>
  <text x="72" y="166" text-anchor="end" font-size="10" fill="#64748b">15%</text>
  <text x="72" y="220" text-anchor="end" font-size="10" fill="#64748b">10%</text>
  <text x="72" y="274" text-anchor="end" font-size="10" fill="#64748b">5%</text>
  <text x="72" y="315" text-anchor="end" font-size="10" fill="#64748b">0%</text>

  <!-- Y-axis gridlines -->
  <line x1="80" y1="54" x2="640" y2="54" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="108" x2="640" y2="108" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="162" x2="640" y2="162" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="216" x2="640" y2="216" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="270" x2="640" y2="270" stroke="#f1f5f9" stroke-width="1"/>

  <!-- X-axis labels (docking loops) -->
  <text x="80" y="330" text-anchor="middle" font-size="10" fill="#64748b">0</text>
  <text x="192" y="330" text-anchor="middle" font-size="10" fill="#64748b">5</text>
  <text x="304" y="330" text-anchor="middle" font-size="10" fill="#64748b">10</text>
  <text x="360" y="330" text-anchor="middle" font-size="10" fill="#64748b">12.5</text>
  <text x="416" y="330" text-anchor="middle" font-size="10" fill="#64748b">15</text>
  <text x="528" y="330" text-anchor="middle" font-size="10" fill="#64748b">20</text>
  <text x="640" y="330" text-anchor="middle" font-size="10" fill="#64748b">25</text>

  <!-- Axis labels -->
  <text x="360" y="355" text-anchor="middle" font-size="11" fill="#475569">GAS_APPROACH_DOCKING_LOOPS</text>
  <text x="20" y="190" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90, 20, 190)">Combined error (|3w%| + |6w%|)</text>

  <!-- Sweep curve — data points from actual sweep results -->
  <!-- Scale: x = 80 + (docking/25)*560, y = 315 - (error/35)*261 -->
  <!-- 0→34.7, 2.5→27.4, 5→24.4, 7.5→18.8, 10→12.7, 11.5→5.1, 12.5→4.9, 13.5→5.9, 15→9.6, 17.5→21.3, 20→27.8, 22.5→36.5, 25→42.6 -->
  <polyline points="
    80,56   136,110   192,133   248,175   304,220
    338,277  360,278  383,271   416,243
    472,156  528,108  584,43    640,2
  " fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Minimum marker at 12.5 -->
  <circle cx="360" cy="278" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <line x1="360" y1="278" x2="360" y2="315" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="360" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">4.9%</text>

  <!-- Old value marker at 15.8 -->
  <circle cx="434" cy="243" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="454" y="237" font-size="9" fill="#92400e">old: 15.8 (14.2%)</text>

  <!-- Zero marker -->
  <circle cx="80" cy="56" r="4" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="100" y="52" font-size="9" fill="#475569">zero: 34.7%</text>

  <!-- Legend -->
  <rect x="460" y="58" width="170" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="474" cy="72" r="4" fill="#ef4444"/>
  <text x="484" y="76" font-size="10" fill="#334155">Best: 12.5 loops (4.9%)</text>
  <text x="474" y="92" font-size="9" fill="#64748b">3w: -2.9%  6w: +2.0%</text>
  <text x="474" y="104" font-size="9" fill="#64748b">Cycle: 136 loops (rotation-limited)</text>
</svg>
