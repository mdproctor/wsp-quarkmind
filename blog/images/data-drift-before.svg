<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Before: Independent Sources, Invisible Drift</text>

  <!-- SC2 Game Data (ground truth, faded) -->
  <rect x="270" y="50" width="180" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="360" y="77" text-anchor="middle" font-size="12" fill="#94a3b8">SC2 Game Data (patch 5.0.16)</text>

  <!-- Dashed lines from game data to sources (no connection) -->
  <line x1="310" y1="94" x2="120" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="94" x2="360" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="410" y1="94" x2="600" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- SC2Data.java -->
  <rect x="30" y="140" width="180" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">SC2Data.java</text>
  <text x="120" y="175" text-anchor="middle" font-size="10" fill="#ef4444">60 of 69 units wrong</text>

  <!-- LiveScoutingExtractor -->
  <rect x="240" y="140" width="240" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">LiveScoutingObservationExtractor</text>
  <text x="360" y="175" text-anchor="middle" font-size="10" fill="#ef4444">hardcoded LIGHT_UNITS subset</text>

  <!-- ReplayExtractor -->
  <rect x="510" y="140" width="180" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">ScoutingObservation...</text>
  <text x="600" y="175" text-anchor="middle" font-size="10" fill="#ef4444">hardcoded string sets</text>

  <!-- Arrows from sources to consumers -->
  <line x1="120" y1="184" x2="120" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="184" x2="360" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="184" x2="600" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumers -->
  <rect x="30" y="230" width="180" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#475569">DamageCalculator</text>

  <rect x="240" y="230" width="240" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="254" text-anchor="middle" font-size="11" fill="#475569">army_composition observation</text>

  <rect x="510" y="230" width="180" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="254" text-anchor="middle" font-size="11" fill="#475569">CPT training data</text>

  <!-- Problem callout -->
  <rect x="140" y="286" width="440" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="306" text-anchor="middle" font-size="12" fill="#dc2626">Each source encodes SC2 attributes independently.</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#dc2626">When one drifts, nothing catches it.</text>
</svg>
