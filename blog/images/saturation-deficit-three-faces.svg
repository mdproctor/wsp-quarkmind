<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="accurateZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4edda" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4edda" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="penaltyZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8d7da" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f8d7da" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="380" rx="8" fill="url(#bg)"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">EM Accuracy vs Mineral Worker Density</text>
  <text x="320" y="44" text-anchor="middle" font-size="10" fill="#6c757d">Three scenarios, one curve, one root cause</text>

  <!-- Chart area -->
  <g transform="translate(80, 60)">
    <!-- Axes -->
    <line x1="0" y1="260" x2="500" y2="260" stroke="#adb5bd" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#adb5bd" stroke-width="1"/>

    <!-- Y-axis labels -->
    <text x="-10" y="30" text-anchor="end" font-size="10" fill="#495057">+5%</text>
    <text x="-10" y="80" text-anchor="end" font-size="10" fill="#495057">0%</text>
    <text x="-10" y="130" text-anchor="end" font-size="10" fill="#495057">-5%</text>
    <text x="-10" y="180" text-anchor="end" font-size="10" fill="#495057">-15%</text>
    <text x="-10" y="230" text-anchor="end" font-size="10" fill="#495057">-25%</text>
    <text x="-55" y="140" text-anchor="middle" font-size="11" fill="#495057" transform="rotate(-90, -55, 140)">Mineral income gap vs SC2</text>

    <!-- Grid lines -->
    <line x1="0" y1="30" x2="500" y2="30" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="80" x2="500" y2="80" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="130" x2="500" y2="130" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="180" x2="500" y2="180" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="230" x2="500" y2="230" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- X-axis labels -->
    <text x="100" y="278" text-anchor="middle" font-size="10" fill="#495057">1.0</text>
    <text x="200" y="278" text-anchor="middle" font-size="10" fill="#495057">1.5</text>
    <text x="300" y="278" text-anchor="middle" font-size="10" fill="#495057">2.0</text>
    <text x="400" y="278" text-anchor="middle" font-size="10" fill="#495057">2.5</text>
    <text x="500" y="278" text-anchor="middle" font-size="10" fill="#495057">3.0</text>
    <text x="300" y="298" text-anchor="middle" font-size="11" fill="#495057">Workers per mineral patch</text>

    <!-- Zones -->
    <rect x="0" y="55" width="250" height="50" fill="url(#accurateZone)" rx="4"/>
    <rect x="250" y="55" width="250" height="200" fill="url(#penaltyZone)" rx="4"/>

    <!-- Zone labels -->
    <text x="125" y="68" text-anchor="middle" font-size="9" fill="#155724" font-weight="500">Accurate zone</text>
    <text x="375" y="68" text-anchor="middle" font-size="9" fill="#721c24" font-weight="500">Saturation penalty zone</text>

    <!-- Zone boundary -->
    <line x1="250" y1="55" x2="250" y2="255" stroke="#dc3545" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>

    <!-- Curve: accuracy vs density -->
    <path d="M 100,77 C 150,76 180,76 200,77 C 220,78 240,82 280,145 C 320,190 360,170 400,155"
          fill="none" stroke="#495057" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Data points -->
    <!-- 12w: 1.5 workers/patch, +0.6% -->
    <circle cx="200" cy="77" r="8" fill="#28a745" stroke="white" stroke-width="2"/>
    <text x="200" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#28a745">+0.6%</text>
    <text x="200" y="100" text-anchor="middle" font-size="9" fill="#495057">12w mineral</text>

    <!-- 16w: 2.0 workers/patch, -20.2% -->
    <circle cx="300" cy="221" r="8" fill="#dc3545" stroke="white" stroke-width="2"/>
    <text x="300" y="242" text-anchor="middle" font-size="10" font-weight="600" fill="#dc3545">-20.2%</text>
    <text x="300" y="210" text-anchor="middle" font-size="9" fill="#495057">16w saturation</text>

    <!-- 3w gas: 2.5 workers/patch, -12.9% -->
    <circle cx="400" cy="159" r="8" fill="#e67700" stroke="white" stroke-width="2"/>
    <text x="400" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#e67700">-12.9%</text>
    <text x="400" y="178" text-anchor="middle" font-size="9" fill="#495057">3w gas (20 miners)</text>

  </g>
</svg>
