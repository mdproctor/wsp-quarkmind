<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Left: Formula-driven (current) -->
  <rect x="20" y="15" width="320" height="310" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Formula-Driven (Current)</text>

  <rect x="50" y="65" width="130" height="36" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="115" y="88" text-anchor="middle" font-size="11" fill="#92400e">Count workers</text>

  <rect x="200" y="65" width="120" height="36" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="260" y="88" text-anchor="middle" font-size="11" fill="#92400e">N = 12</text>

  <line x1="180" y1="83" x2="200" y2="83" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="100" y="125" width="160" height="36" rx="4" fill="#fde68a" stroke="#d97706"/>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#92400e">mineralIncome(12)</text>

  <line x1="260" y1="101" x2="180" y2="125" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="100" y="180" width="160" height="36" rx="4" fill="#fde68a" stroke="#d97706"/>
  <text x="180" y="203" text-anchor="middle" font-size="11" fill="#92400e">gasIncome(0)</text>

  <text x="180" y="245" text-anchor="middle" font-size="10" fill="#b45309">Gas workers from internal pool</text>
  <text x="180" y="260" text-anchor="middle" font-size="10" fill="#b45309">(pool starved — CmdEvent misses 57%)</text>

  <text x="180" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✗ Mineral overcounted</text>
  <text x="180" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✗ Gas undercounted</text>

  <!-- Right: Simulation-driven (target) -->
  <rect x="380" y="15" width="320" height="310" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Simulation-Driven (Target)</text>

  <rect x="405" y="65" width="145" height="36" rx="4" fill="#fff" stroke="#059669"/>
  <text x="477" y="82" text-anchor="middle" font-size="11" fill="#065f46">Each worker has</text>
  <text x="477" y="95" text-anchor="middle" font-size="11" fill="#065f46">a task assignment</text>

  <rect x="565" y="65" width="120" height="36" rx="4" fill="#fff" stroke="#059669"/>
  <text x="625" y="82" text-anchor="middle" font-size="11" fill="#065f46">9 mineral</text>
  <text x="625" y="95" text-anchor="middle" font-size="11" fill="#065f46">3 gas</text>

  <line x1="550" y1="83" x2="565" y2="83" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="460" y="125" width="160" height="36" rx="4" fill="#a7f3d0" stroke="#059669"/>
  <text x="540" y="148" text-anchor="middle" font-size="11" fill="#065f46">mineralIncome(9)</text>

  <rect x="460" y="180" width="160" height="36" rx="4" fill="#a7f3d0" stroke="#059669"/>
  <text x="540" y="203" text-anchor="middle" font-size="11" fill="#065f46">gasIncome(3)</text>

  <line x1="625" y1="101" x2="540" y2="125" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="625" y1="101" x2="540" y2="180" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="540" y="245" text-anchor="middle" font-size="10" fill="#047857">Workers partitioned from GT</text>
  <text x="540" y="260" text-anchor="middle" font-size="10" fill="#047857">Formula validates simulation</text>

  <text x="540" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">✓ Mineral correct</text>
  <text x="540" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">✓ Gas correct</text>
</svg>
