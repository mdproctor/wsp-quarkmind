<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .axis { stroke: #666; stroke-width: 1.5; fill: none; }
      .label { font-size: 12px; fill: #666; }
      .title { font-size: 13px; fill: #333; font-weight: 600; }
      .flat-line { stroke: #e74c3c; stroke-width: 2; fill: none; stroke-dasharray: 6 3; }
      .trip-line { stroke: #2980b9; stroke-width: 2; fill: none; }
      .trip-dot { fill: #2980b9; }
      .walk-region { fill: #f0f4f8; }
      .mine-region { fill: #e8f5e9; }
      .deposit-region { fill: #fff3e0; }
      .phase-label { font-size: 9px; fill: #999; }
      .legend-text { font-size: 11px; fill: #444; }
      .gridline { stroke: #e0e0e0; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title">Mineral income: flat rate vs trip-based</text>

  <!-- Chart area -->
  <g transform="translate(60, 40)">
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="600" y2="50" class="gridline"/>
    <line x1="0" y1="100" x2="600" y2="100" class="gridline"/>
    <line x1="0" y1="150" x2="600" y2="150" class="gridline"/>
    <line x1="0" y1="200" x2="600" y2="200" class="gridline"/>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="230" class="axis"/>
    <line x1="0" y1="230" x2="600" y2="230" class="axis"/>

    <!-- Y-axis labels -->
    <text x="-8" y="233" text-anchor="end" class="label">0</text>
    <text x="-8" y="183" text-anchor="end" class="label">25</text>
    <text x="-8" y="133" text-anchor="end" class="label">50</text>
    <text x="-8" y="83" text-anchor="end" class="label">75</text>
    <text x="-8" y="33" text-anchor="end" class="label">100</text>

    <!-- Y-axis title -->
    <text x="-45" y="115" text-anchor="middle" transform="rotate(-90, -45, 115)" class="label">cumulative minerals</text>

    <!-- X-axis labels -->
    <text x="0" y="248" text-anchor="middle" class="label">0</text>
    <text x="120" y="248" text-anchor="middle" class="label">20</text>
    <text x="240" y="248" text-anchor="middle" class="label">40</text>
    <text x="360" y="248" text-anchor="middle" class="label">60</text>
    <text x="480" y="248" text-anchor="middle" class="label">80</text>
    <text x="600" y="248" text-anchor="middle" class="label">100</text>
    <text x="300" y="268" text-anchor="middle" class="label">game loops</text>

    <!-- Phase regions for one MULE cycle -->
    <rect x="0" y="0" width="132" height="230" class="walk-region" opacity="0.4"/>
    <rect x="132" y="0" width="120" height="230" class="mine-region" opacity="0.4"/>
    <rect x="252" y="0" width="132" height="230" class="walk-region" opacity="0.4"/>
    <rect x="384" y="0" width="72" height="230" class="deposit-region" opacity="0.4"/>
    <rect x="456" y="0" width="144" height="230" class="walk-region" opacity="0.4"/>

    <!-- Phase labels -->
    <text x="66" y="220" text-anchor="middle" class="phase-label">walk →</text>
    <text x="192" y="220" text-anchor="middle" class="phase-label">mine</text>
    <text x="318" y="220" text-anchor="middle" class="phase-label">← walk</text>
    <text x="420" y="220" text-anchor="middle" class="phase-label">deposit</text>
    <text x="528" y="220" text-anchor="middle" class="phase-label">walk →</text>

    <!-- Flat rate line (steady diagonal) -->
    <line x1="0" y1="230" x2="600" y2="30" class="flat-line"/>

    <!-- Trip-based line (step function with walk gaps) -->
    <polyline points="
      0,230 132,230 252,230 384,230
      384,185
      384,185 456,185 528,185 588,185
    " class="trip-line"/>

    <!-- Delivery dot -->
    <circle cx="384" cy="185" r="4" class="trip-dot"/>

    <!-- Delivery annotation -->
    <text x="396" y="178" class="phase-label" fill="#2980b9" font-size="10">+25</text>

    <!-- Legend -->
    <g transform="translate(420, 10)">
      <line x1="0" y1="0" x2="24" y2="0" class="flat-line"/>
      <text x="30" y="4" class="legend-text">flat rate (4.5/tick)</text>
      <line x1="0" y1="20" x2="24" y2="20" class="trip-line"/>
      <text x="30" y="24" class="legend-text">trip-based (25/trip)</text>
    </g>
  </g>
</svg>