<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="accelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="decelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Worker Velocity Profile: 6-Unit Mining Trip</text>

  <!-- Axes -->
  <line x1="70" y1="260" x2="560" y2="260" stroke="#475569" stroke-width="1.5"/>
  <line x1="70" y1="260" x2="70" y2="50" stroke="#475569" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="60" y="265" text-anchor="end" fill="#94a3b8" font-size="11">0</text>
  <text x="60" y="208" text-anchor="end" fill="#94a3b8" font-size="11">1.0</text>
  <text x="60" y="155" text-anchor="end" fill="#94a3b8" font-size="11">2.0</text>
  <text x="60" y="103" text-anchor="end" fill="#94a3b8" font-size="11">3.0</text>
  <text x="60" y="71" text-anchor="end" fill="#94a3b8" font-size="11">3.94</text>
  <text x="30" y="155" text-anchor="middle" fill="#94a3b8" font-size="11" transform="rotate(-90,30,155)">Speed (u/s)</text>

  <!-- Y-axis gridlines -->
  <line x1="70" y1="205" x2="560" y2="205" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="70" y1="155" x2="560" y2="155" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="70" y1="103" x2="560" y2="103" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Max speed reference line -->
  <line x1="70" y1="68" x2="560" y2="68" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="565" y="72" fill="#f59e0b" font-size="10" text-anchor="start">v_max</text>

  <!-- X-axis labels -->
  <text x="70" y="280" text-anchor="middle" fill="#94a3b8" font-size="11">0</text>
  <text x="315" y="280" text-anchor="middle" fill="#94a3b8" font-size="11">1.55s</text>
  <text x="560" y="280" text-anchor="middle" fill="#94a3b8" font-size="11">3.10s</text>
  <text x="315" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">Time</text>

  <!-- Acceleration fill -->
  <polygon points="70,260 315,75 315,260" fill="url(#accelGrad)"/>
  <!-- Deceleration fill -->
  <polygon points="315,75 560,260 315,260" fill="url(#decelGrad)"/>

  <!-- Triangular velocity profile line -->
  <polyline points="70,260 315,75 560,260" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Constant-speed comparison line -->
  <line x1="70" y1="68" x2="560" y2="68" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Peak speed marker -->
  <circle cx="315" cy="75" r="4" fill="#3b82f6"/>
  <text x="315" y="60" text-anchor="middle" fill="#93c5fd" font-size="11">3.87 u/s (peak)</text>

  <!-- Phase labels -->
  <text x="192" y="240" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="500">Accelerate</text>
  <text x="192" y="254" text-anchor="middle" fill="#93c5fd" font-size="10">a = 2.5 u/s^2</text>
  <text x="438" y="240" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="500">Decelerate</text>
  <text x="438" y="254" text-anchor="middle" fill="#fca5a5" font-size="10">a = 2.5 u/s^2</text>

  <!-- Midpoint marker -->
  <line x1="315" y1="260" x2="315" y2="75" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,3"/>
  <text x="315" y="310" text-anchor="middle" fill="#64748b" font-size="10">3.0 units (halfway)</text>
</svg>
