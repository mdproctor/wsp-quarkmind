<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Per-Mechanic Playbook Isolation</text>

  <!-- Top: the combined economy -->
  <rect x="210" y="52" width="380" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Full Economy Playbook</text>
  <text x="400" y="88" text-anchor="middle" font-size="11" fill="#991b1b">Mining + Gas + Abilities + Upgrades + Supply — everything tangled</text>
  <text x="400" y="100" text-anchor="middle" font-size="10" fill="#b91c1c">When this fails, which mechanic broke?</text>

  <!-- Arrow down -->
  <line x1="400" y1="108" x2="400" y2="132" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Decomposition label -->
  <text x="400" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#555">isolate each mechanic ↓</text>

  <!-- Row of isolated playbooks -->
  <!-- Chrono Boost -->
  <rect x="22" y="170" width="118" height="84" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="81" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Chrono Boost</text>
  <text x="81" y="208" text-anchor="middle" font-size="9" fill="#1d4ed8">energy: 50</text>
  <text x="81" y="221" text-anchor="middle" font-size="9" fill="#1d4ed8">speed: 1.5×</text>
  <text x="81" y="234" text-anchor="middle" font-size="9" fill="#1d4ed8">duration: 448 loops</text>
  <text x="81" y="247" text-anchor="middle" font-size="9" fill="#3b82f6">Protoss</text>

  <!-- MULE -->
  <rect x="152" y="170" width="118" height="84" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="211" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">MULE Income</text>
  <text x="211" y="208" text-anchor="middle" font-size="9" fill="#166534">energy: 50</text>
  <text x="211" y="221" text-anchor="middle" font-size="9" fill="#166534">income: 3.45× SCV</text>
  <text x="211" y="234" text-anchor="middle" font-size="9" fill="#166534">life: 64s</text>
  <text x="211" y="247" text-anchor="middle" font-size="9" fill="#22c55e">Terran</text>

  <!-- Inject Larva -->
  <rect x="282" y="170" width="118" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="341" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Inject Larva</text>
  <text x="341" y="208" text-anchor="middle" font-size="9" fill="#92400e">energy: 25</text>
  <text x="341" y="221" text-anchor="middle" font-size="9" fill="#92400e">spawns: 4 larva</text>
  <text x="341" y="234" text-anchor="middle" font-size="9" fill="#92400e">passive: 11s cycle</text>
  <text x="341" y="247" text-anchor="middle" font-size="9" fill="#d97706">Zerg</text>

  <!-- Gas -->
  <rect x="412" y="170" width="118" height="84" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="471" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Gas Saturation</text>
  <text x="471" y="208" text-anchor="middle" font-size="9" fill="#5b21b6">3 workers/geyser</text>
  <text x="471" y="221" text-anchor="middle" font-size="9" fill="#5b21b6">tiers: 38/38/20</text>
  <text x="471" y="234" text-anchor="middle" font-size="9" fill="#5b21b6">per min per worker</text>
  <text x="471" y="247" text-anchor="middle" font-size="9" fill="#7c3aed">Protoss</text>

  <!-- Upgrades -->
  <rect x="542" y="170" width="118" height="84" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="601" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#831843">Upgrade Research</text>
  <text x="601" y="208" text-anchor="middle" font-size="9" fill="#9d174d">cost: 100m/100g</text>
  <text x="601" y="221" text-anchor="middle" font-size="9" fill="#9d174d">time: 114s</text>
  <text x="601" y="234" text-anchor="middle" font-size="9" fill="#9d174d">prereq: Forge</text>
  <text x="601" y="247" text-anchor="middle" font-size="9" fill="#be185d">Protoss</text>

  <!-- Supply/Production -->
  <rect x="672" y="170" width="118" height="84" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="731" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">Multi-Building</text>
  <text x="731" y="208" text-anchor="middle" font-size="9" fill="#3730a3">2× Gateway</text>
  <text x="731" y="221" text-anchor="middle" font-size="9" fill="#3730a3">supply: Pylon = 8</text>
  <text x="731" y="234" text-anchor="middle" font-size="9" fill="#3730a3">parallel train</text>
  <text x="731" y="247" text-anchor="middle" font-size="9" fill="#4f46e5">Protoss</text>

  <!-- Bottom: convergence -->
  <rect x="150" y="290" width="500" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Each Playbook Targets One Mechanic</text>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#166534">Failure localises to the specific mechanic — no detective work needed</text>

  <!-- Arrows from each box down -->
  <line x1="81" y1="254" x2="81" y2="275" stroke="#555" stroke-width="1"/>
  <line x1="211" y1="254" x2="211" y2="275" stroke="#555" stroke-width="1"/>
  <line x1="341" y1="254" x2="341" y2="275" stroke="#555" stroke-width="1"/>
  <line x1="471" y1="254" x2="471" y2="275" stroke="#555" stroke-width="1"/>
  <line x1="601" y1="254" x2="601" y2="275" stroke="#555" stroke-width="1"/>
  <line x1="731" y1="254" x2="731" y2="275" stroke="#555" stroke-width="1"/>
  <line x1="81" y1="275" x2="400" y2="288" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="211" y1="275" x2="400" y2="288" stroke="#555" stroke-width="1"/>
  <line x1="341" y1="275" x2="400" y2="288" stroke="#555" stroke-width="1"/>
  <line x1="471" y1="275" x2="400" y2="288" stroke="#555" stroke-width="1"/>
  <line x1="601" y1="275" x2="400" y2="288" stroke="#555" stroke-width="1"/>
  <line x1="731" y1="275" x2="400" y2="288" stroke="#555" stroke-width="1"/>

  <!-- Example: what a failure looks like -->
  <rect x="80" y="370" width="640" height="112" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="100" y="392" font-size="12" font-weight="600" fill="#7c2d12">Example: SC2 patch 5.1.0 changes Chrono Boost duration from 20s to 15s</text>
  <text x="100" y="414" font-size="11" fill="#9a3412">❌  Full economy playbook: PROBE count diverges at tick 122 — is it mining? training? Chrono? supply?</text>
  <text x="100" y="436" font-size="11" fill="#16a34a">✅  Chrono Boost playbook: PROBE count diverges at tick 61 — Chrono duration changed. Fix in one place.</text>
  <text x="100" y="458" font-size="11" fill="#16a34a">✅  All other mechanic playbooks: still green — the change was localised.</text>
  <text x="100" y="472" font-size="10" fill="#6b7280">This is the value of isolation: one failure tells you exactly what broke.</text>
</svg>
