<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="em-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="sc2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Mining Cycle Variance: Emulator vs SC2</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#64748b">Per-worker round-trip duration (ticks) across 304 ticks, 12 workers</text>

  <!-- Y axis -->
  <line x1="80" y1="70" x2="80" y2="310" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="195" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,40,195)">Ticks per cycle</text>

  <!-- Y labels -->
  <text x="72" y="306" text-anchor="end" font-size="10" fill="#94a3b8">0</text>
  <line x1="78" y1="302" x2="82" y2="302" stroke="#cbd5e1"/>
  <text x="72" y="278" text-anchor="end" font-size="10" fill="#94a3b8">2</text>
  <line x1="78" y1="274" x2="680" y2="274" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="250" text-anchor="end" font-size="10" fill="#94a3b8">4</text>
  <line x1="78" y1="246" x2="680" y2="246" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="222" text-anchor="end" font-size="10" fill="#94a3b8">6</text>
  <line x1="78" y1="218" x2="680" y2="218" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="194" text-anchor="end" font-size="10" fill="#94a3b8">8</text>
  <line x1="78" y1="190" x2="680" y2="190" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="166" text-anchor="end" font-size="10" fill="#94a3b8">10</text>
  <line x1="78" y1="162" x2="680" y2="162" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="138" text-anchor="end" font-size="10" fill="#94a3b8">12</text>
  <line x1="78" y1="134" x2="680" y2="134" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="110" text-anchor="end" font-size="10" fill="#94a3b8">14</text>
  <line x1="78" y1="106" x2="680" y2="106" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="82" text-anchor="end" font-size="10" fill="#94a3b8">16</text>
  <line x1="78" y1="78" x2="680" y2="78" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- X axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#cbd5e1" stroke-width="1"/>

  <!-- EM range band (4-9 ticks) -->
  <rect x="100" y="190" width="250" height="56" rx="4" fill="url(#em-grad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- EM worker dots (clustered in 4-6 range) -->
  <circle cx="130" cy="246" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="150" cy="237" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="170" cy="232" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="190" cy="225" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="210" cy="218" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="230" cy="214" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="250" cy="214" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="270" cy="211" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="145" cy="246" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="185" cy="230" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="235" cy="230" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="295" cy="204" r="4" fill="#3b82f6" opacity="0.7"/>

  <!-- EM median line -->
  <line x1="100" y1="225" x2="350" y2="225" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="355" y="229" font-size="10" fill="#3b82f6">median 5.2</text>

  <!-- EM label -->
  <text x="225" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Emulator</text>
  <text x="225" y="260" text-anchor="middle" font-size="10" fill="#3b82f6">range: 4–9 ticks</text>

  <!-- SC2 range band (2-17 ticks) -->
  <rect x="430" y="78" width="250" height="196" rx="4" fill="url(#sc2-grad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>

  <!-- SC2 worker dots (spread across 2-17) -->
  <circle cx="460" cy="274" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="480" cy="260" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="500" cy="253" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="520" cy="246" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="540" cy="253" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="560" cy="246" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="580" cy="239" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="600" cy="232" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="620" cy="218" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="640" cy="162" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="530" cy="92" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="610" cy="85" r="4" fill="#f59e0b" opacity="0.5"/>

  <!-- SC2 median line -->
  <line x1="430" y1="246" x2="680" y2="246" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="685" y="250" font-size="10" fill="#d97706">median 4.4</text>

  <!-- SC2 label -->
  <text x="555" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">SC2</text>
  <text x="555" y="298" text-anchor="middle" font-size="10" fill="#d97706">range: 2–17 ticks</text>

  <!-- Annotation -->
  <text x="360" y="340" text-anchor="middle" font-size="11" fill="#475569">Similar medians, radically different variance — the emulator's workers march in lockstep</text>
</svg>
