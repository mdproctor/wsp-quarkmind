<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Dual-Path Evidence Flow</text>

  <!-- GameState source -->
  <rect x="20" y="60" width="120" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="86" text-anchor="middle" font-weight="600" fill="#312e81">GameState</text>

  <!-- Path labels -->
  <text x="390" y="76" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">one-time scouting path</text>
  <text x="390" y="298" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">per-tick detector path</text>

  <!-- SCOUTING PATH (top) -->
  <!-- LiveScoutingObservationExtractor -->
  <rect x="200" y="56" width="240" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-weight="600" font-size="12" fill="#1e40af">LiveScoutingObservation</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#1e40af">Extractor</text>

  <!-- Arrow GameState → Extractor -->
  <line x1="140" y1="82" x2="197" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ScoutingObservation records -->
  <rect x="500" y="56" width="160" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="78" text-anchor="middle" font-size="12" fill="#1e40af">ScoutingObservation</text>
  <text x="580" y="96" text-anchor="middle" font-size="11" fill="#3b82f6">first_building: gateway</text>

  <!-- Arrow Extractor → Observations -->
  <line x1="440" y1="82" x2="497" y2="82" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- observeHard arrow down -->
  <line x1="580" y1="108" x2="580" y2="158" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="596" y="140" font-size="11" fill="#2563eb" font-weight="600">observeHard()</text>

  <!-- HypothesisTracker (central) -->
  <rect x="440" y="160" width="260" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="184" text-anchor="middle" font-weight="bold" font-size="14" fill="#92400e">HypothesisTracker</text>
  <line x1="460" y1="194" x2="680" y2="194" stroke="#d97706" stroke-width="0.5"/>
  <text x="570" y="214" text-anchor="middle" font-size="12" fill="#78350f">weights — permanent, evolve</text>
  <text x="570" y="232" text-anchor="middle" font-size="12" fill="#78350f">perTick — transient, replaced</text>
  <text x="570" y="250" text-anchor="middle" font-size="11" fill="#92400e">viable hypotheses narrow over time</text>

  <!-- DETECTOR PATH (bottom) -->
  <!-- FeatureExtractor -->
  <rect x="200" y="310" width="160" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="280" y="336" text-anchor="middle" font-weight="600" font-size="12" fill="#92400e">FeatureExtractor</text>

  <!-- Arrow GameState → FeatureExtractor -->
  <line x1="80" y1="104" x2="80" y2="332" stroke="#555" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="332" x2="197" y2="332" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BinaryDetectorRunner -->
  <rect x="200" y="375" width="160" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="280" y="401" text-anchor="middle" font-weight="600" font-size="12" fill="#92400e">ONNX Detectors</text>

  <!-- Arrow Features → Detectors -->
  <line x1="280" y1="354" x2="280" y2="372" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Detector scores -->
  <rect x="420" y="375" width="140" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="395" text-anchor="middle" font-size="12" fill="#92400e">detector scores</text>
  <text x="490" y="411" text-anchor="middle" font-size="11" fill="#b45309">rush: 0.82, greedy: 0.15</text>

  <!-- Arrow Detectors → Scores -->
  <line x1="360" y1="397" x2="417" y2="397" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- setPerTickEvidence arrow up -->
  <line x1="525" y1="375" x2="545" y2="263" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="490" y="340" font-size="11" fill="#d97706" font-weight="600">setPerTickEvidence()</text>
  <text x="490" y="354" font-size="10" fill="#d97706">no weight change</text>

  <!-- OUTPUT -->
  <!-- classify() -->
  <rect x="440" y="440" width="260" height="52" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="570" y="460" text-anchor="middle" font-weight="600" font-size="12" fill="#065f46">P(archetype) ∝ weight × likelihood</text>
  <text x="570" y="480" text-anchor="middle" font-size="11" fill="#059669">→ PatternAssessment list</text>

  <!-- Arrow Tracker → Output -->
  <line x1="570" y1="260" x2="570" y2="437" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="587" y="370" font-size="11" fill="#059669" font-weight="600">classify()</text>

  <!-- Legend -->
  <rect x="20" y="440" width="180" height="60" rx="4" fill="white" stroke="#e5e7eb"/>
  <line x1="30" y1="458" x2="60" y2="458" stroke="#2563eb" stroke-width="2"/>
  <text x="66" y="462" font-size="11" fill="#555">permanent (observeHard)</text>
  <line x1="30" y1="478" x2="60" y2="478" stroke="#d97706" stroke-width="2"/>
  <text x="66" y="482" font-size="11" fill="#555">transient (per-tick)</text>
</svg>
