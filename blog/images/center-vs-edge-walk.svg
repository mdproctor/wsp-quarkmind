<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
    <marker id="arrowE" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Walk targets: center-to-center vs edge-to-edge</text>

  <!-- TOP: Center-to-center -->
  <text x="20" y="60" font-size="11" fill="#64748b" font-weight="500">BEFORE: center-to-center (7.0 units)</text>

  <!-- Town Hall -->
  <circle cx="160" cy="120" r="40" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="140" y="100" width="40" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="124" text-anchor="middle" font-size="9" fill="#475569">Nexus</text>
  <circle cx="160" cy="120" r="2.5" fill="#ef4444"/>

  <!-- Mineral Patch (top) -->
  <rect x="444" y="104" width="32" height="32" rx="14" fill="#bfdbfe" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="124" text-anchor="middle" font-size="8" fill="#1e40af">1500</text>
  <circle cx="460" cy="120" r="2.5" fill="#ef4444"/>

  <!-- Center-to-center arrow -->
  <line x1="163" y1="120" x2="455" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowC)" stroke-dasharray="6,4"/>
  <text x="310" y="112" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600">7.0u</text>

  <!-- Worker dot on path -->
  <circle cx="300" cy="120" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="300" y="145" text-anchor="middle" font-size="8" fill="#92400e">worker</text>

  <!-- BOTTOM: Edge-to-edge -->
  <text x="20" y="190" font-size="11" fill="#3b82f6" font-weight="500">AFTER: edge-to-edge (3.5 units)</text>

  <!-- Town Hall -->
  <circle cx="160" cy="240" r="40" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="140" y="220" width="40" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="244" text-anchor="middle" font-size="9" fill="#1d4ed8">Nexus</text>
  <circle cx="160" cy="240" r="2.5" fill="#64748b"/>

  <!-- Edge point on town hall -->
  <circle cx="200" cy="240" r="4" fill="#3b82f6"/>
  <text x="206" y="264" font-size="8" fill="#1d4ed8">deposit</text>

  <!-- Mineral Patch (bottom) -->
  <rect x="444" y="224" width="32" height="32" rx="14" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="460" y="244" text-anchor="middle" font-size="8" fill="#1e40af">1500</text>
  <circle cx="460" cy="240" r="2.5" fill="#64748b"/>

  <!-- Edge point on patch -->
  <circle cx="444" cy="240" r="4" fill="#3b82f6"/>
  <text x="438" y="264" font-size="8" fill="#1d4ed8" text-anchor="end">mine</text>

  <!-- Edge-to-edge arrow -->
  <line x1="205" y1="240" x2="439" y2="240" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowE)"/>
  <text x="322" y="232" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">3.5u</text>

  <!-- Worker dot -->
  <circle cx="322" cy="240" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>

  <!-- Radius labels -->
  <line x1="160" y1="240" x2="200" y2="240" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="180" y="222" text-anchor="middle" font-size="7" fill="#94a3b8">r=2.5</text>

  <line x1="444" y1="240" x2="460" y2="240" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="452" y="222" text-anchor="middle" font-size="7" fill="#94a3b8">r=1.0</text>
</svg>