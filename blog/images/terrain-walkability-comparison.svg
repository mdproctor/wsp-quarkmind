<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace" font-size="11">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 12px; font-weight: 500; fill: #333; }
    .sublabel { font-size: 10px; fill: #666; }
    .walk { fill: #e8f5e9; stroke: #c8e6c9; stroke-width: 0.5; }
    .wall { fill: #ef5350; stroke: #c62828; stroke-width: 0.5; }
    .base { fill: #42a5f5; stroke: #1565c0; stroke-width: 1; }
    .patch { fill: #ffd54f; stroke: #f9a825; stroke-width: 0.5; }
    .path-line { stroke: #1565c0; stroke-width: 1.5; fill: none; stroke-dasharray: 4,2; opacity: 0.6; }
    .metric { font-size: 13px; font-weight: 600; }
    .good { fill: #2e7d32; }
    .bad { fill: #c62828; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">Terrain Walkability: Top vs Bottom Spawn Position</text>

  <!-- Top position grid -->
  <text x="170" y="52" text-anchor="middle" class="label">Top Position (124, 48)</text>
  <text x="170" y="66" text-anchor="middle" class="sublabel">Recorded as opponent — no buildings on grid</text>

  <g transform="translate(30, 75)">
    <!-- 16x14 grid, all walkable -->
    <g>
      <!-- All walkable tiles -->
      <rect x="0" y="0" width="280" height="196" class="walk" rx="2"/>
      <!-- Grid lines -->
      <g stroke="#c8e6c9" stroke-width="0.3">
        <line x1="0" y1="14" x2="280" y2="14"/><line x1="0" y1="28" x2="280" y2="28"/>
        <line x1="0" y1="42" x2="280" y2="42"/><line x1="0" y1="56" x2="280" y2="56"/>
        <line x1="0" y1="70" x2="280" y2="70"/><line x1="0" y1="84" x2="280" y2="84"/>
        <line x1="0" y1="98" x2="280" y2="98"/><line x1="0" y1="112" x2="280" y2="112"/>
        <line x1="0" y1="126" x2="280" y2="126"/><line x1="0" y1="140" x2="280" y2="140"/>
        <line x1="0" y1="154" x2="280" y2="154"/><line x1="0" y1="168" x2="280" y2="168"/>
        <line x1="0" y1="182" x2="280" y2="182"/>
        <line x1="17.5" y1="0" x2="17.5" y2="196"/><line x1="35" y1="0" x2="35" y2="196"/>
        <line x1="52.5" y1="0" x2="52.5" y2="196"/><line x1="70" y1="0" x2="70" y2="196"/>
        <line x1="87.5" y1="0" x2="87.5" y2="196"/><line x1="105" y1="0" x2="105" y2="196"/>
        <line x1="122.5" y1="0" x2="122.5" y2="196"/><line x1="140" y1="0" x2="140" y2="196"/>
        <line x1="157.5" y1="0" x2="157.5" y2="196"/><line x1="175" y1="0" x2="175" y2="196"/>
        <line x1="192.5" y1="0" x2="192.5" y2="196"/><line x1="210" y1="0" x2="210" y2="196"/>
        <line x1="227.5" y1="0" x2="227.5" y2="196"/><line x1="245" y1="0" x2="245" y2="196"/>
        <line x1="262.5" y1="0" x2="262.5" y2="196"/>
      </g>
      <!-- Base marker -->
      <rect x="87.5" y="126" width="17.5" height="14" class="base" rx="2"/>
      <text x="96" y="137" text-anchor="middle" font-size="8" fill="white" font-weight="bold">B</text>
      <!-- Straight path lines to patches -->
      <line x1="96" y1="133" x2="96" y2="42" class="path-line"/>
      <line x1="96" y1="133" x2="200" y2="98" class="path-line"/>
      <line x1="96" y1="133" x2="200" y2="56" class="path-line"/>
    </g>
  </g>

  <text x="170" y="290" text-anchor="middle" class="metric good">Total A* path: 62.28u</text>
  <text x="170" y="306" text-anchor="middle" class="sublabel">Workers walk direct — no obstacles</text>

  <!-- Bottom position grid -->
  <text x="550" y="52" text-anchor="middle" class="label">Bottom Position (124, 159)</text>
  <text x="550" y="66" text-anchor="middle" class="sublabel">Recorded as player — buildings on grid</text>

  <g transform="translate(410, 75)">
    <!-- Base grid, walkable -->
    <rect x="0" y="0" width="280" height="196" class="walk" rx="2"/>
    <!-- Grid lines -->
    <g stroke="#c8e6c9" stroke-width="0.3">
      <line x1="0" y1="14" x2="280" y2="14"/><line x1="0" y1="28" x2="280" y2="28"/>
      <line x1="0" y1="42" x2="280" y2="42"/><line x1="0" y1="56" x2="280" y2="56"/>
      <line x1="0" y1="70" x2="280" y2="70"/><line x1="0" y1="84" x2="280" y2="84"/>
      <line x1="0" y1="98" x2="280" y2="98"/><line x1="0" y1="112" x2="280" y2="112"/>
      <line x1="0" y1="126" x2="280" y2="126"/><line x1="0" y1="140" x2="280" y2="140"/>
      <line x1="0" y1="154" x2="280" y2="154"/><line x1="0" y1="168" x2="280" y2="168"/>
      <line x1="0" y1="182" x2="280" y2="182"/>
      <line x1="17.5" y1="0" x2="17.5" y2="196"/><line x1="35" y1="0" x2="35" y2="196"/>
      <line x1="52.5" y1="0" x2="52.5" y2="196"/><line x1="70" y1="0" x2="70" y2="196"/>
      <line x1="87.5" y1="0" x2="87.5" y2="196"/><line x1="105" y1="0" x2="105" y2="196"/>
      <line x1="122.5" y1="0" x2="122.5" y2="196"/><line x1="140" y1="0" x2="140" y2="196"/>
      <line x1="157.5" y1="0" x2="157.5" y2="196"/><line x1="175" y1="0" x2="175" y2="196"/>
      <line x1="192.5" y1="0" x2="192.5" y2="196"/><line x1="210" y1="0" x2="210" y2="196"/>
      <line x1="227.5" y1="0" x2="227.5" y2="196"/><line x1="245" y1="0" x2="245" y2="196"/>
      <line x1="262.5" y1="0" x2="262.5" y2="196"/>
    </g>

    <!-- Nexus footprint (5x5 at center) -->
    <rect x="52.5" y="98" width="17.5" height="14" class="wall"/><rect x="70" y="98" width="17.5" height="14" class="wall"/>
    <rect x="87.5" y="98" width="17.5" height="14" class="wall"/><rect x="105" y="98" width="17.5" height="14" class="wall"/>
    <rect x="52.5" y="112" width="17.5" height="14" class="wall"/><rect x="70" y="112" width="17.5" height="14" class="wall"/>
    <rect x="87.5" y="112" width="17.5" height="14" class="wall"/><rect x="105" y="112" width="17.5" height="14" class="wall"/><rect x="122.5" y="112" width="17.5" height="14" class="wall"/>
    <rect x="52.5" y="126" width="17.5" height="14" class="wall"/><rect x="70" y="126" width="17.5" height="14" class="wall"/>
    <rect x="105" y="126" width="17.5" height="14" class="wall"/><rect x="122.5" y="126" width="17.5" height="14" class="wall"/>
    <rect x="70" y="140" width="17.5" height="14" class="wall"/><rect x="87.5" y="140" width="17.5" height="14" class="wall"/>
    <rect x="105" y="140" width="17.5" height="14" class="wall"/><rect x="122.5" y="140" width="17.5" height="14" class="wall"/>
    <rect x="70" y="154" width="17.5" height="14" class="wall"/><rect x="87.5" y="154" width="17.5" height="14" class="wall"/>
    <rect x="105" y="154" width="17.5" height="14" class="wall"/>

    <!-- Geyser obstacles -->
    <rect x="192.5" y="84" width="17.5" height="14" class="wall"/><rect x="210" y="84" width="17.5" height="14" class="wall"/><rect x="227.5" y="84" width="17.5" height="14" class="wall"/>
    <rect x="192.5" y="98" width="17.5" height="14" class="wall"/><rect x="210" y="98" width="17.5" height="14" class="wall"/><rect x="227.5" y="98" width="17.5" height="14" class="wall"/>
    <rect x="192.5" y="112" width="17.5" height="14" class="wall"/><rect x="210" y="112" width="17.5" height="14" class="wall"/>
    <rect x="192.5" y="126" width="17.5" height="14" class="wall"/>
    <rect x="192.5" y="140" width="17.5" height="14" class="wall"/><rect x="210" y="140" width="17.5" height="14" class="wall"/>

    <!-- Base marker -->
    <rect x="87.5" y="126" width="17.5" height="14" class="base" rx="2"/>
    <text x="96" y="137" text-anchor="middle" font-size="8" fill="white" font-weight="bold">B</text>

    <!-- Longer path lines around obstacles -->
    <polyline points="96,133 50,133 50,42 96,42" class="path-line"/>
    <polyline points="96,133 140,160 190,120 200,98" class="path-line"/>
  </g>

  <text x="550" y="290" text-anchor="middle" class="metric bad">Total A* path: 101.31u</text>
  <text x="550" y="306" text-anchor="middle" class="sublabel">Workers detour around Nexus + geysers</text>

  <!-- Legend -->
  <g transform="translate(240, 322)">
    <rect x="0" y="0" width="10" height="10" class="walk"/><text x="14" y="9" class="sublabel">Walkable</text>
    <rect x="70" y="0" width="10" height="10" class="wall"/><text x="84" y="9" class="sublabel">Wall (building)</text>
    <rect x="160" y="0" width="10" height="10" class="base" rx="1"/><text x="174" y="9" class="sublabel">Base</text>
  </g>
</svg>
