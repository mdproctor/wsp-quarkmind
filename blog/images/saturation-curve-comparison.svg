<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="sc2Fill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="620" height="380" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Per-Worker Mineral Income vs Worker Count</text>

  <!-- Axes -->
  <line x1="80" y1="300" x2="570" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="50" stroke="#475569" stroke-width="1.5"/>

  <!-- Y-axis: per-worker income (minerals/min) -->
  <text x="70" y="305" text-anchor="end" fill="#94a3b8" font-size="11">0</text>
  <text x="70" y="260" text-anchor="end" fill="#94a3b8" font-size="11">15</text>
  <text x="70" y="217" text-anchor="end" fill="#94a3b8" font-size="11">30</text>
  <text x="70" y="175" text-anchor="end" fill="#94a3b8" font-size="11">45</text>
  <text x="70" y="132" text-anchor="end" fill="#94a3b8" font-size="11">60</text>
  <text x="25" y="175" text-anchor="middle" fill="#94a3b8" font-size="11" transform="rotate(-90,25,175)">Per-worker income (min/min)</text>

  <!-- Y gridlines -->
  <line x1="80" y1="260" x2="570" y2="260" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="217" x2="570" y2="217" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="175" x2="570" y2="175" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="132" x2="570" y2="132" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- X-axis: worker count -->
  <text x="141" y="320" text-anchor="middle" fill="#94a3b8" font-size="11">8</text>
  <text x="233" y="320" text-anchor="middle" fill="#94a3b8" font-size="11">12</text>
  <text x="326" y="320" text-anchor="middle" fill="#94a3b8" font-size="11">16</text>
  <text x="418" y="320" text-anchor="middle" fill="#94a3b8" font-size="11">20</text>
  <text x="510" y="320" text-anchor="middle" fill="#94a3b8" font-size="11">24</text>
  <text x="326" y="340" text-anchor="middle" fill="#94a3b8" font-size="11">Workers per base</text>

  <!-- X gridlines -->
  <line x1="326" y1="300" x2="326" y2="50" stroke="#475569" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- 16-worker optimal zone -->
  <rect x="300" y="50" width="52" height="250" fill="#22c55e" opacity="0.05" rx="2"/>
  <text x="326" y="65" text-anchor="middle" fill="#22c55e" font-size="9" opacity="0.6">optimal</text>

  <!-- SC2 published curve (reference band) -->
  <!-- SC2: 8w=~55, 12=~48, 16=~41, 20=~33, 24=~22 per worker (marginal 17-24 = ~22) -->
  <polyline points="141,118 233,142 326,170 418,210 510,255"
    fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="141" cy="118" r="4" fill="#22c55e"/>
  <circle cx="233" cy="142" r="4" fill="#22c55e"/>
  <circle cx="326" cy="170" r="4" fill="#22c55e"/>
  <circle cx="418" cy="210" r="4" fill="#22c55e"/>
  <circle cx="510" cy="255" r="4" fill="#22c55e"/>

  <!-- Before: constant speed, MINING=16, MAX_MINERS=2 -->
  <!-- 8=60.8, 12=55.0, 16=52.6, 20=51.7, 24=49.6 -->
  <polyline points="141,118 233,137 326,142 418,144 510,147"
    fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <circle cx="141" cy="118" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="233" cy="137" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="326" cy="142" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="418" cy="144" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="510" cy="147" r="3" fill="#ef4444" opacity="0.7"/>

  <!-- After: acceleration, MINING=44.576, MAX_MINERS=1 -->
  <!-- 8=31.8, 12=28.7, 16=26.2, 20=24.2, 24=22.5 -->
  <polyline points="141,207 233,218 326,227 418,237 510,242"
    fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="141" cy="207" r="4" fill="#3b82f6"/>
  <circle cx="233" cy="218" r="4" fill="#3b82f6"/>
  <circle cx="326" cy="227" r="4" fill="#3b82f6"/>
  <circle cx="418" cy="237" r="4" fill="#3b82f6"/>
  <circle cx="510" cy="242" r="4" fill="#3b82f6"/>

  <!-- Legend -->
  <line x1="100" y1="355" x2="130" y2="355" stroke="#22c55e" stroke-width="2.5"/>
  <text x="135" y="359" fill="#94a3b8" font-size="11">SC2 published (community data)</text>

  <line x1="310" y1="355" x2="340" y2="355" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="345" y="359" fill="#94a3b8" font-size="11">Before (constant speed)</text>

  <line x1="100" y1="373" x2="130" y2="373" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="135" y="377" fill="#94a3b8" font-size="11">After (per-loop acceleration)</text>
</svg>
