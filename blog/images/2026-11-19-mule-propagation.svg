<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .title { font-size: 13px; font-weight: 600; }
    .label { font-size: 11px; }
    .small { font-size: 10px; fill: #555; }
    .box { stroke: #334155; stroke-width: 1.5; rx: 6; }
    .done { fill: #dcfce7; }
    .changed { fill: #fef3c7; }
    .removed { fill: #fee2e2; }
    .arrow { stroke: #64748b; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title">Model change propagation: trip-based MULE mining (#717)</text>

  <!-- Row 1: The model change -->
  <rect x="240" y="40" width="240" height="44" class="box done"/>
  <text x="360" y="58" text-anchor="middle" class="label" font-weight="600">WorkerSimulation</text>
  <text x="360" y="73" text-anchor="middle" class="small">trip-based MULE mining (mules map)</text>

  <!-- Row 2: What needed to change -->
  <line x1="280" y1="84" x2="120" y2="120" class="arrow"/>
  <line x1="360" y1="84" x2="360" y2="120" class="arrow"/>
  <line x1="440" y1="84" x2="600" y2="120" class="arrow"/>

  <!-- Left: WorkerSnapshot -->
  <rect x="20" y="120" width="200" height="56" class="box changed"/>
  <text x="120" y="140" text-anchor="middle" class="label" font-weight="600">WorkerSnapshot</text>
  <text x="120" y="155" text-anchor="middle" class="small">+ boolean mule</text>
  <text x="120" y="168" text-anchor="middle" class="small">merge workers + mules maps</text>

  <!-- Center: SC2Data -->
  <rect x="260" y="120" width="200" height="56" class="box removed"/>
  <text x="360" y="140" text-anchor="middle" class="label" font-weight="600">SC2Data</text>
  <text x="360" y="155" text-anchor="middle" class="small">− muleIncomePerTick()</text>
  <text x="360" y="168" text-anchor="middle" class="small">dead code from flat-rate model</text>

  <!-- Right: Cargo verification -->
  <rect x="500" y="120" width="200" height="56" class="box done"/>
  <text x="600" y="140" text-anchor="middle" class="label" font-weight="600">MULE_MINERAL_CARGO</text>
  <text x="600" y="155" text-anchor="middle" class="small">25 ✓  vs  30 ✗</text>
  <text x="600" y="168" text-anchor="middle" class="small">+1.4% vs +12.3% delta</text>

  <!-- Row 3: Downstream effects -->
  <line x1="70" y1="176" x2="70" y2="210" class="arrow"/>
  <line x1="170" y1="176" x2="170" y2="210" class="arrow"/>
  <line x1="310" y1="176" x2="310" y2="210" class="arrow"/>
  <line x1="410" y1="176" x2="410" y2="210" class="arrow"/>
  <line x1="600" y1="176" x2="600" y2="210" class="arrow"/>

  <rect x="10" y="210" width="120" height="40" class="box changed"/>
  <text x="70" y="234" text-anchor="middle" class="small">ObservationTranslator</text>
  <text x="70" y="246" text-anchor="middle" class="small">real SC2 path</text>

  <rect x="140" y="210" width="120" height="40" class="box changed"/>
  <text x="200" y="234" text-anchor="middle" class="small">JSON baselines</text>
  <text x="200" y="246" text-anchor="middle" class="small">backward compat</text>

  <rect x="270" y="210" width="120" height="40" class="box removed"/>
  <text x="330" y="234" text-anchor="middle" class="small">SC2DataTest</text>
  <text x="330" y="246" text-anchor="middle" class="small">test removed</text>

  <rect x="400" y="210" width="120" height="40" class="box changed"/>
  <text x="460" y="234" text-anchor="middle" class="small">MuleIncomeCal</text>
  <text x="460" y="246" text-anchor="middle" class="small">inline constant</text>

  <rect x="540" y="210" width="120" height="40" class="box done"/>
  <text x="600" y="234" text-anchor="middle" class="small">sc2-physics-</text>
  <text x="600" y="246" text-anchor="middle" class="small">constants.md</text>

  <!-- Legend -->
  <rect x="180" y="275" width="14" height="14" class="box done"/>
  <text x="200" y="287" class="small">verified</text>
  <rect x="280" y="275" width="14" height="14" class="box changed"/>
  <text x="300" y="287" class="small">updated</text>
  <rect x="380" y="275" width="14" height="14" class="box removed"/>
  <text x="400" y="287" class="small">removed</text>
</svg>
