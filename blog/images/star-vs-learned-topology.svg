<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowS" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    </marker>
    <marker id="arrowD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Star topology (left) -->
  <text x="185" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Star topology (hand-specified)</text>

  <rect x="130" y="40" width="110" height="32" rx="4" fill="#1e293b"/>
  <text x="185" y="61" text-anchor="middle" font-size="12" fill="white">enemy_strategy</text>

  <!-- Observation nodes -->
  <rect x="20" y="120" width="95" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="67" y="139" text-anchor="middle" font-size="10" fill="#334155">gas_timing</text>

  <rect x="130" y="120" width="110" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="185" y="139" text-anchor="middle" font-size="10" fill="#334155">first_building</text>

  <rect x="255" y="120" width="105" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="307" y="139" text-anchor="middle" font-size="10" fill="#334155">expansion</text>

  <!-- Detector nodes -->
  <rect x="20" y="200" width="95" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="67" y="219" text-anchor="middle" font-size="10" fill="#92400e">early_rush</text>

  <rect x="130" y="200" width="110" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="185" y="219" text-anchor="middle" font-size="10" fill="#92400e">early_cheese</text>

  <rect x="255" y="200" width="105" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="307" y="219" text-anchor="middle" font-size="10" fill="#92400e">early_greedy</text>

  <!-- Star edges -->
  <line x1="160" y1="72" x2="72" y2="118" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowS)"/>
  <line x1="185" y1="72" x2="185" y2="118" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowS)"/>
  <line x1="210" y1="72" x2="302" y2="118" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowS)"/>
  <line x1="160" y1="72" x2="72" y2="198" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowS)"/>
  <line x1="185" y1="72" x2="185" y2="198" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowS)"/>
  <line x1="210" y1="72" x2="302" y2="198" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowS)"/>

  <text x="185" y="280" text-anchor="middle" font-size="11" fill="#64748b">Every variable connects only to the root.</text>
  <text x="185" y="296" text-anchor="middle" font-size="11" fill="#64748b">No cross-edges. Conditional independence assumed.</text>

  <!-- Divider -->
  <line x1="395" y1="15" x2="395" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Learned topology (right) -->
  <text x="595" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Learned topology (data-driven)</text>

  <rect x="540" y="40" width="110" height="32" rx="4" fill="#1e293b"/>
  <text x="595" y="61" text-anchor="middle" font-size="12" fill="white">enemy_strategy</text>

  <!-- Observation nodes -->
  <rect x="430" y="120" width="95" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="477" y="139" text-anchor="middle" font-size="10" fill="#1e40af">gas_timing</text>

  <rect x="540" y="120" width="110" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="595" y="139" text-anchor="middle" font-size="10" fill="#1e40af">first_building</text>

  <rect x="665" y="120" width="105" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="717" y="139" text-anchor="middle" font-size="10" fill="#1e40af">expansion</text>

  <!-- Detector nodes -->
  <rect x="430" y="200" width="95" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="477" y="219" text-anchor="middle" font-size="10" fill="#92400e">early_rush</text>

  <rect x="540" y="200" width="110" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="595" y="219" text-anchor="middle" font-size="10" fill="#92400e">early_cheese</text>

  <rect x="665" y="200" width="105" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="717" y="219" text-anchor="middle" font-size="10" fill="#92400e">early_greedy</text>

  <!-- Learned edges — strategy to obs -->
  <line x1="570" y1="72" x2="482" y2="118" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="595" y1="72" x2="595" y2="118" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="620" y1="72" x2="712" y2="118" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowL)"/>

  <!-- Learned edges — strategy to detectors -->
  <line x1="570" y1="72" x2="482" y2="198" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="595" y1="72" x2="595" y2="198" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="620" y1="72" x2="712" y2="198" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <!-- Cross-edge: obs to obs -->
  <line x1="525" y1="134" x2="540" y2="134" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowL)"/>

  <!-- Cross-edge: detector to detector -->
  <line x1="525" y1="214" x2="540" y2="214" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <text x="595" y="280" text-anchor="middle" font-size="11" fill="#3b82f6">Structure learned from data. Cross-edges</text>
  <text x="595" y="296" text-anchor="middle" font-size="11" fill="#3b82f6">capture real dependencies between variables.</text>

  <!-- Legend -->
  <rect x="440" y="310" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="458" y="321" font-size="10" fill="#334155">Observation</text>
  <rect x="540" y="310" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="558" y="321" font-size="10" fill="#334155">Detector (ONNX)</text>
</svg>