<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#059669"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="780" height="520" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Response Explanation Trace — Inference Provenance</text>

  <!-- Evidence layer -->
  <rect x="30" y="55" width="220" height="180" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Evidence Layer</text>

  <rect x="50" y="90" width="180" height="32" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="140" y="111" text-anchor="middle" font-size="11" fill="#1e40af">rush_det → 0.90</text>

  <rect x="50" y="130" width="180" height="32" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="140" y="151" text-anchor="middle" font-size="11" fill="#1e40af">gas_det → 0.20</text>

  <rect x="50" y="170" width="180" height="32" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="140" y="191" text-anchor="middle" font-size="11" fill="#92400e">first_building = barracks</text>

  <text x="140" y="225" text-anchor="middle" font-size="10" fill="#94a3b8">detector outputs + scouting</text>

  <!-- Influence arrows from evidence to fusion -->
  <line x1="250" y1="106" x2="295" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="146" x2="295" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="186" x2="295" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fusion / Hypothesis Tracker -->
  <rect x="300" y="70" width="210" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="405" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Hypothesis Tracker</text>

  <rect x="315" y="104" width="180" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="405" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">MARINE_RUSH  0.82</text>

  <rect x="315" y="136" width="180" height="26" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="405" y="154" text-anchor="middle" font-size="11" fill="#64748b">FAST_EXPAND  0.11</text>

  <rect x="315" y="168" width="180" height="26" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="405" y="186" text-anchor="middle" font-size="11" fill="#64748b">TECH_RUSH  0.07</text>

  <!-- Arrow to response -->
  <line x1="405" y1="220" x2="405" y2="258" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="415" y="245" font-size="10" fill="#059669" font-weight="500">P(opponent)</text>

  <!-- Response Selection -->
  <rect x="280" y="262" width="250" height="120" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <text x="405" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">Response Selection</text>

  <rect x="295" y="296" width="220" height="26" rx="4" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="405" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">GATEWAY_RUSH  0.48</text>

  <rect x="295" y="328" width="220" height="26" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="405" y="346" text-anchor="middle" font-size="11" fill="#64748b">MACRO  0.32</text>

  <text x="405" y="374" text-anchor="middle" font-size="10" fill="#94a3b8">P(response | opponent, context)</text>

  <!-- Context -->
  <rect x="560" y="270" width="195" height="105" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="657" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Context</text>

  <text x="575" y="312" font-size="11" fill="#64748b">economy = even</text>
  <text x="575" y="330" font-size="11" fill="#64748b">army = even</text>
  <text x="575" y="348" font-size="11" fill="#64748b">tech = even</text>
  <text x="575" y="368" font-size="10" font-style="italic" fill="#94a3b8">no effect (uniform)</text>

  <line x1="560" y1="322" x2="530" y2="322" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Explanation Trace output -->
  <rect x="100" y="410" width="580" height="95" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
  <text x="390" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">ResponseExplanation</text>

  <text x="120" y="452" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#78350f">Opponent: MARINE_RUSH (0.82)  Key: rush_det (+0.40), gas_det (-0.30)</text>
  <text x="120" y="468" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#78350f">Response: GATEWAY_RUSH (0.48)  CPT: P(GATEWAY_RUSH | MARINE_RUSH) = 0.70</text>
  <text x="120" y="484" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#78350f">Expert override: none active   Context: economy=even, army=even (no effect)</text>

  <!-- Arrow from response to explanation -->
  <line x1="405" y1="382" x2="405" y2="407" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Influence annotations -->
  <rect x="560" y="90" width="195" height="110" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="657" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Key Evidence</text>

  <text x="575" y="134" font-size="11" fill="#166534">rush_det  +0.40</text>
  <rect x="651" y="124" width="50" height="14" rx="3" fill="#dcfce7"/>
  <text x="676" y="135" text-anchor="middle" font-size="9" fill="#166534">supports</text>

  <text x="575" y="158" font-size="11" fill="#991b1b">gas_det   −0.30</text>
  <rect x="651" y="148" width="50" height="14" rx="3" fill="#fee2e2"/>
  <text x="676" y="159" text-anchor="middle" font-size="9" fill="#991b1b">against</text>

  <text x="575" y="190" font-size="10" fill="#94a3b8">CPT(leader) − CPT(avg)</text>

  <line x1="560" y1="140" x2="515" y2="117" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
