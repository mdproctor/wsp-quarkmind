<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .box { rx: 6; ry: 6; stroke-width: 1.5; }
      .box-intent { fill: #f0f9ff; stroke: #3b82f6; }
      .box-gate { fill: #fefce8; stroke: #ca8a04; }
      .box-skip { fill: #fef2f2; stroke: #ef4444; }
      .box-pass { fill: #f0fdf4; stroke: #22c55e; }
      .box-result { fill: #f8fafc; stroke: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-green { stroke: #22c55e; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .label { font-size: 11px; fill: #334155; text-anchor: middle; }
      .label-sm { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
      .label-code { font-size: 10px; fill: #7c3aed; font-family: 'JetBrains Mono', 'Fira Code', monospace; text-anchor: middle; }
      .title { font-size: 13px; fill: #334155; font-weight: 600; text-anchor: middle; }
      .section { font-size: 11px; fill: #64748b; font-weight: 600; }
      .verdict { font-size: 11px; font-weight: 600; text-anchor: middle; }
      .verdict-bad { fill: #dc2626; }
      .verdict-good { fill: #16a34a; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="350" y="22" class="title">Cost deduction paths: tracker-driven vs playbook intents</text>

  <!-- Row 1: Intent source -->
  <text x="50" y="55" class="section">BEFORE</text>

  <!-- Replay intent -->
  <rect x="100" y="42" width="140" height="34" class="box box-intent"/>
  <text x="170" y="56" class="label">Replay intent</text>
  <text x="170" y="68" class="label-code">tag = "r-stalker"</text>

  <!-- Playbook intent -->
  <rect x="280" y="42" width="160" height="34" class="box box-intent"/>
  <text x="360" y="56" class="label">Playbook intent</text>
  <text x="360" y="68" class="label-code">tag = "r-playbook-probe"</text>

  <!-- Arrow down -->
  <path d="M170,76 L170,100" class="arrow"/>
  <path d="M360,76 L360,100" class="arrow"/>

  <!-- handleTrain check -->
  <rect x="90" y="102" width="160" height="34" class="box box-gate"/>
  <text x="170" y="116" class="label">starts with "r-" ?</text>
  <text x="170" y="128" class="label-sm">→ auto-resolve + skip gate</text>

  <rect x="280" y="102" width="160" height="34" class="box box-gate"/>
  <text x="360" y="116" class="label">starts with "r-" ?</text>
  <text x="360" y="128" class="label-sm">→ auto-resolve + skip gate</text>

  <!-- Arrow down -->
  <path d="M170,136 L170,160" class="arrow"/>
  <path d="M360,136 L360,160" class="arrow-red"/>

  <!-- Result -->
  <rect x="105" y="162" width="130" height="28" class="box box-pass"/>
  <text x="170" y="180" class="verdict verdict-good">✓ correct — real data</text>

  <rect x="285" y="162" width="150" height="28" class="box box-skip"/>
  <text x="360" y="180" class="verdict verdict-bad">✗ cost never deducted</text>

  <!-- Divider -->
  <line x1="40" y1="210" x2="660" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="50" y="235" class="section">AFTER</text>

  <!-- Replay intent (unchanged) -->
  <rect x="100" y="242" width="140" height="34" class="box box-intent"/>
  <text x="170" y="256" class="label">Replay intent</text>
  <text x="170" y="268" class="label-code">tag = "r-stalker"</text>

  <!-- Playbook intent (fixed) -->
  <rect x="280" y="242" width="160" height="34" class="box box-intent"/>
  <text x="360" y="256" class="label">Playbook intent</text>
  <text x="360" y="268" class="label-code">tag = "pb-probe"</text>

  <!-- Arrow down -->
  <path d="M170,276 L170,300" class="arrow"/>
  <path d="M360,276 L360,300" class="arrow-green"/>

  <!-- Result -->
  <rect x="105" y="302" width="130" height="28" class="box box-pass"/>
  <text x="170" y="320" class="verdict verdict-good">✓ skip gate (correct)</text>

  <rect x="285" y="302" width="150" height="28" class="box box-pass"/>
  <text x="360" y="320" class="verdict verdict-good">✓ auto-resolve + deduct</text>

  <!-- Explanation box on the right -->
  <rect x="490" y="95" width="190" height="90" class="box box-result"/>
  <text x="585" y="115" class="label" style="font-weight:600">The "r-" convention:</text>
  <text x="585" y="132" class="label-sm">Tracker intents represent</text>
  <text x="585" y="144" class="label-sm">units the real player DID</text>
  <text x="585" y="156" class="label-sm">produce — skip economy</text>
  <text x="585" y="168" class="label-sm">checks, just simulate physics</text>

  <rect x="490" y="250" width="190" height="72" class="box box-result"/>
  <text x="585" y="270" class="label" style="font-weight:600">The "pb-" convention:</text>
  <text x="585" y="287" class="label-sm">Playbook intents are synthetic</text>
  <text x="585" y="299" class="label-sm">commands — auto-resolve the</text>
  <text x="585" y="311" class="label-sm">building, but deduct costs</text>
</svg>
