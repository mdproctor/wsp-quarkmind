<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #555; }
    .value { font-size: 11px; font-weight: 600; }
    .axis-label { font-size: 10px; fill: #888; }
    .tier1 { fill: #3498db; opacity: 0.8; }
    .tier2 { fill: #f39c12; opacity: 0.8; }
    .tier3 { fill: #95a5a6; opacity: 0.8; }
    .grid { stroke: #e8e8e8; stroke-width: 1; }
    .old-line { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    .new-line { stroke: #2ecc71; stroke-width: 2.5; fill: none; }
  </style>

  <text x="340" y="24" text-anchor="middle" class="title">Per-Worker Mineral Income — Three-Tier Saturation Model</text>
  <text x="340" y="42" text-anchor="middle" class="axis-label">(minerals per minute per worker, by saturation tier)</text>

  <!-- Legend -->
  <rect x="440" y="55" width="40" height="4" y1="57" fill="#e74c3c" opacity="0.6"/>
  <line x1="440" y1="57" x2="480" y2="57" class="old-line"/>
  <text x="486" y="61" class="label">Before (50/25/5)</text>
  <rect x="440" y="72" width="40" height="4" fill="#2ecc71" opacity="0.6"/>
  <line x1="440" y1="74" x2="480" y2="74" class="new-line"/>
  <text x="486" y="78" class="label">After (77.7/38.8/7.8)</text>

  <!-- Y axis -->
  <text x="42" y="95" text-anchor="end" class="axis-label">80</text>
  <text x="42" y="139" text-anchor="end" class="axis-label">60</text>
  <text x="42" y="183" text-anchor="end" class="axis-label">40</text>
  <text x="42" y="227" text-anchor="end" class="axis-label">20</text>
  <text x="42" y="260" text-anchor="end" class="axis-label">0</text>
  <text x="15" y="175" text-anchor="middle" transform="rotate(-90,15,175)" class="axis-label">min/min/worker</text>

  <!-- Grid -->
  <line x1="50" y1="90" x2="660" y2="90" class="grid"/>
  <line x1="50" y1="134" x2="660" y2="134" class="grid"/>
  <line x1="50" y1="178" x2="660" y2="178" class="grid"/>
  <line x1="50" y1="222" x2="660" y2="222" class="grid"/>
  <line x1="50" y1="256" x2="660" y2="256" class="grid" stroke="#bbb"/>

  <!-- Tier 1: workers 1-8 -->
  <rect x="80" y="96" width="160" height="160" class="tier1" opacity="0.12"/>
  <text x="160" y="270" text-anchor="middle" class="label">Tier 1 (workers 1–8)</text>

  <!-- Old tier 1 bar -->
  <rect x="110" y="119" width="50" height="137" rx="2" fill="#e74c3c" opacity="0.25"/>
  <line x1="110" y1="119" x2="160" y2="119" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="135" y="115" text-anchor="middle" class="value" fill="#e74c3c">50</text>

  <!-- New tier 1 bar -->
  <rect x="170" y="86" width="50" height="170" rx="2" fill="#2ecc71" opacity="0.25"/>
  <line x1="170" y1="86" x2="220" y2="86" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="195" y="82" text-anchor="middle" class="value" fill="#27ae60">77.7</text>

  <!-- Tier 2: workers 9-16 -->
  <rect x="270" y="96" width="160" height="160" class="tier2" opacity="0.12"/>
  <text x="350" y="270" text-anchor="middle" class="label">Tier 2 (workers 9–16)</text>

  <!-- Old tier 2 -->
  <rect x="300" y="201" width="50" height="55" rx="2" fill="#e74c3c" opacity="0.25"/>
  <line x1="300" y1="201" x2="350" y2="201" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="325" y="197" text-anchor="middle" class="value" fill="#e74c3c">25</text>

  <!-- New tier 2 -->
  <rect x="360" y="171" width="50" height="85" rx="2" fill="#2ecc71" opacity="0.25"/>
  <line x1="360" y1="171" x2="410" y2="171" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="385" y="167" text-anchor="middle" class="value" fill="#27ae60">38.8</text>

  <!-- Tier 3: workers 17-24 -->
  <rect x="460" y="96" width="160" height="160" class="tier3" opacity="0.12"/>
  <text x="540" y="270" text-anchor="middle" class="label">Tier 3 (workers 17–24)</text>

  <!-- Old tier 3 -->
  <rect x="490" y="245" width="50" height="11" rx="2" fill="#e74c3c" opacity="0.25"/>
  <line x1="490" y1="245" x2="540" y2="245" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="515" y="241" text-anchor="middle" class="value" fill="#e74c3c">5</text>

  <!-- New tier 3 -->
  <rect x="550" y="239" width="50" height="17" rx="2" fill="#2ecc71" opacity="0.25"/>
  <line x1="550" y1="239" x2="600" y2="239" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="575" y="235" text-anchor="middle" class="value" fill="#27ae60">7.8</text>
</svg>
