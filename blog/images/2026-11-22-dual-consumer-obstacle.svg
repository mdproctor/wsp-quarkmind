<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Shared TerrainGrid — Two Consumers, Different Rules</text>

  <!-- TerrainGrid box -->
  <rect x="230" y="44" width="220" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">TerrainGrid</text>
  <text x="340" y="90" text-anchor="middle" font-size="10" fill="#64748b">isWalkable() · markObstacle()</text>

  <!-- Army pathfinding (left) -->
  <rect x="40" y="140" width="200" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Army A* Pathfinding</text>
  <text x="140" y="180" text-anchor="middle" font-size="10" fill="#3b82f6">enforceWall() + AStarPathfinder</text>
  <text x="140" y="196" text-anchor="middle" font-size="10" fill="#3b82f6">Buildings = walls ✓</text>

  <!-- Worker pathfinding (right) -->
  <rect x="440" y="140" width="200" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Worker A* Pathfinding</text>
  <text x="540" y="180" text-anchor="middle" font-size="10" fill="#b45309">WorkerSimulation + AStarPathfinder</text>
  <text x="540" y="196" text-anchor="middle" font-size="10" fill="#b45309">Buildings = corridors ✗</text>

  <!-- Arrows from grid to consumers -->
  <line x1="280" y1="94" x2="160" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="94" x2="520" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Building obstacle box -->
  <rect x="195" y="240" width="290" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="340" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Initial Town Hall Obstacle</text>
  <text x="340" y="282" text-anchor="middle" font-size="10" fill="#dc2626">Registering it blocks army entry (correct)</text>
  <text x="340" y="296" text-anchor="middle" font-size="10" fill="#dc2626">but also blocks worker mining paths (wrong)</text>

  <!-- Arrows from obstacle to consumers -->
  <line x1="260" y1="240" x2="150" y2="212" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="175" y="232" font-size="9" fill="#16a34a" font-weight="600">correct</text>

  <line x1="420" y1="240" x2="530" y2="212" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="490" y="232" font-size="9" fill="#dc2626" font-weight="600">breaks economy</text>
</svg>