<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .axis { stroke: #374151; stroke-width: 1.5; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 0.5; }
      .label { font-size: 12px; fill: #374151; }
      .title { font-size: 14px; fill: #111827; font-weight: 600; }
      .point { stroke-width: 2; }
      .region-ok { fill: #dcfce7; opacity: 0.3; }
      .region-label { font-size: 11px; fill: #059669; font-style: italic; }
      .annotation { font-size: 10px; fill: #6b7280; }
      .curve { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="title">Income vs Distribution: The One-Parameter Trade-off</text>

  <!-- Chart area: x=80..550, y=45..340 -->
  <!-- X axis: income gap (% vs SC2), range -2 to 16 -->
  <!-- Y axis: σ, range 0.4 to 1.4 -->

  <!-- Target region: income ±3%, σ ≤ 0.70 -->
  <rect x="80" y="45" width="138" height="210" class="region-ok" rx="4"/>
  <text x="95" y="62" class="region-label">Target zone</text>
  <text x="95" y="74" class="annotation">σ ≤ 0.70, income ±3%</text>

  <!-- Grid lines -->
  <!-- Vertical: every 2% -->
  <line x1="106" y1="45" x2="106" y2="340" class="grid"/><!-- 0% -->
  <line x1="158" y1="45" x2="158" y2="340" class="grid"/><!-- 2% -->
  <line x1="210" y1="45" x2="210" y2="340" class="grid"/><!-- 4% -->
  <line x1="262" y1="45" x2="262" y2="340" class="grid"/><!-- 6% -->
  <line x1="314" y1="45" x2="314" y2="340" class="grid"/><!-- 8% -->
  <line x1="366" y1="45" x2="366" y2="340" class="grid"/><!-- 10% -->
  <line x1="418" y1="45" x2="418" y2="340" class="grid"/><!-- 12% -->
  <line x1="470" y1="45" x2="470" y2="340" class="grid"/><!-- 14% -->

  <!-- Horizontal: every 0.2 σ -->
  <line x1="80" y1="255" x2="550" y2="255" class="grid"/><!-- 0.6 -->
  <line x1="80" y1="195" x2="550" y2="195" class="grid"/><!-- 0.8 -->
  <line x1="80" y1="135" x2="550" y2="135" class="grid"/><!-- 1.0 -->
  <line x1="80" y1="75" x2="550" y2="75" class="grid"/><!-- 1.2 -->

  <!-- Axes -->
  <line x1="80" y1="340" x2="550" y2="340" class="axis"/>
  <line x1="80" y1="45" x2="80" y2="340" class="axis"/>

  <!-- X axis labels -->
  <text x="106" y="358" text-anchor="middle" class="label">0%</text>
  <text x="210" y="358" text-anchor="middle" class="label">4%</text>
  <text x="314" y="358" text-anchor="middle" class="label">8%</text>
  <text x="418" y="358" text-anchor="middle" class="label">12%</text>
  <text x="300" y="385" text-anchor="middle" class="label" font-weight="600">Income gap vs SC2 (%)</text>

  <!-- Y axis labels -->
  <text x="72" y="259" text-anchor="end" class="label">0.6</text>
  <text x="72" y="199" text-anchor="end" class="label">0.8</text>
  <text x="72" y="139" text-anchor="end" class="label">1.0</text>
  <text x="72" y="79" text-anchor="end" class="label">1.2</text>
  <text x="30" y="200" text-anchor="middle" class="label" font-weight="600" transform="rotate(-90,30,200)">Cycle σ (ticks)</text>

  <!-- Data curve: factor 0.96→1.0 with idle=3 -->
  <!-- Points: (0.0%, 1.20), (3.2%, 1.00), (6.4%, 0.73), (9.0%, 0.84), (15.0%, 0.96) -->
  <polyline points="106,68 189,135 272,261 340,192 496,163" class="curve" stroke="#2563eb"/>

  <!-- Data points -->
  <circle cx="106" cy="68" r="6" fill="#dc2626" class="point" stroke="#dc2626"/>
  <circle cx="189" cy="135" r="5" fill="#2563eb" class="point" stroke="#2563eb"/>
  <circle cx="272" cy="261" r="5" fill="#2563eb" class="point" stroke="#2563eb"/>
  <circle cx="340" cy="192" r="5" fill="#2563eb" class="point" stroke="#2563eb"/>
  <circle cx="496" cy="163" r="5" fill="#6b7280" class="point" stroke="#6b7280"/>

  <!-- Annotations -->
  <text x="106" y="55" text-anchor="middle" class="annotation" font-weight="600" fill="#dc2626">Current (0.96)</text>
  <text x="106" y="90" text-anchor="middle" class="annotation">σ=1.20, +0.0%</text>
  <text x="272" y="278" text-anchor="middle" class="annotation" font-weight="600" fill="#2563eb">Best σ (0.97)</text>
  <text x="272" y="290" text-anchor="middle" class="annotation">σ=0.73, +6.4%</text>
  <text x="496" y="150" text-anchor="middle" class="annotation">No collision (1.0)</text>
  <text x="496" y="180" text-anchor="middle" class="annotation">σ=0.96, +15%</text>

  <!-- Arrow showing the impossible region -->
  <text x="430" y="300" text-anchor="middle" class="annotation" fill="#dc2626" font-style="italic">No path reaches</text>
  <text x="430" y="314" text-anchor="middle" class="annotation" fill="#dc2626" font-style="italic">the target zone</text>
</svg>
