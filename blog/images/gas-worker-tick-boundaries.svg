<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="420" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" fill="#e0e0e0" font-size="15" font-weight="600" text-anchor="middle">Gas Worker Cycle — Tick Boundary Quantisation</text>

  <!-- Legend -->
  <rect x="180" y="48" width="12" height="12" fill="#4a9eff" rx="2"/>
  <text x="198" y="59" fill="#b0b0b0" font-size="11">Walk to geyser</text>
  <rect x="310" y="48" width="12" height="12" fill="#ff9f43" rx="2"/>
  <text x="328" y="59" fill="#b0b0b0" font-size="11">Harvest (inside)</text>
  <rect x="440" y="48" width="12" height="12" fill="#54d9a8" rx="2"/>
  <text x="458" y="59" fill="#b0b0b0" font-size="11">Walk to base</text>
  <rect x="560" y="48" width="12" height="12" fill="#e74c3c" opacity="0.5" rx="2"/>
  <text x="578" y="59" fill="#b0b0b0" font-size="11">Wasted (quantised)</text>

  <!-- ═══ BEFORE (no carry-forward) ═══ -->
  <text x="30" y="100" fill="#e0e0e0" font-size="13" font-weight="600">Before — no carry-forward</text>
  <text x="30" y="116" fill="#888" font-size="10">32-loop harvest rounds to 44 loops (2 full ticks)</text>

  <!-- Tick grid — before -->
  <g transform="translate(30, 125)">
    <!-- Tick boundaries -->
    <line x1="0" y1="0" x2="0" y2="65" stroke="#444" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="220" y1="0" x2="220" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="330" y1="0" x2="330" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="440" y1="0" x2="440" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="550" y1="0" x2="550" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="660" y1="0" x2="660" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="740" y1="0" x2="740" y2="65" stroke="#444" stroke-width="1"/>

    <!-- Tick labels -->
    <text x="55" y="-5" fill="#666" font-size="9" text-anchor="middle">22 loops</text>
    <text x="165" y="-5" fill="#666" font-size="9" text-anchor="middle">22 loops</text>
    <text x="275" y="-5" fill="#666" font-size="9" text-anchor="middle">22 loops</text>
    <text x="385" y="-5" fill="#666" font-size="9" text-anchor="middle">22 loops</text>
    <text x="495" y="-5" fill="#666" font-size="9" text-anchor="middle">22 loops</text>
    <text x="605" y="-5" fill="#666" font-size="9" text-anchor="middle">22 loops</text>

    <!-- Phase bar — before -->
    <!-- Walk to geyser: ticks 1-2 (arrive at boundary) -->
    <rect x="1" y="8" width="109" height="22" fill="#4a9eff" rx="3"/>
    <rect x="111" y="8" width="49" height="22" fill="#4a9eff" rx="3"/>
    <!-- Wasted: rest of tick 2 after arrival -->
    <rect x="160" y="8" width="59" height="22" fill="#e74c3c" opacity="0.35" rx="3"/>
    <!-- Harvest: full ticks 3-4 (44 loops, not 32) -->
    <rect x="221" y="8" width="108" height="22" fill="#ff9f43" rx="3"/>
    <rect x="331" y="8" width="108" height="22" fill="#ff9f43" rx="3"/>
    <!-- Walk to base: ticks 5-6 -->
    <rect x="441" y="8" width="108" height="22" fill="#54d9a8" rx="3"/>
    <rect x="551" y="8" width="49" height="22" fill="#54d9a8" rx="3"/>
    <!-- Wasted: rest of tick 6 after arrival -->
    <rect x="600" y="8" width="59" height="22" fill="#e74c3c" opacity="0.35" rx="3"/>
    <!-- Deposit marker -->
    <rect x="661" y="8" width="30" height="22" fill="#8b5cf6" rx="3"/>

    <!-- Labels on bars -->
    <text x="80" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">walk →</text>
    <text x="275" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">harvest: 22 loops</text>
    <text x="385" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">harvest: 22 loops</text>
    <text x="495" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">← walk</text>
    <text x="676" y="23" fill="#fff" font-size="8" text-anchor="middle" opacity="0.9">dep</text>

    <!-- Annotations -->
    <text x="185" y="50" fill="#e74c3c" font-size="9" text-anchor="middle" opacity="0.8">idle</text>
    <text x="625" y="50" fill="#e74c3c" font-size="9" text-anchor="middle" opacity="0.8">idle</text>

    <!-- Brace for 44 loops -->
    <path d="M221,35 L221,42 L439,42 L439,35" fill="none" stroke="#ff9f43" stroke-width="1" opacity="0.6"/>
    <text x="330" y="55" fill="#ff9f43" font-size="10" text-anchor="middle" opacity="0.8">44 loops (should be 32)</text>
  </g>

  <!-- ═══ AFTER (with carry-forward) ═══ -->
  <text x="30" y="235" fill="#e0e0e0" font-size="13" font-weight="600">After — sub-tick carry-forward</text>
  <text x="30" y="251" fill="#888" font-size="10">Effective harvest: 31.696 loops — transitions are seamless</text>

  <!-- Tick grid — after -->
  <g transform="translate(30, 260)">
    <!-- Tick boundaries -->
    <line x1="0" y1="0" x2="0" y2="65" stroke="#444" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="220" y1="0" x2="220" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="330" y1="0" x2="330" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="440" y1="0" x2="440" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="550" y1="0" x2="550" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="660" y1="0" x2="660" y2="65" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="740" y1="0" x2="740" y2="65" stroke="#444" stroke-width="1"/>

    <!-- Phase bar — after (carry-forward) -->
    <!-- Walk to geyser: tick 1 full + part of tick 2 -->
    <rect x="1" y="8" width="109" height="22" fill="#4a9eff" rx="3"/>
    <rect x="111" y="8" width="49" height="22" fill="#4a9eff" rx="3"/>
    <!-- Harvest starts MID-TICK 2 (carry-forward!) -->
    <rect x="160" y="8" width="59" height="22" fill="#ff9f43" rx="3"/>
    <!-- Harvest continues tick 3 (exits mid-tick) -->
    <rect x="221" y="8" width="78" height="22" fill="#ff9f43" rx="3"/>
    <!-- Walk starts MID-TICK 3 (full tick exit bonus) -->
    <rect x="299" y="8" width="140" height="22" fill="#54d9a8" rx="3"/>
    <!-- Arrive at base mid-tick 5, deposit, carry-forward back -->
    <rect x="441" y="8" width="25" height="22" fill="#54d9a8" rx="3"/>
    <rect x="468" y="8" width="15" height="22" fill="#8b5cf6" rx="3"/>
    <!-- Carry-forward: start walking back to geyser -->
    <rect x="485" y="8" width="64" height="22" fill="#4a9eff" rx="3"/>
    <!-- Continue walk tick 6 -->
    <rect x="551" y="8" width="108" height="22" fill="#4a9eff" rx="3"/>

    <!-- Labels on bars -->
    <text x="80" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">walk →</text>
    <text x="210" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">harvest</text>
    <text x="260" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">⬇</text>
    <text x="370" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">← walk</text>
    <text x="475" y="23" fill="#fff" font-size="7" text-anchor="middle" opacity="0.9">d</text>
    <text x="540" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">walk →</text>

    <!-- Carry-forward arrows -->
    <path d="M160,36 L160,44" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="160" y="58" fill="#2ecc71" font-size="9" text-anchor="middle">entry carry-forward</text>

    <path d="M468,36 L468,44" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="490" y="58" fill="#2ecc71" font-size="9" text-anchor="middle">base carry-forward</text>

    <!-- Brace for 31.696 loops -->
    <path d="M160,35 L160,42 L299,42 L299,35" fill="none" stroke="#ff9f43" stroke-width="1" opacity="0.6"/>
    <text x="230" y="75" fill="#ff9f43" font-size="10" text-anchor="middle" opacity="0.8">31.696 loops (exact)</text>
  </g>

  <!-- Result callout -->
  <rect x="30" y="370" width="740" height="40" fill="#1e3a2e" rx="6" stroke="#2ecc71" stroke-width="1" opacity="0.6"/>
  <text x="400" y="390" fill="#2ecc71" font-size="12" text-anchor="middle" font-weight="500">vespeneCollectionRate MAPE: 22.8%  →  19.6%  (−3.2 pp at 7-min checkpoint)</text>
  <text x="400" y="404" fill="#888" font-size="10" text-anchor="middle">118 oracle replays, standalone EmulatedGame, no ground-truth overrides</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2ecc71"/>
    </marker>
  </defs>
</svg>
