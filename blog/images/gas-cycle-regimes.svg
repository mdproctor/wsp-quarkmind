<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 12px; fill: #333; }
    .label-bold { font-size: 12px; font-weight: 600; fill: #1a1a2e; }
    .small { font-size: 10px; fill: #666; }
    .phase-inside { fill: #4a90d9; }
    .phase-walk { fill: #e8a838; }
    .phase-deposit { fill: #6bc26b; }
    .phase-wait { fill: #d4d4d4; }
    .slack { fill: #ff6b6b; opacity: 0.3; }
    .bracket { stroke: #333; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title">Gas Worker Cycle Regimes</text>

  <!-- SC2 — Walk-Limited -->
  <text x="20" y="60" class="label-bold">SC2 (Walk-Limited)</text>
  <text x="20" y="75" class="small">Cycle = inside + non_inside = 122 loops</text>

  <!-- SC2 cycle bar -->
  <rect x="20" y="88" width="128" height="30" class="phase-inside" rx="2"/>
  <text x="84" y="107" text-anchor="middle" class="label" fill="white">Inside (32)</text>

  <rect x="148" y="88" width="180" height="30" class="phase-walk" rx="2"/>
  <text x="238" y="107" text-anchor="middle" class="label" fill="white">Walk out+in (90)</text>

  <!-- SC2 rotation markers -->
  <text x="20" y="140" class="small">Rotation: 3 × 32 = 96 loops</text>
  <line x1="20" y1="128" x2="404" y2="128" stroke="#999" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="404" y1="82" x2="404" y2="134" stroke="#d44" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="410" y="133" class="small" fill="#d44">non_inside (90) > rotation (96)?</text>
  <text x="410" y="147" class="small" fill="#d44">Walk exceeds rotation → walk-limited</text>
  <text x="410" y="161" class="small" fill="#d44">Any deposit delay extends cycle directly</text>

  <!-- EM — Geyser-Limited -->
  <text x="20" y="200" class="label-bold">EM (Geyser-Limited)</text>
  <text x="20" y="215" class="small">Cycle = 3 × inside = 133 loops (rotation governs)</text>

  <!-- EM cycle bar -->
  <rect x="20" y="228" width="176" height="30" class="phase-inside" rx="2"/>
  <text x="108" y="247" text-anchor="middle" class="label" fill="white">Inside (44.2)</text>

  <rect x="196" y="228" width="148" height="30" class="phase-walk" rx="2"/>
  <text x="270" y="247" text-anchor="middle" class="label" fill="white">Walk (70)</text>

  <rect x="344" y="228" width="48" height="30" class="phase-deposit" rx="2"/>
  <text x="368" y="247" text-anchor="middle" class="label" fill="white">Dep</text>

  <!-- Slack region -->
  <rect x="392" y="228" width="26" height="30" class="slack" rx="2"/>
  <rect x="392" y="228" width="26" height="30" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3" rx="2"/>
  <text x="405" y="247" text-anchor="middle" class="small" fill="#d44">Wait</text>

  <text x="20" y="280" class="small">Rotation: 3 × 44.2 = 133 loops</text>
  <line x1="20" y1="268" x2="440" y2="268" stroke="#999" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="440" y1="222" x2="440" y2="274" stroke="#4a4" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="446" y="273" class="small" fill="#4a4">non_inside (82) &lt; rotation (133)</text>
  <text x="446" y="287" class="small" fill="#4a4">Worker returns early → waits at geyser</text>
  <text x="446" y="301" class="small" fill="#4a4">Deposit delay absorbed by wait time</text>

  <!-- Legend -->
  <rect x="20" y="310" width="14" height="14" class="phase-inside" rx="2"/>
  <text x="40" y="322" class="small">Inside geyser</text>
  <rect x="130" y="310" width="14" height="14" class="phase-walk" rx="2"/>
  <text x="150" y="322" class="small">Walking</text>
  <rect x="210" y="310" width="14" height="14" class="phase-deposit" rx="2"/>
  <text x="230" y="322" class="small">Deposit</text>
  <rect x="290" y="310" width="14" height="14" class="slack" rx="2"/>
  <rect x="290" y="310" width="14" height="14" fill="none" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="2" rx="2"/>
  <text x="310" y="322" class="small">Slack (absorbed delay)</text>
</svg>