<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Gas Worker Sync Oscillation</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Workers within 2.0 distance are counted; returning workers are not</text>

  <!-- Timeline -->
  <line x1="60" y1="85" x2="660" y2="85" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Tick labels -->
  <text x="120" y="78" text-anchor="middle" font-size="10" fill="#64748b" font-weight="500">Tick N</text>
  <text x="300" y="78" text-anchor="middle" font-size="10" fill="#64748b" font-weight="500">Tick N+1</text>
  <text x="480" y="78" text-anchor="middle" font-size="10" fill="#64748b" font-weight="500">Tick N+2</text>
  <text x="620" y="78" text-anchor="middle" font-size="10" fill="#64748b" font-weight="500">Tick N+3</text>

  <!-- Tick marks -->
  <line x1="120" y1="82" x2="120" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="82" x2="300" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="82" x2="480" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="82" x2="620" y2="88" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tick N: 3 workers inside -->
  <rect x="60" y="100" width="120" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="120" y="118" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">3 inside building</text>
  <text x="120" y="136" text-anchor="middle" font-size="10" fill="#4b5563">GT count: 3</text>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#4b5563">Sync target: 3</text>
  <text x="120" y="168" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">No change</text>

  <!-- Tick N+1: worker returning -->
  <rect x="240" y="100" width="120" height="75" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="300" y="118" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">1 returning cargo</text>
  <text x="300" y="136" text-anchor="middle" font-size="10" fill="#4b5563">GT count: 2 (!)  </text>
  <text x="300" y="152" text-anchor="middle" font-size="10" fill="#4b5563">Sync target: 2</text>
  <text x="300" y="168" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="500">Remove 1 worker</text>

  <!-- Tick N+2: worker returned, count back up -->
  <rect x="420" y="100" width="120" height="75" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="480" y="118" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Worker returned</text>
  <text x="480" y="136" text-anchor="middle" font-size="10" fill="#4b5563">GT count: 3</text>
  <text x="480" y="152" text-anchor="middle" font-size="10" fill="#4b5563">Sync target: 3</text>
  <text x="480" y="168" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="500">Add 1 (from minerals)</text>

  <!-- Tick N+3: cycle repeats -->
  <rect x="560" y="100" width="120" height="75" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="620" y="118" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Another returns</text>
  <text x="620" y="136" text-anchor="middle" font-size="10" fill="#4b5563">GT count: 2</text>
  <text x="620" y="152" text-anchor="middle" font-size="10" fill="#4b5563">Sync target: 2</text>
  <text x="620" y="168" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="500">Remove again...</text>

  <!-- Result box -->
  <rect x="100" y="210" width="520" height="80" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Result: Workers never complete a harvest cycle</text>
  <text x="360" y="256" text-anchor="middle" font-size="11" fill="#4b5563">Removed workers reset to IDLE, reassigned to mineral patches.</text>
  <text x="360" y="274" text-anchor="middle" font-size="11" fill="#4b5563">New workers start from scratch — walk to building, enter, harvest, walk back.</text>

  <!-- Arrow to outcome -->
  <line x1="360" y1="290" x2="360" y2="330" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Outcome -->
  <rect x="180" y="335" width="360" height="45" rx="6" fill="#7f1d1d" stroke="none"/>
  <text x="360" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#fef2f2">vespeneCollectionRate: 99.6% error</text>
  <text x="360" y="374" text-anchor="middle" font-size="10" fill="#fca5a5">Emulated gas income: 206 vs GT: 50,869</text>
</svg>
