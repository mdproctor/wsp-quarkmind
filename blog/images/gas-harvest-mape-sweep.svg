<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .axis-label { font-size: 11px; fill: #374151; }
    .tick-label { font-size: 9px; fill: #6b7280; }
    .grid { stroke: #e5e7eb; stroke-width: 0.5; }
    .line-gas { fill: none; stroke: #10b981; stroke-width: 2.5; }
    .dot { r: 4; }
    .dot-gas { fill: #10b981; }
    .dot-best { fill: #ef4444; stroke: #ef4444; stroke-width: 2; r: 6; }
    .dot-current { fill: #f59e0b; stroke: #f59e0b; stroke-width: 2; r: 6; }
    .annotation { font-size: 10px; fill: #374151; }
    .annotation-bold { font-size: 10px; font-weight: 600; }
  </style>

  <text x="330" y="24" text-anchor="middle" class="title">Gas Harvest Duration vs vespeneCollectionRate MAPE (7-min, 118 replays)</text>

  <!-- Axes -->
  <line x1="80" y1="40" x2="80" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="310" x2="620" y2="310" stroke="#374151" stroke-width="1.5"/>

  <!-- Y axis label -->
  <text x="20" y="175" text-anchor="middle" class="axis-label" transform="rotate(-90, 20, 175)">MAPE %</text>

  <!-- X axis label -->
  <text x="350" y="345" text-anchor="middle" class="axis-label">Gas Harvest Duration (loops)</text>

  <!-- Y grid and labels: 25% to 45% -->
  <line x1="80" y1="310" x2="620" y2="310" class="grid"/>
  <text x="72" y="314" text-anchor="end" class="tick-label">25%</text>

  <line x1="80" y1="256" x2="620" y2="256" class="grid"/>
  <text x="72" y="260" text-anchor="end" class="tick-label">30%</text>

  <line x1="80" y1="202" x2="620" y2="202" class="grid"/>
  <text x="72" y="206" text-anchor="end" class="tick-label">35%</text>

  <line x1="80" y1="148" x2="620" y2="148" class="grid"/>
  <text x="72" y="152" text-anchor="end" class="tick-label">40%</text>

  <line x1="80" y1="94" x2="620" y2="94" class="grid"/>
  <text x="72" y="98" text-anchor="end" class="tick-label">45%</text>

  <!-- X ticks: 10,15,18,20,22,25,28,30,31.7,35,40,45 -->
  <!-- Scale: x = 80 + (duration - 10) * 540/35 = 80 + (d-10)*15.43 -->
  <!-- Scale: y = 310 - (mape - 25) * 270/20 = 310 - (m-25)*13.5 -->

  <!-- Data points and line -->
  <!-- 10:28.1  15:29.9  18:32.7  20:31.3  22:26.7  25:36.3  28:37.2  30:35.6  31.7:37.1  35:39.6  40:42.8  45:43.0 -->
  <polyline class="line-gas" points="
    80,268
    157,244
    203,206
    234,225
    265,287
    311,157
    358,145
    389,166
    415,147
    466,113
    543,73
    620,70
  "/>

  <!-- Dots -->
  <circle cx="80" cy="268" class="dot dot-gas"/>
  <circle cx="157" cy="244" class="dot dot-gas"/>
  <circle cx="203" cy="206" class="dot dot-gas"/>
  <circle cx="234" cy="225" class="dot dot-gas"/>
  <circle cx="265" cy="287" class="dot dot-best"/>
  <circle cx="311" cy="157" class="dot dot-gas"/>
  <circle cx="358" cy="145" class="dot dot-gas"/>
  <circle cx="389" cy="166" class="dot dot-gas"/>
  <circle cx="415" cy="147" class="dot dot-current"/>
  <circle cx="466" cy="113" class="dot dot-gas"/>
  <circle cx="543" cy="73" class="dot dot-gas"/>
  <circle cx="620" cy="70" class="dot dot-gas"/>

  <!-- X tick labels -->
  <text x="80" y="326" text-anchor="middle" class="tick-label">10</text>
  <text x="157" y="326" text-anchor="middle" class="tick-label">15</text>
  <text x="203" y="326" text-anchor="middle" class="tick-label">18</text>
  <text x="234" y="326" text-anchor="middle" class="tick-label">20</text>
  <text x="265" y="326" text-anchor="middle" class="tick-label">22</text>
  <text x="311" y="326" text-anchor="middle" class="tick-label">25</text>
  <text x="358" y="326" text-anchor="middle" class="tick-label">28</text>
  <text x="389" y="326" text-anchor="middle" class="tick-label">30</text>
  <text x="415" y="326" text-anchor="middle" class="tick-label">31.7</text>
  <text x="466" y="326" text-anchor="middle" class="tick-label">35</text>
  <text x="543" y="326" text-anchor="middle" class="tick-label">40</text>
  <text x="620" y="326" text-anchor="middle" class="tick-label">45</text>

  <!-- Annotations -->
  <line x1="265" y1="287" x2="265" y2="310" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="265" y="302" text-anchor="middle" class="annotation-bold" fill="#ef4444">26.7% best</text>

  <line x1="415" y1="147" x2="415" y2="125" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="415" y="120" text-anchor="middle" class="annotation-bold" fill="#f59e0b">37.1% (was default)</text>

  <!-- Legend -->
  <circle cx="100" cy="365" r="5" fill="#ef4444"/>
  <text x="110" y="369" class="tick-label">New optimum (22 loops)</text>
  <circle cx="260" cy="365" r="5" fill="#f59e0b"/>
  <text x="270" y="369" class="tick-label">Previous default (31.696 loops)</text>
</svg>
