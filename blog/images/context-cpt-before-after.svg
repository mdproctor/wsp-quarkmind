<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
      .subtitle { fill: #52514e; font-size: 11px; }
      .cell-label { fill: #52514e; font-size: 9px; }
      .section-title { fill: #0b0b0b; font-size: 12px; font-weight: 600; }
      .bar-gateway { fill: #2a78d6; }
      .bar-macro { fill: #eb6834; }
      .bar-other { fill: #c3c2b7; }
      .outline { stroke: #e0dfdc; stroke-width: 0.5; fill: none; }
    </style>
  </defs>

  <!-- Left: Phase 4 Tiled -->
  <text x="155" y="24" text-anchor="middle" class="section-title">Phase 4: Tiled (uniform)</text>
  <text x="155" y="40" text-anchor="middle" class="subtitle">Same row copied 27 times</text>

  <!-- Three context bars, all identical -->
  <!-- Behind -->
  <text x="40" y="76" class="cell-label">behind</text>
  <rect x="80" y="62" width="152" height="20" class="bar-gateway" rx="2"/>
  <rect x="232" y="62" width="76" height="20" class="bar-macro" rx="2"/>
  <rect x="308" y="62" width="12" height="20" class="bar-other" rx="2"/>

  <!-- Even -->
  <text x="40" y="106" class="cell-label">even</text>
  <rect x="80" y="92" width="152" height="20" class="bar-gateway" rx="2"/>
  <rect x="232" y="92" width="76" height="20" class="bar-macro" rx="2"/>
  <rect x="308" y="92" width="12" height="20" class="bar-other" rx="2"/>

  <!-- Ahead -->
  <text x="40" y="136" class="cell-label">ahead</text>
  <rect x="80" y="122" width="152" height="20" class="bar-gateway" rx="2"/>
  <rect x="232" y="122" width="76" height="20" class="bar-macro" rx="2"/>
  <rect x="308" y="122" width="12" height="20" class="bar-other" rx="2"/>

  <!-- Equals signs -->
  <text x="160" y="168" text-anchor="middle" class="subtitle">Context has no effect — all rows identical</text>

  <!-- Right: Phase 5 Context-dependent -->
  <text x="485" y="24" text-anchor="middle" class="section-title">Phase 5: Context-dependent</text>
  <text x="485" y="40" text-anchor="middle" class="subtitle">Different distribution per context</text>

  <!-- Behind: defensive strategies dominate -->
  <text x="370" y="76" class="cell-label">behind</text>
  <rect x="410" y="62" width="190" height="20" class="bar-gateway" rx="2"/>
  <rect x="600" y="62" width="30" height="20" class="bar-macro" rx="2"/>
  <rect x="630" y="62" width="10" height="20" class="bar-other" rx="2"/>

  <!-- Even: balanced -->
  <text x="370" y="106" class="cell-label">even</text>
  <rect x="410" y="92" width="130" height="20" class="bar-gateway" rx="2"/>
  <rect x="540" y="92" width="80" height="20" class="bar-macro" rx="2"/>
  <rect x="620" y="92" width="20" height="20" class="bar-other" rx="2"/>

  <!-- Ahead: economic strategies dominate -->
  <text x="370" y="136" class="cell-label">ahead</text>
  <rect x="410" y="122" width="60" height="20" class="bar-gateway" rx="2"/>
  <rect x="470" y="122" width="140" height="20" class="bar-macro" rx="2"/>
  <rect x="610" y="122" width="30" height="20" class="bar-other" rx="2"/>

  <text x="490" y="168" text-anchor="middle" class="subtitle">Behind: aggressive responses. Ahead: macro play.</text>

  <!-- Legend -->
  <rect x="180" y="196" width="12" height="12" class="bar-gateway" rx="2"/>
  <text x="198" y="207" class="cell-label" font-size="11">GATEWAY_RUSH</text>
  <rect x="300" y="196" width="12" height="12" class="bar-macro" rx="2"/>
  <text x="318" y="207" class="cell-label" font-size="11">MACRO</text>
  <rect x="390" y="196" width="12" height="12" class="bar-other" rx="2"/>
  <text x="408" y="207" class="cell-label" font-size="11">Other</text>

  <!-- Divider -->
  <line x1="325" y1="50" x2="325" y2="180" stroke="#e0dfdc" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Bottom: the formula -->
  <rect x="80" y="230" width="480" height="72" rx="8" fill="#f5f4f2" stroke="#e0dfdc" stroke-width="1"/>
  <text x="320" y="254" text-anchor="middle" class="section-title">The blend formula</text>
  <text x="320" y="274" text-anchor="middle" font-size="13" fill="#0b0b0b" font-family="Georgia, serif">
    P = (n / (n + α)) · P_cell  +  (α / (n + α)) · P_marginal
  </text>
  <text x="320" y="292" text-anchor="middle" class="subtitle">Sparse cells regress toward Phase 4. Data-rich cells express the signal.</text>
</svg>
