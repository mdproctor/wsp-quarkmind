<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Hybrid CPT strategy: learned structure, selective parameter sources</text>

  <!-- Learned topology box -->
  <rect x="20" y="45" width="200" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Learned Topology</text>
  <text x="120" y="82" text-anchor="middle" font-size="10" fill="#64748b">(structure + observation CPTs)</text>

  <rect x="40" y="96" width="160" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120" y="113" text-anchor="middle" font-size="10" fill="#1e40af">gas_timing CPT ✓</text>

  <rect x="40" y="128" width="160" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120" y="145" text-anchor="middle" font-size="10" fill="#1e40af">first_building CPT ✓</text>

  <rect x="40" y="160" width="160" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="4,3"/>
  <text x="120" y="177" text-anchor="middle" font-size="10" fill="#991b1b">early_rush CPT ✗</text>

  <rect x="40" y="192" width="160" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="4,3"/>
  <text x="120" y="209" text-anchor="middle" font-size="10" fill="#991b1b">early_cheese CPT ✗</text>

  <!-- ONNX box -->
  <rect x="260" y="140" width="180" height="85" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="350" y="161" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">ONNX Detector CPTs</text>
  <text x="350" y="177" text-anchor="middle" font-size="10" fill="#b45309">(higher quality, neural net fitted)</text>

  <rect x="280" y="192" width="140" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="350" y="209" text-anchor="middle" font-size="10" fill="#92400e">early_rush: 0.85 → HIGH</text>

  <!-- Arrow from topology to runtime -->
  <line x1="220" y1="108" x2="480" y2="108" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="220" y1="140" x2="480" y2="128" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Arrow from ONNX to runtime -->
  <line x1="440" y1="182" x2="480" y2="168" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Runtime network box -->
  <rect x="480" y="45" width="200" height="180" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="580" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Runtime Network</text>
  <text x="580" y="82" text-anchor="middle" font-size="10" fill="#15803d">(best of both)</text>

  <rect x="500" y="96" width="160" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="580" y="113" text-anchor="middle" font-size="10" fill="#1e40af">gas_timing — tabular fit</text>

  <rect x="500" y="128" width="160" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="580" y="145" text-anchor="middle" font-size="10" fill="#1e40af">first_building — tabular fit</text>

  <rect x="500" y="160" width="160" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="580" y="177" text-anchor="middle" font-size="10" fill="#92400e">early_rush — ONNX override</text>

  <rect x="500" y="192" width="160" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="580" y="209" text-anchor="middle" font-size="10" fill="#92400e">early_cheese — ONNX override</text>

  <!-- Caption -->
  <text x="350" y="260" text-anchor="middle" font-size="11" fill="#475569">Structure from data. Observation parameters from tabular fitting.</text>
  <text x="350" y="276" text-anchor="middle" font-size="11" fill="#475569">Detector parameters from ONNX neural networks — higher fidelity, more training data.</text>
</svg>