<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="720" height="320" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">The Phantom Zergling Problem</text>

  <!-- SC2 Reality (left) -->
  <rect x="20" y="50" width="320" height="120" fill="#e8f5e9" stroke="#34a853" stroke-width="1.5" rx="6"/>
  <text x="180" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">SC2 Reality</text>

  <text x="40" y="100" font-size="11" fill="#333">1 train command → 2 Zerglings</text>
  <text x="40" y="120" font-size="11" fill="#333">Tracker emits: UnitBorn × 2</text>
  <text x="40" y="140" font-size="11" fill="#333">Supply cost: 1 total</text>
  <rect x="270" y="88" width="24" height="24" fill="#8bc34a" rx="3"/>
  <rect x="298" y="88" width="24" height="24" fill="#8bc34a" rx="3"/>
  <text x="282" y="130" font-size="9" fill="#333" text-anchor="middle">Z</text>
  <text x="310" y="130" font-size="9" fill="#333" text-anchor="middle">Z</text>

  <!-- Bug (right) -->
  <rect x="380" y="50" width="320" height="120" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5" rx="6"/>
  <text x="540" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#c5221f">Emulator (before fix)</text>

  <text x="400" y="100" font-size="11" fill="#333">2 TrainIntents × spawnCount=2</text>
  <text x="400" y="120" font-size="11" fill="#333">= 4 Zerglings (2× actual)</text>
  <text x="400" y="140" font-size="11" fill="#333">Supply cost: 2 (2× actual)</text>
  <rect x="618" y="88" width="20" height="20" fill="#ef9a9a" rx="3"/>
  <rect x="642" y="88" width="20" height="20" fill="#ef9a9a" rx="3"/>
  <rect x="666" y="88" width="20" height="20" fill="#ef9a9a" rx="3"/>
  <rect x="618" y="112" width="20" height="20" fill="#ef9a9a" rx="3"/>

  <!-- Fix (bottom) -->
  <rect x="140" y="195" width="440" height="105" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" rx="6"/>
  <text x="360" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">Fix: spawnCount = 1 when tracker-driven</text>

  <text x="160" y="245" font-size="11" fill="#333">Each UnitBorn → 1 TrainIntent → 1 unit spawned</text>
  <text x="160" y="265" font-size="11" fill="#333">2 UnitBorn events → 2 TrainIntents → 2 Zerglings ✓</text>
  <text x="160" y="285" font-size="11" fill="#333">Unit accuracy metric used min(emulated, GT) — hid the bug</text>

  <rect x="520" y="238" width="24" height="24" fill="#81c784" rx="3"/>
  <rect x="548" y="238" width="24" height="24" fill="#81c784" rx="3"/>
  <text x="532" y="278" font-size="9" fill="#333" text-anchor="middle">Z</text>
  <text x="560" y="278" font-size="9" fill="#333" text-anchor="middle">Z</text>
</svg>