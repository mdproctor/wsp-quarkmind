<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arrow-pipe" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Structure Learning Pipeline</text>

  <!-- Stage 1: Data -->
  <rect x="180" y="40" width="240" height="36" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  <text x="300" y="63" text-anchor="middle" fill="#333" font-weight="500">149K reconstituted replays</text>

  <line x1="300" y1="76" x2="300" y2="96" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- Stage 2: Extract -->
  <rect x="140" y="100" width="320" height="36" rx="6" fill="#e3f2fd" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="300" y="123" text-anchor="middle" fill="#1a5276" font-weight="500">Extract tabular data per phase × matchup</text>

  <line x1="300" y1="136" x2="300" y2="156" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- Stage 3: 9 partitions -->
  <rect x="160" y="160" width="280" height="30" rx="5" fill="#fff8e1" stroke="#f5a623" stroke-width="1.2"/>
  <text x="300" y="180" text-anchor="middle" fill="#8a6d3b" font-size="11">9 partitions: EARLY/MID/LATE × vs_P/vs_T/vs_Z</text>

  <line x1="300" y1="190" x2="300" y2="210" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- Stage 4: Variants (side by side) -->
  <rect x="20" y="215" width="120" height="50" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="80" y="235" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="500">PC</text>
  <text x="80" y="252" text-anchor="middle" fill="#2e7d32" font-size="10">unconstrained</text>

  <rect x="155" y="215" width="120" height="50" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="215" y="235" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="500">HC</text>
  <text x="215" y="252" text-anchor="middle" fill="#2e7d32" font-size="10">unconstrained</text>

  <rect x="290" y="215" width="120" height="50" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="350" y="235" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="500">HC</text>
  <text x="350" y="252" text-anchor="middle" fill="#2e7d32" font-size="10">constrained</text>

  <rect x="425" y="215" width="140" height="50" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="495" y="235" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="500">HC</text>
  <text x="495" y="252" text-anchor="middle" fill="#2e7d32" font-size="10">domain-seeded</text>

  <!-- Arrows from partitions to variants -->
  <line x1="220" y1="190" x2="80" y2="215" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>
  <line x1="260" y1="190" x2="215" y2="215" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>
  <line x1="340" y1="190" x2="350" y2="215" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>
  <line x1="380" y1="190" x2="495" y2="215" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>

  <!-- Stage 5: BIC comparison -->
  <line x1="80" y1="265" x2="300" y2="298" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>
  <line x1="215" y1="265" x2="300" y2="298" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>
  <line x1="350" y1="265" x2="300" y2="298" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>
  <line x1="495" y1="265" x2="300" y2="298" stroke="#4a90d9" stroke-width="1" marker-end="url(#arrow-pipe)"/>

  <rect x="170" y="300" width="260" height="40" rx="6" fill="#fce4ec" stroke="#e57373" stroke-width="1.2"/>
  <text x="300" y="318" text-anchor="middle" fill="#c62828" font-size="12" font-weight="600">BIC model selection</text>
  <text x="300" y="332" text-anchor="middle" fill="#c62828" font-size="10">vs hand-specified star baseline</text>

  <line x1="300" y1="340" x2="300" y2="360" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- Stage 6: Export -->
  <rect x="140" y="365" width="320" height="40" rx="6" fill="#4a90d9" stroke="#3a7bc8" stroke-width="1.5"/>
  <text x="300" y="384" text-anchor="middle" fill="white" font-weight="600" font-size="12">Export winning topology as NetworkSpec JSON</text>
  <text x="300" y="398" text-anchor="middle" fill="#cce5ff" font-size="10">+ drools_evidence augmentation</text>
</svg>
