<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="640" height="260" fill="#fafaf9" rx="8"/>

  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Wrong-Building-Type Rerouting</text>

  <!-- Intent box -->
  <rect x="20" y="55" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">TrainIntent</text>
  <text x="80" y="92" text-anchor="middle" font-size="9" fill="#3b82f6">MARINE → r-304</text>

  <!-- Arrow to lookup -->
  <line x1="140" y1="80" x2="175" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tag lookup -->
  <rect x="180" y="55" width="100" height="50" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Tag Lookup</text>
  <text x="230" y="92" text-anchor="middle" font-size="9" fill="#64748b">r-304 → Factory</text>

  <!-- Type check -->
  <rect x="310" y="55" width="100" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Type Check</text>
  <text x="360" y="88" text-anchor="middle" font-size="9" fill="#b45309">Factory ≠</text>
  <text x="360" y="100" text-anchor="middle" font-size="9" fill="#b45309">Barracks ✗</text>

  <line x1="280" y1="80" x2="305" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BEFORE: rejection path (top) -->
  <text x="520" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">BEFORE</text>
  <rect x="460" y="55" width="100" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">❌ Rejected</text>
  <text x="510" y="92" text-anchor="middle" font-size="9" fill="#dc2626">Marine lost</text>

  <line x1="410" y1="70" x2="455" y2="70" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- AFTER: reroute path (bottom) -->
  <text x="520" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">AFTER</text>
  <rect x="460" y="148" width="100" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="510" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Find Barracks</text>
  <text x="510" y="182" text-anchor="middle" font-size="9" fill="#16a34a">shortest queue</text>

  <path d="M 360 105 L 360 173 L 455 173" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

  <!-- Success -->
  <rect x="580" y="148" width="45" height="50" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="602" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">✓</text>

  <line x1="560" y1="173" x2="575" y2="173" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Stats bar -->
  <rect x="20" y="215" width="600" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="237" font-size="10" fill="#475569"><tspan font-weight="600">Result:</tspan> 354 rejections → 22 units rescued across all unit types. Marine accuracy 95.7% → 98.7%.</text>
</svg>
