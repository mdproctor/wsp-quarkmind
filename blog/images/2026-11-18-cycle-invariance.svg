<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Per-Worker Cycle Time: SC2 vs Emulator (Before Fix)</text>

  <!-- SC2 section -->
  <text x="20" y="62" font-size="13" font-weight="bold" fill="#2563eb">SC2 (Measured)</text>

  <!-- 8w bar -->
  <text x="20" y="90" font-size="11" fill="#555">8w (1/patch)</text>
  <rect x="120" y="76" width="464" height="20" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="352" y="90" text-anchor="middle" font-size="10" fill="#1e3a5f">115.5 loops — outbound 75.8 + inbound 39.9</text>
  <text x="590" y="90" font-size="11" fill="#2563eb" font-weight="bold">115.5 L</text>

  <!-- 12w bar -->
  <text x="20" y="116" font-size="11" fill="#555">12w (1.5/patch)</text>
  <rect x="120" y="102" width="466" height="20" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="353" y="116" text-anchor="middle" font-size="10" fill="#1e3a5f">116.1 loops — outbound 76.2 + inbound 39.9</text>
  <text x="592" y="116" font-size="11" fill="#2563eb" font-weight="bold">116.1 L</text>

  <!-- Delta annotation -->
  <line x1="600" y1="82" x2="600" y2="118" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="104" font-size="10" fill="#2563eb" font-weight="bold">0.6 loops</text>
  <text x="640" y="116" font-size="9" fill="#2563eb">difference</text>

  <!-- Divider -->
  <line x1="20" y1="140" x2="700" y2="140" stroke="#ddd" stroke-width="1"/>

  <!-- EM section -->
  <text x="20" y="168" font-size="13" font-weight="bold" fill="#dc2626">Emulator (Before Fix)</text>

  <!-- 8w bar -->
  <text x="20" y="196" font-size="11" fill="#555">8w (1/patch)</text>
  <rect x="120" y="182" width="451" height="20" rx="3" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
  <text x="346" y="196" text-anchor="middle" font-size="10" fill="#5f1e1e">112.6 loops — cycle too fast, +4.3% minerals</text>
  <text x="577" y="196" font-size="11" fill="#dc2626" font-weight="bold">112.6 L</text>

  <!-- 12w bar -->
  <text x="20" y="222" font-size="11" fill="#555">12w (1.5/patch)</text>
  <rect x="120" y="208" width="473" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="357" y="222" text-anchor="middle" font-size="10" fill="#14532d">118.0 loops — absorption makes cycle correct</text>
  <text x="599" y="222" font-size="11" fill="#16a34a" font-weight="bold">118.0 L</text>

  <!-- Gap annotation -->
  <path d="M571,192 L571,172 L593,172 L593,192" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="582" y="167" text-anchor="middle" font-size="9" fill="#dc2626">2.9 loops</text>
  <text x="582" y="157" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold">too fast</text>

  <!-- Divider -->
  <line x1="20" y1="246" x2="700" y2="246" stroke="#ddd" stroke-width="1"/>

  <!-- After fix -->
  <text x="20" y="274" font-size="13" font-weight="bold" fill="#16a34a">Emulator (After Fix)</text>

  <!-- 8w bar -->
  <text x="20" y="302" font-size="11" fill="#555">8w (1/patch)</text>
  <rect x="120" y="288" width="462" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="351" y="302" text-anchor="middle" font-size="10" fill="#14532d">~115.4 loops — +0.4% minerals (within tolerance)</text>
  <text x="588" y="302" font-size="11" fill="#16a34a" font-weight="bold">~115.4 L</text>

  <!-- 12w bar -->
  <text x="20" y="328" font-size="11" fill="#555">12w (1.5/patch)</text>
  <rect x="120" y="314" width="473" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="357" y="328" text-anchor="middle" font-size="10" fill="#14532d">118.0 loops — unchanged, bonus does not apply</text>
  <text x="599" y="328" font-size="11" fill="#16a34a" font-weight="bold">118.0 L</text>
</svg>
