<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="fa" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Scouting observations -->
  <rect x="10" y="30" width="130" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="75" y="50" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600">Scouting</text>
  <text x="75" y="65" text-anchor="middle" fill="#1e40af" font-size="11">observations</text>

  <!-- + detectors -->
  <rect x="10" y="100" width="130" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="75" y="120" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">ONNX detectors</text>
  <text x="75" y="135" text-anchor="middle" fill="#92400e" font-size="11">+ Drools rules</text>

  <!-- HypothesisTrackerFusion -->
  <rect x="185" y="50" width="160" height="70" rx="8" fill="#1e40af" stroke="none"/>
  <text x="265" y="75" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">HypothesisTracker</text>
  <text x="265" y="92" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Fusion</text>
  <text x="265" y="110" text-anchor="middle" fill="#93c5fd" font-size="10">opponent confidence ≥ 0.6?</text>

  <!-- arrows in -->
  <line x1="140" y1="55" x2="185" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="140" y1="125" x2="185" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- selectResponse -->
  <rect x="390" y="50" width="130" height="70" rx="8" fill="#15803d" stroke="none"/>
  <text x="455" y="75" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">selectResponse()</text>
  <text x="455" y="95" text-anchor="middle" fill="#86efac" font-size="10">context + opponent →</text>
  <text x="455" y="108" text-anchor="middle" fill="#86efac" font-size="10">our best strategy</text>

  <line x1="345" y1="85" x2="390" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- ScoutingIntelBroker -->
  <rect x="390" y="170" width="130" height="45" rx="6" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="455" y="190" text-anchor="middle" fill="#3730a3" font-size="11" font-weight="600">ScoutingIntel</text>
  <text x="455" y="204" text-anchor="middle" fill="#3730a3" font-size="11">Broker</text>

  <line x1="455" y1="120" x2="455" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- DroolsStrategyTask -->
  <rect x="565" y="170" width="120" height="45" rx="6" fill="#fce7f3" stroke="#f472b6"/>
  <text x="625" y="190" text-anchor="middle" fill="#9d174d" font-size="11" font-weight="600">Drools</text>
  <text x="625" y="204" text-anchor="middle" fill="#9d174d" font-size="11">Strategy DRL</text>

  <line x1="520" y1="192" x2="565" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Strategy decision -->
  <rect x="565" y="245" width="120" height="30" rx="15" fill="#f43f5e" stroke="none"/>
  <text x="625" y="265" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">ATTACK / MACRO</text>

  <line x1="625" y1="215" x2="625" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Context input -->
  <rect x="240" y="170" width="110" height="45" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="295" y="188" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">Game state</text>
  <text x="295" y="202" text-anchor="middle" fill="#166534" font-size="10">economy / army / tech</text>

  <line x1="295" y1="170" x2="420" y2="120" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fa)"/>
</svg>
