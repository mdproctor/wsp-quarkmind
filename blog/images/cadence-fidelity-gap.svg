  <rect x="226" y="264" width="22" height="0" class="em-bar"/>
  <rect x="252" y="244" width="22" height="20" class="em-bar"/>
  <rect x="278" y="244" width="22" height="20" class="em-bar"/>
  <rect x="304" y="244" width="22" height="20" class="em-bar"/>
  <rect x="330" y="264" width="22" height="0" class="em-bar"/>
  <rect x="356" y="244" width="22" height="20" class="em-bar"/>
  <rect x="382" y="244" width="22" height="20" class="em-bar"/>
  <rect x="408" y="244" width="22" height="20" class="em-bar"/>
  <rect x="434" y="264" width="22" height="0" class="em-bar"/>
  <rect x="460" y="244" width="22" height="20" class="em-bar"/>
  <rect x="486" y="244" width="22" height="20" class="em-bar"/>
  <rect x="512" y="244" width="22" height="20" class="em-bar"/>
  <rect x="538" y="264" width="22" height="0" class="em-bar"/>
  <rect x="564" y="244" width="22" height="20" class="em-bar"/>
  <rect x="590" y="244" width="22" height="20" class="em-bar"/>
  <rect x="616" y="244" width="22" height="20" class="em-bar"/>
  <rect x="642" y="264" width="22" height="0" class="em-bar"/>

  <!-- Annotations -->
  <text x="360" y="296" text-anchor="middle" class="label">← ticks →</text>

  <!-- Summary -->
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#555">Both produce 3460 minerals at tick 304. At 80% of individual ticks, the delivery count is different.</text>
</svg>
