  <line x1="30" y1="221" x2="690" y2="221" class="grid"/>
  <line x1="30" y1="244" x2="690" y2="244" class="grid"/>

  <!-- EM bars — uniform cadence (low variance, metronomic) -->
  <rect x="44" y="244" width="22" height="20" class="em-bar"/>
  <rect x="70" y="244" width="22" height="20" class="em-bar"/>
  <rect x="96" y="244" width="22" height="20" class="em-bar"/>
  <rect x="122" y="264" width="22" height="0" class="em-bar"/>
