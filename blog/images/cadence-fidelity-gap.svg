  <rect x="226" y="107" width="22" height="43" class="sc2-bar"/>
  <rect x="252" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="278" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="304" y="130" width="22" height="20" class="sc2-bar"/>
  <rect x="330" y="84" width="22" height="66" class="sc2-bar"/>
  <rect x="356" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="382" y="130" width="22" height="20" class="sc2-bar"/>
  <rect x="408" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="434" y="107" width="22" height="43" class="sc2-bar"/>
  <rect x="460" y="130" width="22" height="20" class="sc2-bar"/>
  <rect x="486" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="512" y="84" width="22" height="66" class="sc2-bar"/>
  <rect x="538" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="564" y="130" width="22" height="20" class="sc2-bar"/>
  <rect x="590" y="150" width="22" height="0" class="sc2-bar"/>
  <rect x="616" y="107" width="22" height="43" class="sc2-bar"/>
  <rect x="642" y="130" width="22" height="20" class="sc2-bar"/>

  <!-- EM panel -->
  <text x="30" y="186" class="label" font-weight="600">Emulated</text>
  <text x="680" y="186" class="label" text-anchor="end">σ ≈ 0.5</text>

  <!-- EM axis -->
  <line x1="30" y1="264" x2="690" y2="264" class="axis"/>
