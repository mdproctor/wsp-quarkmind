<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="check" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">After: Single Source of Truth, Validated by Tests</text>

  <!-- SC2 Game Data (ground truth, solid) -->
  <rect x="270" y="50" width="180" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">SC2 Game Data</text>
  <text x="360" y="86" text-anchor="middle" font-size="10" fill="#16a34a">patch 5.0.16 ground truth</text>

  <!-- Validation arrow to SC2Data -->
  <line x1="360" y1="94" x2="360" y2="128" stroke="#16a34a" stroke-width="2" marker-end="url(#check)"/>
  <text x="390" y="116" font-size="9" fill="#16a34a">calibration test</text>

  <!-- SC2Data.java (single source) -->
  <rect x="240" y="130" width="240" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">SC2Data.java</text>
  <text x="360" y="165" text-anchor="middle" font-size="10" fill="#16a34a">69 units ✓ — single source of truth</text>

  <!-- Arrows from SC2Data to consumers -->
  <line x1="280" y1="174" x2="120" y2="218" stroke="#16a34a" stroke-width="1.5" marker-end="url(#check)"/>
  <line x1="360" y1="174" x2="360" y2="218" stroke="#16a34a" stroke-width="1.5" marker-end="url(#check)"/>
  <line x1="440" y1="174" x2="600" y2="218" stroke="#16a34a" stroke-width="1.5" marker-end="url(#check)"/>

  <!-- Consumers -->
  <rect x="30" y="220" width="180" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="120" y="243" text-anchor="middle" font-size="11" fill="#166534">DamageCalculator</text>

  <rect x="240" y="220" width="240" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="360" y="237" text-anchor="middle" font-size="11" fill="#166534">LiveScoutingExtractor</text>
  <text x="360" y="251" text-anchor="middle" font-size="9" fill="#16a34a">queries SC2Data.unitAttributes()</text>

  <rect x="510" y="220" width="180" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="237" text-anchor="middle" font-size="11" fill="#166534">CPTs + supply costs</text>
  <text x="600" y="251" text-anchor="middle" font-size="9" fill="#16a34a">cross-validated</text>

  <!-- Cross-source validation -->
  <rect x="140" y="278" width="440" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="296" text-anchor="middle" font-size="12" font-weight="500" fill="#15803d">CrossSourceConsistencyTest</text>
  <text x="360" y="312" text-anchor="middle" font-size="11" fill="#166534">validates every downstream consumer agrees with SC2Data</text>
</svg>
