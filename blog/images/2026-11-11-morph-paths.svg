<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Two paths to morph — one enforces the tech tree, one doesn't</text>

  <!-- Left path: Emulated Game -->
  <rect x="40" y="60" width="280" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Emulated Game Path</text>

  <rect x="80" y="120" width="200" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="180" y="141" text-anchor="middle" font-size="12" fill="#475569">MorphIntent created</text>
  <line x1="180" y1="152" x2="180" y2="170" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="80" y="175" width="200" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="180" y="196" text-anchor="middle" font-size="12" fill="#475569">game.applyIntent()</text>
  <line x1="180" y1="207" x2="180" y2="225" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="60" y="230" width="240" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">No tech tree check</text>
  <text x="180" y="265" text-anchor="middle" font-size="11" fill="#92400e">Barracks not required</text>
  <line x1="180" y1="272" x2="180" y2="290" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="80" y="295" width="200" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">CC → OC ✓</text>

  <text x="180" y="355" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Always works — masks the real requirement</text>

  <!-- Right path: Real SC2 -->
  <rect x="400" y="60" width="280" height="36" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="540" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">Real SC2 Path</text>

  <rect x="440" y="120" width="200" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="540" y="141" text-anchor="middle" font-size="12" fill="#475569">sendActions(ability 1516)</text>
  <line x1="540" y1="152" x2="540" y2="170" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="420" y="175" width="240" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="540" y="194" text-anchor="middle" font-size="12" fill="#475569">SC2 checks tech tree:</text>
  <text x="540" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Barracks exists?</text>

  <!-- Branch: No Barracks -->
  <line x1="480" y1="217" x2="440" y2="250" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <text x="430" y="243" text-anchor="end" font-size="11" fill="#dc2626" font-weight="600">No</text>

  <rect x="380" y="255" width="130" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="445" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">NotSupported</text>

  <!-- Branch: Has Barracks -->
  <line x1="600" y1="217" x2="640" y2="250" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <text x="650" y="243" text-anchor="start" font-size="11" fill="#16a34a" font-weight="600">Yes</text>

  <rect x="570" y="255" width="130" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Success</text>
  <line x1="635" y1="287" x2="635" y2="300" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="570" y="305" width="130" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">CC → OC ✓</text>

  <text x="540" y="370" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Only works when the prerequisite is met</text>
</svg>
