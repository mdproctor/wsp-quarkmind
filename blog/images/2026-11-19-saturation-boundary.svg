<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .axis { stroke: #666; stroke-width: 1.5; fill: none; }
      .label { font-size: 11px; fill: #666; }
      .title { font-size: 13px; fill: #333; font-weight: 600; }
      .bar-sc2 { fill: #3498db; }
      .bar-em { fill: #e74c3c; }
      .gridline { stroke: #e8e8e8; stroke-width: 0.5; }
      .target { stroke: #27ae60; stroke-width: 1.5; stroke-dasharray: 6 3; }
      .target-label { font-size: 10px; fill: #27ae60; }
      .delta-text { font-size: 10px; fill: #333; font-weight: 600; }
      .legend-text { font-size: 11px; fill: #444; }
      .threshold { stroke: #f39c12; stroke-width: 1.5; stroke-dasharray: 4 2; }
      .threshold-label { font-size: 10px; fill: #f39c12; }
    </style>
  </defs>

  <text x="320" y="22" text-anchor="middle" class="title">Mineral accuracy by worker count — bonus threshold at 8 workers/8 patches</text>

  <g transform="translate(70, 38)">
    <!-- Grid -->
    <line x1="0" y1="0" x2="500" y2="0" class="gridline"/>
    <line x1="0" y1="40" x2="500" y2="40" class="gridline"/>
    <line x1="0" y1="80" x2="500" y2="80" class="gridline"/>
    <line x1="0" y1="120" x2="500" y2="120" class="gridline"/>
    <line x1="0" y1="160" x2="500" y2="160" class="gridline"/>
    <line x1="0" y1="200" x2="500" y2="200" class="gridline"/>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="200" class="axis"/>
    <line x1="0" y1="200" x2="500" y2="200" class="axis"/>

    <!-- Y-axis labels (minerals at tick 304) -->
    <text x="-8" y="204" text-anchor="end" class="label">0</text>
    <text x="-8" y="164" text-anchor="end" class="label">750</text>
    <text x="-8" y="124" text-anchor="end" class="label">1500</text>
    <text x="-8" y="84" text-anchor="end" class="label">2250</text>
    <text x="-8" y="44" text-anchor="end" class="label">3000</text>
    <text x="-55" y="100" text-anchor="middle" transform="rotate(-90, -55, 100)" class="label">minerals at tick 304</text>

    <!-- ±5% target band -->
    <!-- Threshold line at 8 workers -->
    <line x1="250" y1="0" x2="250" y2="200" class="threshold"/>
    <text x="253" y="12" class="threshold-label">bonus active ←    → bonus inactive</text>

    <!-- 4w bars -->
    <rect x="30" y="134" width="30" height="66" class="bar-sc2"/>
    <rect x="62" y="140" width="30" height="60" class="bar-em"/>
    <text x="61" y="218" text-anchor="middle" class="label">4w</text>
    <text x="61" y="130" text-anchor="middle" class="delta-text" fill="#e74c3c">-9.6%</text>

    <!-- 6w bars -->
    <rect x="130" y="105" width="30" height="95" class="bar-sc2"/>
    <rect x="162" y="110" width="30" height="90" class="bar-em"/>
    <text x="161" y="218" text-anchor="middle" class="label">6w</text>
    <text x="161" y="101" text-anchor="middle" class="delta-text" fill="#e74c3c">-5.0%</text>

    <!-- 8w bars -->
    <rect x="230" y="76" width="30" height="124" class="bar-sc2"/>
    <rect x="262" y="75" width="30" height="125" class="bar-em"/>
    <text x="261" y="218" text-anchor="middle" class="label">8w</text>
    <text x="261" y="72" text-anchor="middle" class="delta-text" fill="#27ae60">+0.4%</text>

    <!-- 10w bars -->
    <rect x="330" y="46" width="30" height="154" class="bar-sc2"/>
    <rect x="362" y="49" width="30" height="151" class="bar-em"/>
    <text x="361" y="218" text-anchor="middle" class="label">10w</text>
    <text x="361" y="43" text-anchor="middle" class="delta-text" fill="#27ae60">-1.7%</text>

    <!-- 12w bars -->
    <rect x="430" y="16" width="30" height="184" class="bar-sc2"/>
    <rect x="462" y="17" width="30" height="183" class="bar-em"/>
    <text x="461" y="218" text-anchor="middle" class="label">12w</text>
    <text x="461" y="13" text-anchor="middle" class="delta-text" fill="#27ae60">-0.3%</text>

    <!-- Legend -->
    <rect x="380" y="195" width="12" height="12" class="bar-sc2"/>
    <text x="396" y="206" class="legend-text">SC2</text>
    <rect x="430" y="195" width="12" height="12" class="bar-em"/>
    <text x="446" y="206" class="legend-text">EM</text>
  </g>
</svg>