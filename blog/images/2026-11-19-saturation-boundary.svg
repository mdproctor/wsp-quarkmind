<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .axis { stroke: #666; stroke-width: 1.5; fill: none; }
      .label { font-size: 11px; fill: #666; }
      .title { font-size: 13px; fill: #333; font-weight: 600; }
      .bar-sc2 { fill: #3498db; }
      .bar-em-before { fill: #e74c3c; opacity: 0.4; }
      .bar-em-after { fill: #e74c3c; }
      .gridline { stroke: #e8e8e8; stroke-width: 0.5; }
      .delta-text { font-size: 10px; fill: #333; font-weight: 600; }
      .legend-text { font-size: 11px; fill: #444; }
      .subtitle { font-size: 11px; fill: #888; }
    </style>
  </defs>

  <text x="320" y="22" text-anchor="middle" class="title">Mineral accuracy by worker count — before and after density scaling</text>
  <text x="320" y="38" text-anchor="middle" class="subtitle">SC2 baseline vs emulated game at tick 304</text>

  <g transform="translate(70, 50)">
    <!-- Grid -->
    <line x1="0" y1="0" x2="530" y2="0" class="gridline"/>
    <line x1="0" y1="40" x2="530" y2="40" class="gridline"/>
    <line x1="0" y1="80" x2="530" y2="80" class="gridline"/>
    <line x1="0" y1="120" x2="530" y2="120" class="gridline"/>
    <line x1="0" y1="160" x2="530" y2="160" class="gridline"/>
    <line x1="0" y1="200" x2="530" y2="200" class="gridline"/>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="200" class="axis"/>
    <line x1="0" y1="200" x2="530" y2="200" class="axis"/>

    <!-- Y-axis labels -->
    <text x="-8" y="204" text-anchor="end" class="label">0</text>
    <text x="-8" y="164" text-anchor="end" class="label">875</text>
    <text x="-8" y="124" text-anchor="end" class="label">1750</text>
    <text x="-8" y="84" text-anchor="end" class="label">2625</text>
    <text x="-8" y="44" text-anchor="end" class="label">3500</text>
    <text x="-55" y="100" text-anchor="middle" transform="rotate(-90, -55, 100)" class="label">minerals at tick 304</text>

    <!-- 4w: SC2=1125, EM-before=1245 (+10.7%), EM-after=1165 (+3.6%) -->
    <rect x="15" y="136" width="22" height="64" class="bar-sc2"/>
    <rect x="39" y="129" width="22" height="71" class="bar-em-before"/>
    <rect x="63" y="133" width="22" height="67" class="bar-em-after"/>
    <text x="50" y="218" text-anchor="middle" class="label">4w</text>
    <text x="50" y="123" text-anchor="middle" class="delta-text" fill="#e74c3c">+10.7→+3.6%</text>

    <!-- 6w: SC2=1695, EM-before=1785 (+5.3%), EM-after=1740 (+2.7%) -->
    <rect x="120" y="103" width="22" height="97" class="bar-sc2"/>
    <rect x="144" y="98" width="22" height="102" class="bar-em-before"/>
    <rect x="168" y="100" width="22" height="100" class="bar-em-after"/>
    <text x="155" y="218" text-anchor="middle" class="label">6w</text>
    <text x="155" y="92" text-anchor="middle" class="delta-text" fill="#e74c3c">+5.3→+2.7%</text>

    <!-- 8w: SC2=2330, EM-before=2340 (+0.4%), EM-after=2325 (-0.2%) -->
    <rect x="225" y="67" width="22" height="133" class="bar-sc2"/>
    <rect x="249" y="66" width="22" height="134" class="bar-em-before"/>
    <rect x="273" y="67" width="22" height="133" class="bar-em-after"/>
    <text x="260" y="218" text-anchor="middle" class="label">8w</text>
    <text x="260" y="60" text-anchor="middle" class="delta-text" fill="#27ae60">+0.4→−0.2%</text>

    <!-- 10w: SC2=2840, EM=2890 (+1.8%) unchanged -->
    <rect x="330" y="38" width="22" height="162" class="bar-sc2"/>
    <rect x="354" y="35" width="22" height="165" class="bar-em-before"/>
    <rect x="378" y="35" width="22" height="165" class="bar-em-after"/>
    <text x="365" y="218" text-anchor="middle" class="label">10w</text>
    <text x="365" y="29" text-anchor="middle" class="delta-text" fill="#27ae60">+1.8%</text>

    <!-- 12w: SC2=3460, EM=3450 (-0.3%) unchanged -->
    <rect x="435" y="2" width="22" height="198" class="bar-sc2"/>
    <rect x="459" y="3" width="22" height="197" class="bar-em-before"/>
    <rect x="483" y="3" width="22" height="197" class="bar-em-after"/>
    <text x="470" y="218" text-anchor="middle" class="label">12w</text>
    <text x="470" y="-4" text-anchor="middle" class="delta-text" fill="#27ae60">−0.3%</text>

    <!-- Legend -->
    <rect x="140" y="230" width="12" height="12" class="bar-sc2"/>
    <text x="156" y="241" class="legend-text">SC2 baseline</text>
    <rect x="250" y="230" width="12" height="12" class="bar-em-before"/>
    <text x="266" y="241" class="legend-text">EM (flat bonus)</text>
    <rect x="370" y="230" width="12" height="12" class="bar-em-after"/>
    <text x="386" y="241" class="legend-text">EM (density scaling)</text>
  </g>
</svg>
