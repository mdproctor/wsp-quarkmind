<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .box { rx: 6; ry: 6; stroke-width: 1.5; }
      .box-event { fill: #fef2f2; stroke: #ef4444; }
      .box-extract { fill: #f0f9ff; stroke: #3b82f6; }
      .box-intent { fill: #fefce8; stroke: #ca8a04; }
      .box-effect { fill: #f0fdf4; stroke: #22c55e; }
      .box-state { fill: #f8fafc; stroke: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .label { font-size: 11px; fill: #334155; text-anchor: middle; }
      .label-sm { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
      .label-code { font-size: 10px; fill: #7c3aed; font-family: 'JetBrains Mono', 'Fira Code', monospace; text-anchor: middle; }
      .title { font-size: 13px; fill: #334155; font-weight: 600; text-anchor: middle; }
      .section { font-size: 11px; fill: #64748b; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1"/>
    </marker>
  </defs>

  <text x="370" y="22" class="title">Unit death pipeline: replay tracker event → emulated state cleanup</text>

  <!-- Row 1: Tracker events -->
  <text x="50" y="60" class="section">REPLAY</text>
  <rect x="110" y="44" width="120" height="40" class="box box-event"/>
  <text x="170" y="60" class="label">UnitBorn</text>
  <text x="170" y="74" class="label-code">tag=r-4-1</text>

  <text x="310" y="60" class="label-sm">· · ·  game time  · · ·</text>

  <rect x="390" y="44" width="120" height="40" class="box box-event"/>
  <text x="450" y="60" class="label">UnitDied</text>
  <text x="450" y="74" class="label-code">tag=r-4-1</text>

  <!-- Arrow down from UnitBorn -->
  <path d="M170,84 L170,120" class="arrow"/>
  <path d="M450,84 L450,120" class="arrow"/>

  <!-- Row 2: Extractor -->
  <text x="50" y="140" class="section">EXTRACT</text>
  <rect x="100" y="122" width="140" height="40" class="box box-extract"/>
  <text x="170" y="138" class="label">TrainIntent</text>
  <text x="170" y="152" class="label-code">replayUnitTag=r-4-1</text>

  <rect x="380" y="122" width="140" height="40" class="box box-extract"/>
  <text x="450" y="138" class="label">UnitDiedIntent</text>
  <text x="450" y="152" class="label-code">unitTag=r-4-1</text>

  <!-- Arrow down -->
  <path d="M170,162 L170,198" class="arrow"/>
  <path d="M450,162 L450,198" class="arrow"/>

  <!-- Row 3: EmulatedGame -->
  <text x="50" y="218" class="section">EMULATE</text>
  <rect x="100" y="200" width="140" height="40" class="box box-intent"/>
  <text x="170" y="216" class="label">startTraining()</text>
  <text x="170" y="230" class="label-sm">spawns unit as r-4-1</text>

  <rect x="380" y="200" width="140" height="40" class="box box-intent"/>
  <text x="450" y="216" class="label">handleUnitDied()</text>
  <text x="450" y="230" class="label-sm">finds unit by r-4-1</text>

  <!-- Arrow down -->
  <path d="M170,240 L170,260" class="arrow"/>
  <path d="M450,240 L450,260" class="arrow"/>

  <!-- Row 4: State effects -->
  <rect x="100" y="260" width="140" height="28" class="box box-effect"/>
  <text x="170" y="278" class="label">+unit, +supply</text>

  <rect x="380" y="260" width="140" height="28" class="box box-effect"/>
  <text x="450" y="278" class="label">−unit, −supply</text>

  <!-- Connecting dotted line showing tag identity -->
  <line x1="230" y1="142" x2="380" y2="142" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="305" y="138" class="label-sm" style="fill:#ca8a04">same tag</text>

  <!-- Side annotation -->
  <rect x="570" y="122" width="150" height="56" class="box box-state"/>
  <text x="645" y="140" class="label" style="font-weight:600">Tag identity</text>
  <text x="645" y="155" class="label-sm">Birth and death events</text>
  <text x="645" y="167" class="label-sm">share the same tag — the</text>
  <text x="645" y="179" class="label-sm">emulator preserves it</text>
</svg>
