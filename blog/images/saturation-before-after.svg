<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>

  <rect width="680" height="400" rx="8" fill="url(#bg)"/>

  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">Saturation Curve: Before and After</text>
  <text x="340" y="46" text-anchor="middle" font-size="10" fill="#6c757d">Three targeted physics fixes, no pathfinding needed</text>

  <g transform="translate(90, 70)">
    <!-- Axes -->
    <line x1="0" y1="260" x2="500" y2="260" stroke="#adb5bd" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#adb5bd" stroke-width="1"/>

    <!-- Y-axis labels -->
    <text x="-10" y="30" text-anchor="end" font-size="10" fill="#495057">+5%</text>
    <text x="-10" y="80" text-anchor="end" font-size="10" fill="#495057">0%</text>
    <text x="-10" y="130" text-anchor="end" font-size="10" fill="#495057">-5%</text>
    <text x="-10" y="180" text-anchor="end" font-size="10" fill="#495057">-15%</text>
    <text x="-10" y="230" text-anchor="end" font-size="10" fill="#495057">-25%</text>
    <text x="-55" y="140" text-anchor="middle" font-size="11" fill="#495057" transform="rotate(-90, -55, 140)">Mineral income gap vs SC2</text>

    <!-- Grid lines -->
    <line x1="0" y1="30" x2="500" y2="30" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="80" x2="500" y2="80" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="130" x2="500" y2="130" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="180" x2="500" y2="180" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="230" x2="500" y2="230" stroke="#dee2e6" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- X-axis labels -->
    <text x="100" y="278" text-anchor="middle" font-size="10" fill="#495057">1.0</text>
    <text x="200" y="278" text-anchor="middle" font-size="10" fill="#495057">1.5</text>
    <text x="300" y="278" text-anchor="middle" font-size="10" fill="#495057">2.0</text>
    <text x="400" y="278" text-anchor="middle" font-size="10" fill="#495057">2.5</text>
    <text x="500" y="278" text-anchor="middle" font-size="10" fill="#495057">3.0</text>
    <text x="300" y="298" text-anchor="middle" font-size="11" fill="#495057">Workers per mineral patch</text>

    <!-- BEFORE curve (dashed, red) -->
    <path d="M 200,77 C 240,82 260,95 300,221 C 330,185 370,165 400,159"
          fill="none" stroke="#dc3545" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>

    <!-- AFTER curve (solid, green) -->
    <path d="M 200,57 C 240,60 260,65 300,92 C 330,88 370,84 400,82"
          fill="none" stroke="#28a745" stroke-width="2.5" stroke-linecap="round"/>

    <!-- BEFORE points -->
    <circle cx="200" cy="77" r="6" fill="#dc3545" opacity="0.5" stroke="white" stroke-width="1.5"/>
    <circle cx="300" cy="221" r="6" fill="#dc3545" opacity="0.5" stroke="white" stroke-width="1.5"/>
    <circle cx="400" cy="159" r="6" fill="#dc3545" opacity="0.5" stroke="white" stroke-width="1.5"/>

    <!-- BEFORE labels -->
    <text x="215" y="92" font-size="9" fill="#dc3545" opacity="0.7">+0.6%</text>
    <text x="315" y="236" font-size="9" fill="#dc3545" opacity="0.7">−20.2%</text>
    <text x="415" y="174" font-size="9" fill="#dc3545" opacity="0.7">−12.9%</text>

    <!-- AFTER points -->
    <circle cx="200" cy="57" r="8" fill="#28a745" stroke="white" stroke-width="2"/>
    <circle cx="300" cy="92" r="8" fill="#28a745" stroke="white" stroke-width="2"/>
    <circle cx="400" cy="82" r="8" fill="#28a745" stroke="white" stroke-width="2"/>

    <!-- AFTER labels -->
    <text x="200" y="47" text-anchor="middle" font-size="10" font-weight="600" fill="#28a745">+2.3%</text>
    <text x="300" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#28a745">−1.2%</text>
    <text x="400" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#28a745">−0.5%</text>

    <!-- Scenario labels -->
    <text x="200" y="110" text-anchor="middle" font-size="9" fill="#495057">12w mineral</text>
    <text x="300" y="110" text-anchor="middle" font-size="9" fill="#495057">16w saturation</text>
    <text x="400" y="110" text-anchor="middle" font-size="9" fill="#495057">3w gas</text>

    <!-- Arrow showing improvement -->
    <line x1="300" y1="215" x2="300" y2="100" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="310" y="160" font-size="9" fill="#28a745" font-weight="500">19pp</text>

    <!-- Legend -->
    <line x1="340" y1="250" x2="360" y2="250" stroke="#dc3545" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
    <text x="365" y="254" font-size="9" fill="#495057">Before (collision penalty)</text>
    <line x1="340" y1="240" x2="360" y2="240" stroke="#28a745" stroke-width="2.5"/>
    <text x="365" y="244" font-size="9" fill="#495057">After (lockout bypass + approach + cap)</text>
  </g>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#28a745"/>
    </marker>
  </defs>
</svg>
